# Generated by web-tools concept-index. Template version: 1.
# Re-run the concept-index installer to update this file.
name: Concept index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '.github/workflows/concept-index.yml'

permissions:
  contents: write

concurrency:
  group: concept-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch analyzer
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/mehrlander/web-tools/main/.claude/skills/concept-index/index_repo.py \
            -o "$RUNNER_TEMP/concept-index.py"

      - name: Build index
        run: python "$RUNNER_TEMP/concept-index.py"

      - name: Commit changed index
        run: |
          git add .concept-index/index.json
          if git diff --cached --quiet; then
            echo 'Concept index unchanged.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'refresh concept index'
            git push
          fi
