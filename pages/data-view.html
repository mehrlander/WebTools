<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data View</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>">
<!--
  data-view.html — the renderer behind the #data= toss route. Where
  toss-render's address and payload modes render a PAGE, this renders DATA:
  a CSV, a JSON array, a markdown file, a text log, either addressed in a repo
  or carried inline, shown through the shared multi-mode viewer
  (alpineComponents/viewer.js) so the mode strip, syntax highlighting,
  Tabulator table, and JSON tree all come for free.

  Data sources, first match wins:
    #gz=<base64url>   gzipped payload in the fragment (private-safe: the
                      fragment never reaches a server)
    ?src=<spec>       payload fetched via the contents API; a plain path is
                      this repo, or owner/repo[@ref]:path
    (neither)         a built-in demo envelope
  Each key is read fragment first, query as fallback (lib/kits/url-params.js), so
  ?gz= and #src= work too. Prefer the forms above: the payload wants '#'
  because a query string is capped at roughly 8KB by the Pages edge, and the
  address arrives as ?src= from a routed toss's params shim.

  One more key selects WITHIN a payload, and is written back as the reader
  moves, so the address bar always names what is on screen:
    #item=<name|index>   all digits is an index, anything else is a name
                         (full name first, then basename). A miss opens item 0
                         rather than erroring.
  Through a routed toss it is the trailing fragment of the route:
    …/toss-render.html#data=<owner>/<repo>:<bundle.json>#item=raw.csv

  Two payload shapes, told apart by lib/kits/data-payload.js and handled the same
  way from here on:
    BARE      a CSV, a JSON array, any bytes. One item; the viewer's module
              tests decide how to show it. An addressed payload keeps its
              path, so its extension (and its GitHub/Raw/CDN links) are real;
              an inline one is named by sniff.
    ENVELOPE  a JSON object with an `items` array. Several files in one toss,
              each optionally naming a default `view` (a viewer module id:
              raw / code / preview / table / tree) and a `note`. An item
              carries `content` inline or points at `src`, per item, so one
              envelope can mix the two.

  The route form is …/toss-render.html#data=<owner>/<repo>[@<ref>]:<path>,
  which toss-render resolves into this page's ?src=. Reaching this page
  directly with ?src= or #gz= works the same; the route is shorthand, not a
  separate path. Contract and examples: docs/envelopes/data-view.md.

  ?use=<ref> pins the lib chain to a branch/tag/sha for previewing edits.
-->
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5,npm/@tailwindcss/typography/dist/typography.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<style>[x-cloak]{display:none}</style>
<script type="module">
  // ?use=<branch|tag|sha> picks which ref the lib chain loads from; defaults
  // to main. gh-api.js auto-boots window.gh from its import URL or window.__ghBlobBoot.
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('kits/url-params.js');
  // The owner/repo[@ref]:path grammar, which data-payload.js delegates to.
  await gh.load('kits/repo-address.js');
  await gh.load('kits/data-payload.js');
  await gh.load('alpineComponents/viewer.js');

  const gunzipB64url = async s => {
    const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (s.length % 4)) % 4);
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  };

  // spec -> text. A plain path reads this repo through gh.get (which already
  // falls back to the git blobs API over 1 MB); a cross-repo spec takes the
  // same fallback here, since a data file is exactly the kind that runs large.
  const fetchText = async spec => {
    const s = DataPayload.parseSpec(spec);
    if (!s) return (await gh.get(spec)).text;
    // An address with no @ref parses as '' now, and the contents API resolves
    // the repo's default branch when the parameter is absent. Sending an empty
    // one instead is not the same request, so omit it.
    const at = s.ref ? `?ref=${encodeURIComponent(s.ref)}` : '';
    const data = await gh.req(`/repos/${s.repo}/contents/${s.path}${at}`);
    if (Array.isArray(data)) throw new Error('that path is a directory, not a file');
    const content = data.content || (await gh.req(`/repos/${s.repo}/git/blobs/${data.sha}`)).content;
    return gh.decode(content);
  };

  // What an item opens in when it doesn't say. The viewer's function form of
  // defaultMode gets the file, so the choice can read the content, not just
  // the extension: a JSON array is a table, a JSON object is a tree. Anything
  // unavailable for the file falls back to raw inside the viewer's resolver,
  // so this never has to check what a mode supports.
  const AUTO_VIEW = (f) => {
    if (f.ext === 'json') return f.content.trim().startsWith('[') ? 'table' : 'tree';
    if (f.ext === 'csv' || f.ext === 'tsv') return 'table';
    if (f.ext === 'md') return 'preview';
    return 'raw';
  };

  window.app = () => ({
    payload: null,
    error: '',
    sel: 0,
    srcSpec: '',
    // The two viewport levers (task data-view-mobile-chrome): on a phone the
    // notes are the cost, not the controls (measured 2026-07-25: 132px of the
    // 280 was prose), so below sm they collapse behind the info toggle. bleed
    // hands the whole viewport to the viewer; still NOT written to the hash,
    // now for a settled reason rather than a reserved one: the fragment
    // vocabulary is `item`, and it addresses WHAT is being read. A viewport
    // preference is not part of that address and would ride along on every
    // copied link.
    notesOpen: false,
    bleed: false,
    get hasNotes() {
      return !!(this.payload?.note || this.items.some(it => it.note));
    },

    async init() {
      try {
        // Fragment first, query as fallback, per key (lib/kits/url-params.js): the
        // payload wants '#' for size and privacy, while ?src= is how a routed
        // toss delivers an address through toss-render's params shim.
        const gz = UrlParams.get('gz');
        const src = UrlParams.get('src');
        if (gz) {
          this.payload = DataPayload.read(await gunzipB64url(gz));
        } else if (src) {
          this.srcSpec = src;
          const parsed = DataPayload.parseSpec(src);
          // Hand the reader the path so a bare payload keeps its real
          // extension instead of being sniffed from its bytes.
          this.payload = DataPayload.read(await fetchText(src), { name: parsed ? parsed.path : src });
          // A bare addressed payload has a true home: give its one item the
          // spec so the viewer's GitHub/Raw/CDN links resolve.
          if (this.payload.kind === 'bare' && parsed) {
            Object.assign(this.payload.items[0], { src, spec: parsed, name: parsed.path });
          }
        } else {
          this.payload = DataPayload.read(JSON.stringify(window.DEMO_PAYLOAD));
        }
      } catch (e) { this.error = e.message || String(e); return; }

      document.title = this.title;
      // #item=<name|index> addresses one item of an envelope. A miss opens
      // item 0 rather than erroring, and only a URL that already named an item
      // gets its address written back, so a plain #gz= toss is never rewritten
      // on load just for arriving.
      const asked = UrlParams.get('item');
      this.$nextTick(() => this.open(DataPayload.resolveItem(this.items, asked) ?? 0, asked != null));
    },

    get items() { return this.payload?.items || []; },
    get item() { return this.items[this.sel] || null; },
    get title() {
      if (this.payload?.title) return this.payload.title;
      if (this.srcSpec) return 'Data · ' + (DataPayload.parseSpec(this.srcSpec)?.path || this.srcSpec).split('/').pop();
      return 'Data View';
    },
    label: it => it.name.split('/').pop(),

    // The #item= vocabulary is the ENVELOPE's, not this page's, so both
    // directions live in lib/kits/data-payload.js beside the rest of what an item
    // means (DataPayload.resolveItem / .addressItem, held by npm test). What
    // stays here is the half that touches a URL.

    // Write the selection back, so the address bar tracks the view and a
    // reader can copy the address of what they are looking at. replaceState
    // keeps item clicks out of the back stack, and it must take an ABSOLUTE
    // URL: inside a toss a relative one resolves against the stamped <base>
    // and throws (task history-safe-toss-render-shim). In a #gz= toss the
    // frame is opaque-origin, where replaceState throws outright, so the plain
    // assignment is the fallback rather than the exception. UrlParams.withKey
    // edits the one key and leaves the payload beside it alone; the '#' seeds
    // an empty fragment so the result comes back in fragment form.
    addressItem(i) {
      const frag = UrlParams.withKey(location.hash || '#', 'item',
                                     DataPayload.addressItem(this.items, i));
      if (frag === location.hash) return;
      try { history.replaceState(null, '', location.href.split('#')[0] + frag); }
      catch (e) { location.hash = frag; }
    },

    // Show item i, fetching its src on first open. The viewer is driven
    // imperatively through the handle it stashes on its own root, the same
    // way the stage's preview modal drives it. `address` is false only on the
    // load path, where the URL is the reader's, not ours to normalize.
    async open(i, address = true) {
      const it = this.items[i];
      if (!it) return;
      this.sel = i;
      this.error = '';
      // A one-item payload has nothing to address; a bare CSV should not grow
      // a fragment for being looked at.
      if (address && this.items.length > 1) this.addressItem(i);
      if (it.content == null && it.src) {
        try { it.content = await fetchText(it.src); }
        catch (e) { this.error = `Could not read ${it.src}: ${e.message || e}`; return; }
      }
      const v = document.getElementById('dv-viewer')?.__viewer;
      if (!v) return;
      // An item that lives in a repo shows its path and gets real links; an
      // inline one is local, so the viewer offers none.
      v.defaultMode = it.view || AUTO_VIEW;
      const name = it.spec ? it.spec.path : it.name;
      await v.show(name, it.content ?? '', it.spec ? { repo: it.spec.repo, ref: it.spec.ref } : { local: true });
    },
  });

  await gh.load('alpine-bundle.js');
</script>
</head>
<body class="h-dvh m-0 bg-base-200">
<!-- Bleed collapses the spacing by inline style rather than by class: a p-0
     layered beside the static px-4 would leave the winner to Tailwind's
     stylesheet order, and an inline style wins outright. The static classes
     stay, so nothing flashes unpadded before Alpine starts. -->
<div x-data="app()" x-init="init()" class="h-full flex flex-col mx-auto px-4 py-4 gap-3 max-w-6xl"
     :style="bleed ? 'padding:0; gap:0; max-width:none' : ''">

  <!-- error. GitHub answers 404 (not 401) for a private repo fetched with no
       token, so gh-auth's automatic prompt never fires here; offer it. -->
  <div x-show="error" x-cloak class="alert alert-error text-sm shrink-0" role="alert">
    <i class="ph ph-warning-circle"></i>
    <div>
      <div x-text="error"></div>
      <div class="text-xs opacity-70 mt-0.5" x-show="/404|401|403/.test(error)">
        A 404 on a private repo usually means no GitHub token is stored in this browser.
      </div>
    </div>
    <button class="btn btn-xs" x-show="/404|401|403/.test(error) && window.ghAuth"
            @click="ghAuth.prompt('Token needed to read this payload')">Set token</button>
  </div>

  <!-- loading -->
  <div x-show="!payload && !error" class="flex items-center gap-2 opacity-50 text-sm py-12 justify-center">
    <span class="loading loading-spinner loading-sm"></span> Loading data…
  </div>

  <template x-if="payload">
    <div class="flex flex-col flex-1 min-h-0 gap-3">

      <!-- header: the envelope's title and note, or the addressed file's name.
           A bare payload usually says everything in the viewer's own header,
           so this stays quiet unless there is something to add. Below sm the
           notes (the envelope's and the selected item's) collapse behind the
           info toggle: measured 2026-07-25, prose was 132px of the 280px of
           phone chrome while every control cost under 5%. -->
      <header class="shrink-0" x-show="!bleed && (payload.title || payload.note || srcSpec)">
        <div class="flex items-baseline gap-2 flex-wrap">
          <h1 class="text-lg font-semibold" x-text="title"></h1>
          <span x-show="srcSpec" class="badge badge-ghost badge-sm font-mono" x-text="srcSpec"></span>
          <span class="badge badge-sm" :class="payload.kind === 'envelope' ? 'badge-primary' : 'badge-ghost'"
                x-text="payload.kind === 'envelope' ? 'envelope' : 'data'"></span>
          <div class="grow"></div>
          <button x-show="hasNotes" @click="notesOpen = !notesOpen"
                  class="sm:hidden btn btn-ghost btn-xs btn-circle self-center" :class="notesOpen && 'text-primary'"
                  :title="notesOpen ? 'Tuck the notes away' : 'Show the notes'">
            <i class="ph ph-info text-base"></i></button>
          <button @click="bleed = true" class="btn btn-ghost btn-xs btn-circle self-center"
                  title="Full-bleed: give the whole viewport to the data">
            <i class="ph ph-arrows-out-simple text-base"></i></button>
        </div>
        <p x-show="payload.note" x-text="payload.note" class="text-sm opacity-70 mt-1"
           :class="!notesOpen && 'hidden sm:block'"></p>
      </header>

      <!-- item strip: only earns its space when the payload carries more than
           one item, which only an envelope can. It stays out of the note
           demotion on purpose: the 36px strip is how a phone reader knows the
           payload has three files. -->
      <div x-show="!bleed && items.length > 1" class="shrink-0 flex gap-1 overflow-x-auto pb-1">
        <template x-for="(it, i) in items" :key="i">
          <button @click="open(i)" :title="it.note || it.name"
                  class="btn btn-sm shrink-0 font-mono font-normal"
                  :class="sel === i ? 'btn-primary' : 'btn-ghost'">
            <span x-text="label(it)"></span>
          </button>
        </template>
      </div>

      <!-- the selected item's note, when it has one to add -->
      <p x-show="!bleed && item && item.note && items.length > 1" x-text="item?.note"
         class="shrink-0 text-sm opacity-70 -mt-1" :class="!notesOpen && 'hidden sm:block'"></p>

      <!-- the way back from full-bleed, floating because the header it would
           live in is exactly what bleed removes. Bottom-LEFT, mirroring the
           FAB's bottom-right: the top corners belong to the viewer's own
           header controls, which a fixed chip there was measured to cover.
           Entry lives in the page header, so a bare gz payload with no header
           never shows either control; that case measured fine (56px of
           chrome) and has nothing to bleed away. -->
      <button x-show="bleed" x-cloak @click="bleed = false"
              class="fixed bottom-2 left-2 z-40 btn btn-ghost btn-sm btn-circle bg-base-100/70 border border-base-300 shadow-sm"
              title="Back to the page chrome">
        <i class="ph ph-arrows-in-simple text-base"></i></button>

      <!-- the shared viewer, embedded: bindStore false so it doesn't track a
           Files view that isn't here, fill so it grows to this column. It
           carries its own header (name, size, mode strip, links). -->
      <div id="dv-viewer" class="flex flex-col flex-1 min-h-0"
           x-data="viewer({ bindStore: false, fill: true })"></div>
    </div>
  </template>
</div>

<script>
// Built-in demo payload: what the page shows with no ?src= and no #gz=.
// Doubles as living documentation of the envelope (docs/envelopes/data-view.md),
// and exercises three of the viewer's modes from one toss.
window.DEMO_PAYLOAD = {
  kind: 'data-view/1',
  title: 'Data View demo',
  note: 'Pass ?src=<owner/repo[@ref]:path> or #gz=<payload>, or toss it as #data= through toss-render. This envelope is inline; items can point at src instead.',
  items: [
    {
      name: 'contributions.csv',
      view: 'table',
      note: 'A delimited file opens as a real table, header filters and all.',
      content: 'plan,members,employer_rate,employee_rate\nPERS 2,158204,9.11,6.36\nPERS 3,88417,9.11,5.00\nTRS 2,42188,10.29,8.05\nTRS 3,79330,10.29,8.05\nSERS 2,19844,10.15,7.76\nSERS 3,33902,10.15,7.76\nLEOFF 2,18461,8.59,8.59\n'
    },
    {
      name: 'shape.json',
      view: 'tree',
      note: 'JSON opens in the tree editor; the table mode is offered too when it is an array.',
      content: '{\n  "source": "demo",\n  "grain": "plan",\n  "columns": ["plan", "members", "employer_rate", "employee_rate"],\n  "nested": { "note": "the tree mode is the one worth having for shapes like this" }\n}'
    },
    {
      name: 'README.md',
      view: 'preview',
      note: 'Markdown renders; the raw and code modes stay one tap away.',
      content: '# Reading a data toss\n\nTwo shapes, one page.\n\n- **Bare**: send the bytes. A `.csv` gets a table, a `.json` gets a tree, anything else gets raw or code.\n- **Envelope**: send a JSON object with an `items` array when you want several files, a default view per item, or a note.\n\nNeither has to be declared. The reader tells them apart.\n'
    }
  ]
};
</script>
</body>
</html>
