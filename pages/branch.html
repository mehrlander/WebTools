<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌿</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  branch.html — one branch as a page.

  Every other branch surface here is a LIST (the estate's Open view, the
  per-repo Branches view, the FAB's render tab), and every one of them ends in
  a link out to github.com because there was nowhere of ours to go. This is the
  destination those rows were missing.

  Address grammar, reusing kits/review-target.js unchanged (the toss #gh= form
  plus a base), fragment preferred and query accepted:

    #gh=owner/repo@branch            the branch, against the repo's default
    ...&base=main                    an explicit base
    #gh=owner/repo&pr=364            a PR: its own head and base, opened on it
    #gh=owner/repo                   opens the form prefilled

  A pasted https://github.com/owner/repo/pull/<n> URL resolves the same way, so
  the address bar takes a PR link straight from GitHub.

  Three layers, and the split is the point:

    DERIVED   read from the API on every load: state, ahead/behind, lifespan,
              authoring sessions, the PRs, commits, the changed files. Because
              nothing here is authored, nothing here can be stale, and the page
              needs no sync step. A link to it is current whenever it is opened,
              which a hand-maintained markdown body can never promise.

    GUIDE     the PR body, rendered here rather than linked away to. That body
              is where the judgment has always been written, so this page reads
              it rather than asking for the same judgment a second time in a
              second format. Rendered by kits/guide-render.js, the renderer the
              FAB drawer uses, which re-aims each file link at what can show the
              file and lifts them into a chip strip. Arrows step through every
              PR the branch has had, since a merge ends a PR but not a branch.

    AUTHORED  an optional envelope carrying what the API cannot know, for a
              branch with no PR to carry it: intent, what is open, what was left
              out, a note per file. Delivered the way the rest of the envelope
              family is (docs/envelopes/):

                ?src=<owner/repo[@ref]:path>   fetched through the contents API
                #gz=<base64url>                gzipped into the fragment

              Discriminated bare-vs-envelope by BranchBrief.readAuthored rather
              than by asking, mirroring lib/kits/data-payload.js. A `branch-review/1`
              surface is accepted as well as the plain form.

  The layers are independent: a branch with neither a PR nor an envelope renders
  completely, and each of the other two only ever adds.

  Per-file cards are alpineComponents/file-review.js, the same dossier
  pages/review.html mounts, so a file reads identically in both places.

  Token: like every #gh= address here, a private repo or un-deployed branch
  renders only in a browser holding the viewer's ghToken. Public repos read
  anonymously.

  ?use=<branch|tag|sha> pins this page's own lib chain to a ref, fetched from
  raw.githubusercontent with `cache: 'no-store'`. Both halves are needed: the
  blob import defeats the MODULE cache, and no-store defeats the HTTP one. A
  branch ref MOVES, so a plain fetch happily served a bundle from an earlier
  push and the preview showed old code with no way to tell (2026-08-07).
-->
<!--
  The ready gate, and why it is a plain script ABOVE the module.

  Importing the pre-build boots Alpine as part of the import: alpine-bundle.js
  is the last entry in its auto-boot chain. So by the time the module below
  resumes to run its own gh.load calls, Alpine has already started, walked the
  DOM, and run this page's `init()`. Any kit the page loads for itself is
  therefore undefined at component-init time, and which one you notice depends
  only on how far init gets before it touches one: `reviewTarget.parse` in
  resolve(), or `BranchBrief.fetchBrief` one await later. Both were live, and
  the second was reported from a real browser on 2026-08-07.

  The build already solved this once, for itself: url-params.js and
  repo-address.js are forced into the auto-boot chain precisely because "a
  page's own gh.load chain runs AFTER this import" (tools/build/build-lib.mjs).
  That fix does not extend to a kit only one page wants, so the page has to
  state its own readiness.

  The promise is created HERE, before the module, because a component that
  starts during the import would otherwise find the promise itself undefined
  and sail straight past the gate.
-->
<script>
  window.__depsReady = new Promise(r => { window.__depsDone = r; });
</script>
<script type="module">
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
  try {
    await gh.load('kits/review-target.js');
    // branch-brief reads compareFields from BranchSurvey, so it loads first.
    await gh.load('kits/branch-survey.js');
    await gh.load('kits/guide-render.js');
    // The content-registry reader: the Files pane groups changed files by
    // creation mode where the repo declares data/design/content.csv.
    await gh.load('kits/content-registry.js');
    await gh.load('kits/branch-brief.js');
    await gh.load('kits/cm6-merge.js');
    await gh.load('alpineComponents/file-review.js');
    await gh.load('alpineComponents/branch-brief.js');
  } finally {
    // Released in `finally`: a page that failed one load should render its own
    // error, not hang behind a gate that never opens.
    window.__depsDone();
  }
</script>
<style>
  [x-cloak]{display:none!important}
</style>
</head>
<body class="min-h-screen bg-base-200 text-base-content" x-data="branchPage()" x-cloak>

  <!-- The masthead stands down inside a frame (show-repo's branch-detail
       takeover embeds this page and supplies its own header), the same
       courtesy links.html pays its embedder. Standalone use is unchanged. -->
  <div x-show="!framed" class="border-b border-base-300 bg-base-100">
    <div class="max-w-4xl mx-auto px-4 py-2 flex items-center gap-2">
      <span class="text-lg">🌿</span>
      <input x-model="input" @keydown.enter="go()" placeholder="owner/repo@branch, or a PR URL"
             class="input input-sm input-bordered font-mono flex-1 min-w-0">
      <button @click="go()" class="btn btn-sm btn-primary">Open</button>
    </div>
  </div>

  <div x-show="!target" class="max-w-4xl mx-auto p-8 text-center opacity-60 text-sm">
    Address a branch above, or link straight to one:
    <code class="text-xs">#gh=owner/repo@branch</code>,
    <code class="text-xs">#gh=owner/repo&amp;pr=364</code>
  </div>

  <div x-show="target" id="mount"></div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('branchPage', () => ({
      input: '', target: null,
      framed: (() => { try { return window.self !== window.top; } catch { return true; } })(),

      async init() {
        // Before resolve(), which reads window.reviewTarget: Alpine booted
        // inside the pre-build's import, so nothing this page loaded for
        // itself exists yet. See the gate above the module script.
        await window.__depsReady;
        const t = this.resolve();
        if (!t) return;
        this.input = t.repo + (t.ref ? '@' + t.ref : '');
        if (t.ref || t.pr) await this.open(t);
      },

      // The address, from wherever this page is being run.
      //
      // Normally that is location.hash. Inside a toss it is neither location
      // property: toss-render's params shim patches URLSearchParams.get/.has
      // and leaves location.search an empty string, so the query has to be
      // READ THROUGH URLSearchParams or it is invisible. Reading the raw
      // location.search string is the mistake that made a tossed link come up
      // on the empty form with nothing in the console: there was genuinely
      // nothing there to see.
      //
      // Each candidate is tried in turn, and the first that yields a usable ref
      // wins rather than the first that merely parses.
      resolve() {
        const q = new URLSearchParams(location.search);   // shim-aware
        const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        const gh = q.get('gh');
        const base = q.get('base');
        // A PR number, from either carrier. It is read here rather than folded
        // into the address grammar because it is not part of an address: it
        // names a thing that RESOLVES to one, and the resolution is a call.
        const pr = q.get('pr') || hash.get('pr') || '';
        const sources = [];
        if (gh) sources.push('gh=' + gh + (base ? '&base=' + base : ''));
        sources.push(location.hash, location.search);
        for (const s of sources) {
          const t = window.reviewTarget.parse(s);
          if (t && t.kind === 'ref' && t.repo && t.ref) return { ...t, pr };
        }
        // A pasted github.com/owner/repo/pull/<n> URL: the grammar already
        // recognises it and hands back the number for the caller to resolve.
        for (const s of sources) {
          const t = window.reviewTarget.parse(s);
          if (t && t.kind === 'pull' && t.repo) return { ...t, pr: String(t.number) };
        }
        for (const s of sources) {          // repo only: prefill the form
          const t = window.reviewTarget.parse(s);
          if (t && t.repo) return { ...t, pr };
        }
        return null;
      },

      async open(t) {
        let repo = t.repo, ref = t.ref, base = t.base;
        // A PR names its own head and base, so a link to one needs neither. It
        // also fixes the comparison the PR was actually opened against, which
        // for a merged PR is not today's default branch.
        if (t.pr && (!ref || !base)) {
          try {
            const g = new window.GH({ token: window.TOKEN, repo });
            const p = await window.BranchBrief.fetchPullTarget(g, t.pr);
            if (p) { ref = ref || p.branch; base = base || p.base; }
          } catch (e) { console.warn('pr resolve:', e?.message || e); }
        }
        if (!ref) return;
        // The base: an explicit &base= wins, then the PR's, else the repo's own default.
        if (!base) {
          try {
            const meta = await new window.GH({ token: window.TOKEN, repo }).req('');
            base = meta?.default_branch || 'main';
          } catch { base = 'main'; }
        }
        const authored = await this.readAuthored();
        this.input = repo + '@' + ref;
        // `framed` rides through: an embedder supplies its own header, and the
        // view drops the identity it would otherwise repeat.
        this.target = { repo, branch: ref, base, authored, pr: t.pr || '', framed: this.framed };
        window.__branchTarget = this.target;
        this.$nextTick(() => {
          // A fresh element each time: Alpine cannot re-initialise a tree it
          // already owns, so opening a second branch replaces the mount rather
          // than re-running it.
          const old = document.getElementById('mount');
          const el = document.createElement('div');
          el.id = 'mount';
          el.setAttribute('x-data', 'branchBrief(window.__branchTarget)');
          old.replaceWith(el);
          Alpine.initTree(el);
        });
      },

      // The optional authored layer, by whichever delivery the link used.
      // Failure is silent by design: the derived page is the product, and an
      // unreadable envelope should cost its own contents and nothing else.
      async readAuthored() {
        const params = new URLSearchParams(location.search.replace(/^\?/, ''));
        const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        const gz = hash.get('gz') || params.get('gz');
        const src = params.get('src') || hash.get('src');
        try {
          if (gz) {
            const bin = Uint8Array.from(atob(gz.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
            const ds = new DecompressionStream('gzip');
            const text = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
            return window.BranchBrief.readAuthored(JSON.parse(text));
          }
          if (src) {
            const spec = window.DataPayload?.parseSpec?.(src);
            const g = new window.GH({ token: window.TOKEN, repo: spec?.repo || 'mehrlander/web-tools',
                                      ref: spec?.ref || 'main' });
            const f = await g.get(spec?.path || src);
            return window.BranchBrief.readAuthored(JSON.parse(f.text));
          }
        } catch (e) { console.warn('authored layer:', e?.message || e); }
        return null;
      },

      // Open what the field names, in place. Deliberately NOT a reload: inside
      // a toss the frame has no address of its own, so reloading would drop the
      // shimmed address and land back on the empty form. The hash is updated
      // where there is one, for sharing, but the mount is what opens the branch.
      async go() {
        const v = (this.input || '').trim();
        if (!v) return;
        // A pasted PR URL parses on its own; anything else is the gh= grammar.
        const t = window.reviewTarget.parse(v) || window.reviewTarget.parse('gh=' + v);
        if (!t || !t.repo) return;
        if (t.kind === 'pull') t.pr = String(t.number);
        if (!t.ref && !t.pr) return;
        try {
          history.replaceState(null, '', t.pr && !t.ref
            ? '#gh=' + t.repo + '&pr=' + t.pr
            : '#gh=' + t.repo + '@' + t.ref);
        } catch {}
        this.target = null;
        await this.open(t);
      },
    }));
  });
</script>
</body>
</html>
