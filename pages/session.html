<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💬</text></svg>">
<!-- Typography rides along, as it does on chat-results.html: chat-render's
     prose runs are markdown, and Tailwind's preflight strips list markers, so
     without it a bulleted reply renders as unmarked lines that read as
     separate paragraphs. -->
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5,npm/@tailwindcss/typography/dist/typography.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  session.html — one recorded session as a readable conversation.

  The sibling of branch.html, and the same argument: every session surface was
  a LIST (show-repo's Sessions pane, search.py's rows), and each ended in a
  summary because there was nowhere of ours to go. 🌿 is where you read a
  branch; this is where you read the session that made it.

  Address grammar, fragment preferred and query accepted:

    #gh=owner/repo[@ref]:sessions/2026/08/2026-08-07-abc12345.json
    #id=abc12345                     the short id, resolved against the store
    #branch=claude/some-branch-ab12  that branch's LATEST session
    #gz=<base64url>                  a gzipped record, for a reader with no token

  Any of the four takes `pane=outline|files|raw` and `card=<n>`, which say where
  in the session to land: `card` opens the deck on one exchange, the session's
  answer to branch.html's `file=`.

  `#branch=` is the address a phone can produce. The Claude app copies the branch
  a Claude Code session is on and nothing else about it, so this page takes that
  string and finds the session behind it; shortcut-tools' `Choose-Claude` is the
  caller, off the double back tap. The walk it costs, and the tie it settles, are
  in alpineComponents/session-brief.js at resolveBranch.

  The record is web-tools-private/sessions/**.json (its README is the schema).
  The store is private, so #gh= and #id= read through the viewer's stored token
  and a tokenless browser gets nothing; #gz= is the fallback that needs none.

  What the page is NOT: a transcript. A record is a bounded capture, and the
  bounds are real (prompts at 400 characters, prose at 8 KB a turn, result
  bodies at 1 to 2 KB, receipts and Reads dropped by policy). session-render.js
  states each gap in the deck's first card rather than letting an absence read
  as a quiet session. Nothing here reconstructs what was never captured.

  ?use=<branch|tag|sha> pins this page's own lib chain to a ref, fetched from
  raw.githubusercontent with `cache: 'no-store'`. Both halves are needed: the
  blob import defeats the MODULE cache, and no-store defeats the HTTP one. A
  branch ref MOVES, so a plain fetch happily served a bundle from an earlier
  push and the preview showed old code with no way to tell (2026-08-07).
-->
<!--
  The ready gate: importing the pre-build boots Alpine as part of the import, so
  this page's own gh.load calls below have not run by the time a component's
  init() does. The promise is created here, above the module, because a
  component that starts during the import would otherwise find it undefined.
  Full account in pages/branch.html, where the failure was first measured.
-->
<script>
  window.__depsReady = new Promise(r => { window.__depsDone = r; });
</script>
<script type="module">
  // ── A BOOT FAILURE HAS TO SAY SO, because otherwise it says nothing ───────
  //
  // The body carries x-cloak and the style block below hides a cloaked element
  // outright, so Alpine removing that attribute is the only thing that ever
  // reveals this page. A throw anywhere in this script means Alpine never
  // starts, the attribute never comes off, and the reader gets a WHITE PAGE
  // with the real message sitting in a console no phone opens.
  //
  // Measured 2026-09-06 on a handed-over `?use=` link whose ref was mistyped:
  // the fetch 404s, this script throws exactly the right sentence, and the page
  // is indistinguishable from a broken one. A bad LINK and a broken PAGE have
  // to look different or every bad link costs a round trip.
  //
  // Inline styles, and no framework: the point of this path is that the page's
  // machinery did not arrive, so reporting it must not depend on any of it.
  // Tailwind's browser build may not have run, and daisyUI's classes ride a
  // stylesheet that is loaded separately and may have failed for the same
  // reason the bundle did.
  const bootFailed = (e) => {
    const ref = new URLSearchParams(location.search).get('use');
    document.body?.removeAttribute('x-cloak');
    const box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'margin:2rem auto;max-width:34rem;padding:1rem 1.25rem;'
      + 'border:1px solid #d9dee3;border-radius:.75rem;background:#fff;'
      + 'font:14px/1.55 system-ui,sans-serif;color:#1f2937';
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:600;margin-bottom:.4rem';
    h.textContent = 'This page could not start.';
    const why = document.createElement('div');
    why.textContent = e?.message || String(e);
    const hint = document.createElement('div');
    hint.style.cssText = 'margin-top:.6rem;opacity:.7';
    // The ref is echoed because a MISTYPED one is the common case and it is the
    // one thing the reader can check without a console.
    hint.textContent = ref
      ? 'The ?use= ref this link carries is "' + ref + '". If that commit does not '
        + 'exist or is not pushed, drop ?use= to run the deployed code instead.'
      : 'Reload, or open the page without any query string.';
    box.append(h, why, hint);
    document.body?.replaceChildren(box);
  };

  try {
    const ref = new URLSearchParams(location.search).get('use');
    if (ref) {
      const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
      if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
      const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
      try { await import(url); } finally { URL.revokeObjectURL(url); }
    } else {
      await import('../dist/web-tools.js');
    }
    // proof.js backs chat-render's sandboxed Render frames; swipe-deck owns the
    // track and the takeover; chat-render renders a turn. session-render sits on
    // all three, and session-export reads session-render, so the chain is strictly
    // ordered from the bottom up. kits/claude-mark.js is the fourth and is not
    // listed: gh-boot carries it as standing equipment, so it is already here.
    try {
      await gh.load('kits/proof.js');
      await gh.load('kits/swipe-deck.js');
      await gh.load('kits/chat-render.js');
      await gh.load('kits/session-render.js');
      await gh.load('kits/session-export.js');
    } finally { window.__depsDone(); }
  } catch (e) {
    bootFailed(e);
    throw e;                 // and the console still gets the stack
  }
</script>
<style>
  [x-cloak]{display:none!important}
</style>
</head>
<!-- THE DOCUMENT SCROLLS, and this line is what decides it. It was
     `h-[100dvh] … overflow-hidden`, an app shell, while session-brief's shell
     takes `h-full min-h-0` only when FRAMED and otherwise sizes to its content,
     on the argument branch-brief makes: a page that pins its own header costs a
     phone its URL-bar collapse. The two disagreed and the clamp won, so a
     record taller than the viewport was simply cut off with nothing to scroll:
     measured 2026-09-02 at 1280x900, the shell 1945px inside an 851px mount,
     every ancestor `overflow: visible` until the body clipped it. `min-h-` and
     not `h-`, so short content still fills the screen; branch.html is the same
     shape. The deck needs nothing here, since it locks
     `documentElement.style.overflow` itself and restores what it found.

     Document scroll is only half the shape the house style asks for, and this
     page shipped for two days with the other half missing: `min-h-dvh` plus
     STICKY CHROME (daisy-alpine rule 5). Nothing was sticky, so the tab row,
     the outline's Cards chips and its export bar all scrolled away with the
     head. session-brief pins them now; the numbers are in its own header. This
     line is unchanged and stays that way. -->
<body class="min-h-[100dvh] flex flex-col bg-base-100 text-base-content" x-data="sessionPage()" x-cloak>

  <!-- Stands down inside a frame, the courtesy branch.html and links.html pay
       their embedder: the app supplies its own chrome.

       Except with nothing loaded, which was a dead end and shipped as one: a
       toss carrying no session address rendered the empty state under a hidden
       address bar, so the page said "name a session above" with nothing above
       it and no way in. The courtesy is to an embedder that has already
       supplied an address; where none arrived, the way to supply one has to be
       on the page. Found 2026-08-26 by opening the tossed page itself. -->
  <div x-show="!framed || !target" class="shrink-0 border-b border-base-300 bg-base-100">
    <div class="mx-auto px-4 py-2 flex items-center gap-2">
      <span class="text-lg">&#128172;</span>
      <input x-model="input" @keydown.enter="go()" placeholder="short id, branch, or owner/repo:path"
             class="input input-sm input-bordered font-mono flex-1 min-w-0">
      <button @click="go()" class="btn btn-sm btn-primary" :disabled="busy">
        <span x-show="!busy">Open</span>
        <span x-show="busy" class="loading loading-spinner loading-xs"></span>
      </button>
    </div>
  </div>

  <div x-show="err" class="mx-auto mt-4 px-4">
    <div class="alert alert-warning" x-text="err"></div>
  </div>

  <div x-show="!target && !busy && !err" class="mx-auto p-8 text-center opacity-60 text-sm">
    Name a session above, or link straight to one:
    <code class="text-xs">#id=abc12345</code> &middot;
    <code class="text-xs">#branch=claude/some-branch</code>
    <div class="mt-2 text-xs opacity-70">An id is the eight hex characters that end the record's filename; a branch opens its latest session.</div>
  </div>

  <div x-show="busy" class="flex justify-center py-16">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>

  <!-- THE VIEW IS NOT HERE. It is alpineComponents/session-brief.js, mounted
       below, exactly as pages/branch.html mounts branchBrief. This page owns
       the address and nothing else.

       That split is the whole point of the lift (2026-08-27). The markup used
       to live in this file, which made this page the only host it could ever
       have; show-repo's Sessions pane now mounts the same component per slide,
       so a session is swipeable there and reads identically in both places
       because there is one definition. The argument, and the iframe it rules
       out, is branch-brief.js's header. -->
  <div id="mount" class="min-h-0 grow flex flex-col"></div>

<script>
  // The store, which is where every record lives. Overridable by an explicit
  // #gh= address so this page is not welded to one repo.
  const STORE = 'mehrlander/web-tools-private';

  document.addEventListener('alpine:init', () => {
    Alpine.data('sessionPage', () => ({
      input: '', target: null, busy: false, err: '',
      framed: (() => { try { return window.self !== window.top; } catch { return true; } })(),

      async init(){
        // Before anything reads window.sessionRender: Alpine booted inside the
        // pre-build's import, so this page's own chain has not run yet.
        await window.__depsReady;
        const t = this.resolve();
        if (!t) return;
        this.input = t.label || '';
        await this.open(t);
      },

      // The address, from wherever this page is running. Read THROUGH
      // URLSearchParams: inside a toss, toss-render's shim patches
      // URLSearchParams.get and leaves location.search empty, so reading the
      // raw string finds nothing and the page comes up blank with a clean
      // console. Same trap branch.html documents.
      resolve(){
        const q = new URLSearchParams(location.search);
        const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        const pick = k => hash.get(k) || q.get(k);
        // `pane` and `card` ride every address form, the way branch.html takes
        // `pane` and `file`: they say where in the session to land, not which
        // session, so they are orthogonal to the three ways of naming one.
        const pane = pick('pane');
        const card = parseInt(pick('card'), 10);
        const at = { ...(['outline', 'files', 'raw'].includes(pane) ? { pane } : {}),
                     ...(Number.isInteger(card) ? { start: card } : {}) };
        const gz = pick('gz');
        if (gz) return { kind: 'gz', gz, at };
        const id = pick('id');
        if (id) return { kind: 'id', id, label: id, at };
        // Tolerant on purpose: what the Claude app puts on a clipboard has
        // varied, and a shortcut passing it through should not have to know
        // which. A full ref, a URL carrying one, or the bare name all reduce to
        // the name.
        //
        // THIS REDUCTION IS FOR THE LABEL, not for the walk. `branchOf` in
        // alpineComponents/session-brief.js is the authoritative one and runs
        // again on whatever this hands over, so a shape only it knows (a second
        // line, a trailing query) still finds the right session and only the
        // caption shown while it loads is untidy. Widen this one to match if
        // that ever matters; do not narrow that one to match this.
        const branch = pick('branch');
        if (branch) {
          const name = String(branch).trim()   // URLSearchParams already decoded it
            .replace(/^.*?(?:tree|compare)\//, '').replace(/^origin\//, '').replace(/^refs\/heads\//, '');
          return { kind: 'branch', branch: name, label: name, at };
        }
        const gh = pick('gh');
        if (gh) return { kind: 'path', spec: gh, label: gh, at };
        return null;
      },

      // Turn an address into the component's options and mount it. Four
      // addresses, three ways in, and only one of them fetches here: #gz=
      // carries its own copy and has no file behind it, so this page inflates
      // it and hands the record over. The other two name a record and the
      // component reads it, which is what lets a deck slide do the same.
      async open(t){
        this.busy = true; this.err = ''; this.target = null;
        try {
          let opts;
          if (t.kind === 'gz') {
            opts = { record: await this.readGz(t.gz) };
          } else if (t.kind === 'branch') {
            opts = { branch: t.branch, repo: STORE };
          } else if (t.kind === 'id') {
            opts = { id: t.id, repo: STORE };
          } else {
            // ── THE ADDRESS GRAMMAR THIS PAGE DOCUMENTS, ACTUALLY PARSED ──────
            // The header above promises `#gh=owner/repo[@ref]:path` and this
            // line could not deliver it: `parseSpec` lives in kits/data-payload.js
            // and NOTHING on this page ever loaded that kit, so the optional
            // chaining swallowed the miss and the whole "owner/repo:path" string
            // became the path, which 404s against the default store. Silent by
            // construction, and it shipped that way (found 2026-09-06).
            //
            // Loaded HERE rather than in the boot chain above, and only for an
            // address that could be one: parseSpec returns null for a bare path,
            // so `#gh=sessions/2026/…json` needs no parser and pays nothing.
            // repo-address.js first, since data-payload throws without it.
            if (String(t.spec).includes(':') && !window.DataPayload) {
              try {
                await gh.load('kits/repo-address.js');
                await gh.load('kits/data-payload.js');
              } catch { /* fall through to the bare-path reading below */ }
            }
            // `|| {}` still stands, and it is the bare-path case rather than a
            // guard against the kit being absent: parseSpec REPORTS null for a
            // string that is not an address, so a caller can read it as a path
            // in the default store, which is what this does.
            const spec = window.DataPayload?.parseSpec?.(t.spec) || {};
            opts = { repo: spec.repo || STORE, path: spec.path || t.spec };
          }
          // ONE FLAG WAS STANDING FOR TWO FACTS, and this page passed the wrong
          // one for four addresses. `this.framed` says the PAGE is in an
          // iframe, which is why its own address bar stands down once a session
          // is loaded. The brief's `framed` says something else: that a HOST
          // draws the title and the id, so the view need not repeat them. That
          // is true of show-repo's Sessions pane, which mounts the COMPONENT
          // inside a deck whose header carries both. It is true of nothing that
          // embeds this PAGE: the only embedder is the toss, and the toss draws
          // nothing. So a tossed session had no title and no id anywhere on
          // screen, and only the facts strip said which one it was (reported
          // 2026-09-01 from the phone).
          opts = { ...opts, framed: false, ...(t.at || {}) };
          this.target = opts;
          window.__sessionTarget = opts;
          this.$nextTick(() => {
            // A fresh element each time: Alpine cannot re-initialise a tree it
            // already owns, so opening a second session replaces the mount
            // rather than re-running it. branch.html's own note.
            const old = document.getElementById('mount');
            const el = document.createElement('div');
            el.id = 'mount';
            el.className = 'min-h-0 grow flex flex-col';
            el.setAttribute('x-data', 'sessionBrief(window.__sessionTarget)');
            old.replaceWith(el);
            Alpine.initTree(el);
          });
        } catch (e) {
          this.err = e?.message || String(e);
        } finally { this.busy = false; }
      },

      async readGz(gz){
        const bin = Uint8Array.from(atob(gz.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
        const ds = new DecompressionStream('gzip');
        return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text());
      },

      // Deliberately not a reload: inside a toss the frame has no address of
      // its own, so reloading drops the shimmed address and lands on the empty
      // form. The hash is updated where there is one, for sharing.
      async go(){
        const v = (this.input || '').trim();
        if (!v) return;
        // Three shapes, told apart by what only one of them has: an owner/repo
        // spec carries a colon, a branch carries a slash without one, and an id
        // is eight bare hex characters. Typing a branch here is the same route
        // the shortcut takes.
        const t = v.includes(':') ? { kind: 'path', spec: v, label: v }
          : v.includes('/') ? { kind: 'branch', branch: v.replace(/^origin\//, ''), label: v }
          : { kind: 'id', id: v, label: v };
        const key = { id: 'id=', branch: 'branch=', path: 'gh=' }[t.kind];
        try { history.replaceState(null, '', '#' + key + encodeURIComponent(v)); } catch {}
        await this.open(t);
      },
    }));
  });
</script>
</body>
</html>
