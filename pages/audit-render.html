<script type="module">
  // ?use=<branch|tag|sha> picks which ref the lib chain loads from; defaults to
  // main. gh-api.js auto-boots window.gh from its import URL or __ghBlobBoot.
  // This is the house block, copied rather than rewritten: a hand-rolled one
  // shipped with `{ref, base}` where gh-api wants `{repo, ref}`, and nothing
  // caught it because no test sets `use`. The toss's own #gh= route injects
  // use=<ref> through its params shim, so tapping a branch toss was the first
  // time this branch had ever run.
  const p = new URLSearchParams(location.search);
  const ref = p.get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('vanilla-bundle.js');   // window.esc; the suite gates local copies
  await gh.load('kits/md-doc.js');
  await gh.load('kits/swipe-deck.js');
  await gh.load('kits/guide-render.js');   // house markdown type, not prose-sm
  await gh.load('kits/standoff.js');       // the annotation's rules, shared with ops.py
  await gh.load('kits/dictate.js');        // Dictate.pins: the settled edge-pin treatment
  // md-doc's html() returns '' with no window.marked, which is a silent empty
  // render rather than an error. Found by looking at the pixels.
  window.marked = (await import('https://cdn.jsdelivr.net/npm/marked@12/+esm')).marked;

  // One hue per label. Side decides the family; the label picks the shade.
  const HUE = { WHAT: '16,185,129', HOW: '13,148,136', WHY: '245,158,11',
                PROV: '219,39,119', EVID: '192,38,211', NAV: '79,70,229',
                META: '148,163,184' };
  // The second axis, and deliberately NOT a second run of the label palette.
  // That one is categorical, where no hue outranks another; this one is a
  // judgment, so KEEP is the quiet default and the lens works by making the
  // document go grey except where a decision was taken.
  // No VALUE here appears in HUE either, which the suite holds: the Standoff
  // table puts a label chip and a verdict chip in adjacent columns, so a shared
  // rgb would be one swatch meaning two things in the one view that shows both.
  const VHUE = { KEEP: '100,116,139', REWRITE: '234,88,12',
                 MOVE: '2,132,199', DROP: '239,68,68' };
  // Disjoint in both name and colour, so one lookup serves both axes and a
  // template does not have to know which lens is on.
  const RGB = { ...HUE, ...VHUE };
  // AN INSERTION IS ON NEITHER AXIS: it has no label and no verdict, because it
  // is not a unit. So it is in neither palette, and it carries a colour of its
  // own rather than tint()'s unknown-key fallback, which is what an
  // unrecognised label paints as and would read as a defect rather than a kind.
  const INS_RGB = '99,102,241';
  // How a unit is drawn. One tint per label either way; these decide what the
  // tint is spent on. Kept as data because the point is to compare them.
  const MARKS = {
    fill:      { bg: .11, over: .26, sel: .34, tick: .45, under: 0 },
    underline: { bg: 0,   over: .10, sel: .16, tick: 0,   under: .65 },
    separator: { bg: 0,   over: .10, sel: .16, tick: .75, under: 0 },
  };

  // `kind` is the segmenter's word, and the panel was printing it raw: a reader
  // asked what "sent" meant, which is a fair question about a field abbreviated
  // for a JSONL file and then shown to a person.
  const KINDS = { sent: 'sentence', code: 'code block', table: 'table', mixed: 'mixed',
                  h1: 'heading 1', h2: 'heading 2', h3: 'heading 3',
                  h4: 'heading 4', h5: 'heading 5', h6: 'heading 6' };

  const WORD = /[\w'\u2019-]/;
  const snapWord = (text, i) => {
    if (i <= 0 || i >= text.length) return i;
    if (!WORD.test(text[i - 1]) || !WORD.test(text[i])) return i;   // already between words
    let l = i; while (l > 0 && WORD.test(text[l - 1])) l--;
    let r = i; while (r < text.length && WORD.test(text[r])) r++;
    return (i - l) <= (r - i) ? l : r;
  };

  const tint = (k, a) => `rgba(${RGB[k] || '148,163,184'},${a})`;

  // A unit renders alone only if its slice closes what it opens. Where it does
  // not, the split ran through inline markup, which is a finding.

  window.auditPage = () => ({
    a: null, view: 'read', mark: 'fill', lens: 'label', off: {}, sel: null, selPt: null,
    sections: [], ref: '',
    async init() {
      this.ref = (typeof gh !== 'undefined' && gh.ref) || '';
      let payload = window.__audit;
      const spec = p.get('src') || new URLSearchParams(location.hash.slice(1)).get('src');
      if (spec) payload = JSON.parse((await gh.get(spec)).text);
      this.a = payload;
      // INTO THIS BROWSER'S COORDINATES, ONCE. segment.py writes offsets in code
      // points and every slice below is UTF-16, so an emoji anywhere earlier in
      // the document shifts a span silently. Everything from here to save() is
      // native; emit() puts it back. Identity on a document with no astral
      // character, which is every one annotated so far.
      this.a.standoff = Standoff.adopt(this.a.standoff, this.a.text);
      this.sections = mdDoc.split(this.a.text);
      this.base = JSON.parse(JSON.stringify(this.a.standoff));
      this.$nextTick(() => { this.bindDoc(); this.paint(); });
      // Clicking off every unit clears the selection. Until now the only way
      // out was the panel's own close button, which is the one control a
      // reader is not looking at once they have decided they are done. Capture
      // phase, so it settles before a unit's own handler runs; the early
      // return is what lets a unit, a pin, the panel and the chrome keep their
      // taps.
      document.addEventListener('pointerdown', (e) => {
        if (!this.sel) return;
        if (e.target.closest('[data-uid],[data-ins],[data-edge],[data-panel],dialog,header,button')) return;
        this.sel = null; this.menu = null; this.armed = null; this.paint();
      }, true);
      addEventListener('resize', () => this.placePanel());
      addEventListener('scroll', () => this.placePanel(), true);
      // Pinching and the on-screen keyboard move the visual viewport without
      // firing either of the above, so the panel would stay where the layout
      // viewport last put it, which is off screen.
      window.visualViewport?.addEventListener('resize', () => this.placePanel());
      window.visualViewport?.addEventListener('scroll', () => this.placePanel());
    },
    get vocab() { return this.so.vocabulary.filter(v => this.count(v.label)); },
    get sides() { return [...new Set(this.vocab.map(v => v.side))]; },
    count(l) { return this.units.filter(u => u.label === l).length; },
    side(l) { return (this.so.vocabulary.find(v => v.label === l) || {}).side || ''; },

    // THE TWO AXES. `vocabulary` says what a unit IS, `verdicts` says what was
    // decided about it, and they are orthogonal: a unit is WHY and DROP at
    // once. Everything that draws goes through keyOf, so switching the lens
    // repaints the same document against the other question rather than
    // building a second view of it.
    keyOf(u) { return this.lens === 'verdict' ? (u.verdict || 'KEEP') : u.label; },
    KINDS,
    // `from` records HOW this unit got its boundaries, and the verb is in the
    // value. The panel used to print "split from" over all three, so a merged
    // unit read "split from merge:a+b", which states the opposite of what
    // happened in the one place a reader looks to find out.
    get provenance() {
      const f = this.sel?.from || '', i = f.indexOf(':');
      const verb = { split: 'split from', merge: 'merged from',
                     shift: 'boundary moved with' }[f.slice(0, i)];
      return verb ? `${verb} ${f.slice(i + 1)}` : f;
    },
    // Why there is no handle on an edge. It said "start and end sits in
    // markup", which disagreed with itself and was usually not the reason: a
    // boundary is undraggable when it falls where the rendered text has no
    // character to put a pin beside, and a list marker or a `**` is only the
    // commonest case of that.
    // TWO DIFFERENT REASONS, and naming the wrong one is worse than saying
    // nothing. A boundary may have no place on screen to put a pin, which is
    // markup at the render's edges and what this sentence used to assume; or it
    // may be the head or tail of the DOCUMENT, which has a unit on one side
    // only, so there is nothing to relocate it between. The second arrived with
    // insert, which needs one side where shift needs two, and it is the case
    // where the drag button is absent from a boundary the reader can plainly
    // see and can plainly put text at.
    get noDrag() {
      const e = this.unpinned;
      // x-text evaluates whether or not x-show is displaying it, so the empty
      // case is a real branch and not a hypothetical one: without it this read
      // "the undefined edge cannot be dragged" in the DOM of every unit whose
      // boundaries are both fine.
      const ends = this.edges.filter(x => !x.shiftable && !e.includes(x.edge))
                             .map(x => x.edge === 'start' ? 'head' : 'tail');
      if (ends.length)
        return `the ${ends[0]} of the document takes text and cannot be dragged: `
             + 'it has a unit on one side only';
      if (!e.length) return '';
      return e.length === 2
        ? 'neither edge can be dragged: both fall in markup the render does not show'
        : `the ${e[0]} edge cannot be dragged: it falls in markup the render does not show`;
    },
    // The panel's two pills, as data: one row per axis, each naming the
    // operation that edits it, the choices, and the value in force. Written
    // once because the two pills differ in nothing but which list they read.
    get axes() {
      return [
        { op: 'relabel', list: (this.so.vocabulary || []).map(v => v.label), now: this.sel?.label || '' },
        { op: 'verdict', list: (this.so.verdicts || []).map(v => v.verdict), now: this.sel?.verdict || 'KEEP' },
      ];
    },
    tally(k) { return this.units.filter(u => this.keyOf(u) === k).length; },
    gloss(k) {
      const v = (this.so.vocabulary || []).find(x => x.label === k)
             || (this.so.verdicts || []).find(x => x.verdict === k);
      return v ? v.gloss : '';
    },
    // Unused keys are omitted from the legend on both axes: a chip for a label
    // nothing carries is a filter that does nothing.
    get axis() {
      return (this.lens === 'verdict'
        ? (this.so.verdicts || []).map(v => v.verdict)
        : this.vocab.map(v => v.label)).filter(k => this.tally(k));
    },
    get decided() { return this.units.filter(u => (u.verdict || 'KEEP') !== 'KEEP').length; },
    // Words, not units: a one-line NAV pointer and a four-sentence provenance
    // paragraph are one unit each and are not the same amount of document.
    wordsOn(side) {
      return this.units.filter(u => this.side(u.label) === side)
                       .reduce((n, u) => n + u.words, 0);
    },
    pctOn(side) { return Math.round(100 * this.wordsOn(side) / (this.words || 1)); },
    get words() { return this.units.reduce((n, u) => n + u.words, 0); },
    get shareOf() {
      const t = this.words || 1;
      return Object.fromEntries(this.vocab.map(v => [v.label,
        Math.round(100 * this.units.filter(u => u.label === v.label)
                            .reduce((n, u) => n + u.words, 0) / t)]));
    },
    HUE: RGB,
    get so() { return this.a.standoff; },
    get units() { return this.so.units; },
    get raw() { return JSON.stringify(this.so, null, 1); },
    get srcHref() { return 'data:application/json;charset=utf-8,' + encodeURIComponent(this.raw); },
    slice(u) { return this.a.text.slice(u.start, u.end).trim(); },
    // The uid's prefix is the document, which every row on this page shares.
    // Only the ordinal distinguishes them, and the full uid wrapped to two
    // lines on a phone to carry the half that never varies.
    num(u) { return u.uid.split('-').pop(); },

    // EDITING. Every rule about a standoff (the invariants, the four
    // operations, the serialization, where a save may land) lives in
    // lib/kits/standoff.js, and skills/state-the-rule/ops.py is the same rules
    // in Python. This page is the view: it decides what to offer and where to
    // put it, and delegates what an operation MEANS.
    patch: [], at: 0, base: null, menu: null, boundaries: [], splitNote: '', opErr: '',
    // UNDO IS FREE, and it is free because the patch is declarative. The
    // annotation on screen is `apply(base, patch.slice(0, at))`, so stepping
    // back is decrementing a number and replaying: no inverse operation to
    // write, none to get wrong, and the two implementations stay one rule.
    // `at` is the cursor into the patch, not its length: a new operation after
    // an undo truncates the redo tail the way every editor does.
    get canUndo() { return this.at > 0; },
    get canRedo() { return this.at < this.patch.length; },
    replay(n) {
      const r = Standoff.apply(this.base, this.patch.slice(0, n), this.a.text);
      if (r.complaints.length) { this.opErr = r.complaints[0]; return false; }
      this.a.standoff = r.so;
      this.at = n;
      this.opErr = '';
      // UNDO MUST NOT CLOSE THE PANEL, or the control is unreachable a second
      // time: undoing a split destroys the very uid that was selected, so the
      // panel vanished after one press and the rest of the patch had to be
      // undone from the header, which on a phone is a screen away from where
      // the edit happened. Fall back to whichever unit now covers the same
      // character, which is the one the undone operation put back.
      const was = this.sel?.start;
      const keep = this.sel && (this.units.find(u => u.uid === this.sel.uid)
        || (was != null && this.units.find(u => u.start <= was && was < u.end)));
      this.sel = keep ? { ...keep, ref: this.srcRef(keep) } : null;
      this.armed = null;
      this.paint();
      return true;
    },
    undo() { if (this.canUndo) this.replay(this.at - 1); },
    redo() { if (this.canRedo) this.replay(this.at + 1); },
    push(op) {
      // Applied to the live annotation so the view moves under your thumb, then
      // checked and rolled back if it broke something. Same rule ops.py runs on
      // a whole patch: valid against its base, or it does not stand.
      const before = JSON.parse(JSON.stringify(this.units));
      const uid = Standoff.ops[op.op]?.(this.so, this.a.text, op) ?? null;
      const bad = uid === null ? [`${op.op} ${op.uid ?? op.after} was refused`]
                              : Standoff.check(this.so, this.a.text);
      if (bad.length) { this.so.units = before; this.opErr = bad[0]; return; }
      this.opErr = '';
      this.patch.length = this.at;      // a new move drops the redo tail
      this.patch.push(op);
      this.at = this.patch.length;
      this.menu = null;
      // The selection is set BEFORE the repaint, because paint() is what
      // schedules placePins and the pins are drawn from the selected unit's
      // edges. Setting it after left the pins one operation behind: still armed,
      // still red, still on the boundary the edit had just moved.
      const u = this.units.find(x => x.uid === uid);
      this.sel = u ? { ...u, ref: this.srcRef(u) } : null;
      this.paint();
    },
    nextOf(uid) { return this.units[this.units.findIndex(u => u.uid === uid) + 1]; },

    // Split candidates are the connectives the measurement said matter: 40% of
    // prose units carry one, with a rule on one side and its reason on the
    // other. Offering those beats a caret, which a phone does not really have.
    //
    // The connective rides with the SECOND half, so the boundary is a
    // lookahead: splitting after "because" leaves the rule ending on a dangling
    // connective and the reason unable to say it is one.
    //
    // A BLOCK BOUNDARY IS A CANDIDATE TOO, and the prose regex cannot see one.
    // A `shift` across a blank line makes a `mixed` unit, and the menu offered
    // nothing at all on one, so a heading dragged into the paragraph below it
    // could be put back only by undo. The blank line is where a reader would
    // cut, and it is the same test `kind_of` runs to call the unit mixed, so the
    // offer and the classification agree by construction. Not inside a fence,
    // for that classifier's own reason: a fence body legitimately holds blank
    // lines and cutting one leaves two halves that are not fences.
    //
    // A HEADING OFFERS NOTHING. Its `:` fires the clause branch, so the menu
    // offered to cut three of CONVENTIONS.md's section titles from their own
    // claims (`## Status:` from `frozen, stale, wrong`), and neither half is a
    // thing either axis can say anything about.
    openSplit(u) {
      const t = this.a.text;
      const body = t.slice(u.start, u.end);
      const head = /^h[1-6]$/.test(u.kind);
      const re = /[.!?][*`)\]]*\s+|;\s+|:\s+|,\s+(?=so\b|because\b|since\b|which is why\b)/g;
      const found = head ? [] : [...body.matchAll(re)];
      if (!head && u.kind !== 'code') found.push(...body.matchAll(/\n[ \t]*\n\s*/g));
      // Sorted so the menu reads in document order, then deduped: `.\n\n`
      // matches both branches and would offer one boundary twice.
      const rows = found
        .map(m => ({ at: u.start + m.index + m[0].length,
                     lead: body.slice(Math.max(0, m.index - 26), m.index + m[0].length).trim(),
                     rest: body.slice(m.index + m[0].length, m.index + m[0].length + 40).trim() }))
        .filter(b => b.at > u.start && b.at < u.end)
        .sort((a, b) => a.at - b.at);
      this.boundaries = rows.filter((b, i) => !i || b.at !== rows[i - 1].at);
      this.splitNote = head ? 'a heading is one unit'
                            : 'no clause or block boundary inside this unit';
      this.menu = 'split';
    },
    get applied() { return this.patch.slice(0, this.at); },
    // BACK TO CODE POINTS ON THE WAY OUT, because a patch is read by ops.py.
    // The live patch stays in the page's own coordinates, since undo replays it
    // against the annotation in memory.
    get patchJson() {
      return JSON.stringify(Standoff.emitPatch(this.applied, this.a.text), null, 1);
    },
    get patchHref() { return 'data:application/json;charset=utf-8,' + encodeURIComponent(this.patchJson); },

    // SAVING. The page writes to the ref it is READING: you previewed a branch,
    // you edited, the edit lands on that branch. Standoff.saveTarget owns which
    // refs qualify and says why when none does.
    saving: false, saved: '', saveErr: '',
    get where() { return Standoff.saveTarget(this.so, this.ref); },
    get target() { return this.where.ref; },
    get whyNoSave() { return this.where.why; },
    async save() {
      if (this.saving || !this.target) return;
      this.saving = true; this.saveErr = ''; this.saved = '';
      try {
        if (!gh.save) await gh.load('gh-store.js');
        // The patch rides in the commit message rather than in a file of its
        // own: the judgment belongs to the change that carries it, and each
        // unit already records its own `from`.
        const head = `standoff: ${this.at} operation${this.at === 1 ? '' : 's'} `
                   + `on ${this.so.target.path}`;
        await gh.save(this.so.self.path, Standoff.serialize(Standoff.emit(this.so, this.a.text)),
                      `${head}\n\n`
                      + `${Standoff.describe(Standoff.emitPatch(this.applied, this.a.text)).join('\n')}\n`);
        this.saved = `${this.units.length} units to ${this.target}`;
        this.base = JSON.parse(JSON.stringify(this.so));
        this.patch = []; this.at = 0;
      } catch (e) {
        this.saveErr = e.message || String(e);
      } finally {
        this.saving = false;
      }
    },
    dim(u) { return this.off[this.keyOf(u)] ? .12 : 1 },
    toggle(l) { this.off[l] = !this.off[l]; this.paint(); },
    // WHERE IN THE DOCUMENT, and only that. This opened with the target's path,
    // which is the same for every unit on the page and is already in the
    // header, so the first 21 characters of the panel's TALLEST line never
    // varied. num() makes exactly this argument about the uid's shared prefix;
    // the location line had not been given the same reading.
    srcRef(u) {
      const s = [...this.sections].reverse().find(s => s.start <= u.start);
      return s ? `§ ${s.title} · lines ${s.startLine}-${s.endLine}` : '';
    },
    // ONE RENDER, THEN PAINT OVER IT. This used to render each unit on its own,
    // `markdown(text.slice(u.start, u.end))` sixty-odd times, concatenated. Every
    // trouble the boundary editing had came from that: a slice can open a `**` it
    // never closes, so there was a balance check and a red outline; a slice can
    // carry a `##` its neighbour lost, so half a heading rendered as a heading and
    // half as prose; a slice can be a list item's later sentence with no marker,
    // so there was a rule handing it back its indent. Each was a patch over the
    // same decision.
    //
    // The document is rendered ONCE and keeps its own element tree. Units are
    // painted as tinted ranges over the text nodes, so a unit no longer produces
    // an element and therefore cannot cut one. A boundary inside a heading now
    // leaves the heading whole and gives it two tints, which is what it should
    // always have done. What fragments is the DOM at paint time, never the
    // annotation: the standoff stays a flat partition of character offsets, which
    // is the whole point of standoff.
    // `range` renders one section rather than the document, for the deck. A
    // section starts at a heading, so its edges are block edges and slicing
    // there cuts nothing: the reason per-unit slicing was wrong does not apply.
    paint(host, range) {
      const host_ = host || this.$refs.doc;
      if (!host_) return;
      const from = range ? range.start : 0;
      const src = range ? this.a.text.slice(range.start, range.end) : this.a.text;
      host_.innerHTML = '';
      // The type classes go on an inner element, never on the host: paint() does
      // not own its container's layout, and assigning className to the host wiped
      // the padding the page and the deck slide had each given it.
      const box = document.createElement('div');
      box.className = this.view === 'source'
        ? 'whitespace-pre-wrap font-mono text-base leading-7'
        : GuideRender.bodyClass();
      host_.appendChild(box);

      // Source shows the bytes, Read shows the document. Both are ONE node tree
      // over the whole text, so the painting below is the same operation on each
      // and Source no longer has to reassemble the document from slices.
      if (this.view === 'source') box.textContent = src;
      else box.innerHTML = mdDoc.html(src, { proseClass: '' });

      // Every text node, its offset into the source. What it cannot find it
      // leaves unwrapped, and an unwrapped run carries no offset, so it is
      // simply not painted rather than painted in the wrong place.
      Standoff.mapText(box, this.a.text, from);

      const m = MARKS[this.mark] || MARKS.fill;
      const units = [...this.units].sort((a, b) => a.start - b.start);
      for (const sp of [...box.querySelectorAll('[data-src]')]) {
        const s = +sp.dataset.src, node = sp.firstChild;
        if (!node || node.nodeType !== 3) continue;
        const raw = node.data, e = s + raw.length;
        const atomic = sp.dataset.atomic === '1';
        const hits = units.filter(u => u.start < e && u.end > s);
        if (!hits.length) continue;
        const frag = document.createDocumentFragment();
        let cur = s;
        for (const u of hits) {
          const a = Math.max(s, u.start), b = Math.min(e, u.end);
          if (b <= cur) continue;
          if (a > cur) frag.appendChild(document.createTextNode(raw.slice(cur - s, a - s)));
          frag.appendChild(this.piece(u, raw.slice(a - s, b - s), m,
                                      a === u.start, b === u.end, a, atomic));
          cur = b;
        }
        if (cur < e) frag.appendChild(document.createTextNode(raw.slice(cur - s)));
        sp.replaceChild(frag, node);
      }

      // MATERIALIZED IN PLACE, AND ONLY IN PLACE. An insertion holds text the
      // document does not contain, so drawing it here is the whole of what the
      // page can honestly do with one: the reader sees how the document would
      // read, and nothing is written. It carries no uid and takes no tint from
      // either axis, because it has neither a label nor a verdict to paint, and
      // it is added AFTER the map runs, so no boundary can land inside text that
      // has no offsets. Its own boundary is what it answers to, so a tap selects
      // the unit that anchors it and arms that edge.
      //
      // Placed between BLOCKS, since that is where a boundary between blocks is.
      // Dropping it beside the piece would put a block element inside whatever
      // paragraph or heading that piece belongs to.
      const topOf = (el) => { let n = el; while (n && n.parentElement !== box) n = n.parentElement; return n; };
      for (const ins of this.so.insertions || []) {
        const after = ins.after ?? null;
        const el = document.createElement('div');
        el.className = 'my-1 pl-2 border-l-2 cursor-pointer w-fit max-w-full';
        el.style.borderColor = `rgba(${INS_RGB},.55)`;
        el.style.background = `rgba(${INS_RGB},.08)`;
        el.dataset.ins = after ?? '';
        el.textContent = ins.text;
        const anchor = after == null ? null
          : [...box.querySelectorAll(`[data-uid="${CSS.escape(after)}"]`)].at(-1);
        // A section deck paints one range, so an insertion anchored outside it
        // has nothing to sit after and is simply not drawn here.
        if (after == null ? from !== 0 : !anchor) continue;
        el.onclick = (ev) => {
          ev.stopPropagation();
          const u = after == null ? this.units[0] : this.units.find(x => x.uid === after);
          if (!u) return;
          this.sel = { ...u, ref: this.srcRef(u) };
          this.armed = after == null ? 'start' : 'end';
          this.$nextTick(() => this.placePins());
        };
        const top = anchor && topOf(anchor);
        box.insertBefore(el, top ? top.nextSibling : box.firstChild);
      }
      this.$nextTick(() => this.placePins());
    },

    // ONE PIECE OF ONE UNIT, inside whatever element the document put it in. A
    // unit is several of these when it crosses a block or an inline construct,
    // and they answer together: every treatment keys on data-uid rather than on
    // one element, so hover and selection reach the whole unit.
    //
    // `first` and `last` say whether this piece carries the unit's own edge. The
    // tick marks are the boundary the reader is being shown, so they belong on
    // the outer edges of the unit and not on every internal seam the document's
    // markup happened to create.
    piece(u, text, m, first, last, at, atomic) {
      const el = document.createElement('span');
      const a = this.dim(u), k = this.keyOf(u), sel = u.uid === this.sel?.uid;
      el.dataset.uid = u.uid;
      // A PIECE IS ALSO A MAPPED RUN. mapText wraps each text node and the
      // pieces are cut out of it, so the piece is what actually holds text now
      // and the whole pin stack (nodeAt, offsetAt, rectAt) reads data-src. Both
      // carry it: an outer span whose text no unit claimed keeps its own, and
      // one that was cut has element children, which nodeAt skips. `atomic` is
      // inherited so a boundary still cannot land inside a link or a bold span.
      el.dataset.src = at;
      if (atomic) el.dataset.atomic = '1';
      el.className = 'cursor-pointer';
      el.textContent = text;
      el.style.background = sel ? tint(k, m.sel * a) : (m.bg ? tint(k, m.bg * a) : '');
      el.style.opacity = a;
      el.style.transition = 'background-color .12s ease';
      el.style.boxShadow = [
        m.tick && first && `inset 1px 0 0 0 ${tint(k, m.tick * a)}`,
        m.tick && last && `inset -1px 0 0 0 ${tint(k, m.tick * a)}`,
        m.under && `inset 0 -2px 0 0 ${tint(k, m.under * a)}`,
      ].filter(Boolean).join(', ');
      // TEXT DECORATION IS THE FREE CHANNEL, which is why the verdict can ride
      // beside the label rather than displacing it: the tint, the ticks and the
      // opacity are all spent on the active lens, and this is not. A DROP reads
      // under EITHER lens, because it is the destructive one and hiding it behind
      // a switch would let a reader browse labels over text already condemned.
      const deco = [(u.verdict || 'KEEP') === 'DROP' && 'line-through',
                    sel && 'underline'].filter(Boolean);
      if (deco.length) {
        el.style.textDecoration = deco.join(' ');
        el.style.textDecorationThickness = '2px';
        el.style.textUnderlineOffset = '3px';
        // One property, one colour. Red wins where both apply: the selection is
        // where you already are, the verdict is the finding.
        el.style.textDecorationColor = tint(deco[0] === 'line-through' ? 'DROP' : k, .95);
      }
      const over = (bg) => { for (const p of this.$refs.doc.querySelectorAll(`[data-uid="${CSS.escape(u.uid)}"]`)) p.style.background = bg; };
      el.onpointerenter = () => { if (this.sel?.uid !== u.uid) over(tint(k, m.over * a)); };
      el.onpointerleave = () => { if (this.sel?.uid !== u.uid) over(m.bg ? tint(k, m.bg * a) : ''); };
      el.onclick = (ev) => { this.selPt = { x: ev.clientX, y: ev.clientY }; this.hit(u); };
      return el;
    },

    // ── EDGES ────────────────────────────────────────────────────────────────
    // A BOUNDARY IS THE OBJECT, not an edge: the end of one unit is the start of
    // the next, so there is one draggable thing per junction and the partition
    // survives by construction. Overlap is therefore not a mode this offers, and
    // since 2026-08-30 it is also a complaint the checker makes.
    //
    // TAP TO ARM, NOT DRAG TO EXTEND, which is lib/kits/annotate.js's measured
    // answer for the same problem on the same phone: dragging a handle puts the
    // finger over the words being aimed at, which is what every platform then
    // patches with a floating magnifier. Two taps also survive a scroll, a
    // mis-hit and a change of mind, and a drag survives none of them.
    armed: null, pinDrag: null,
    DEAD_LINES: 1.5,
    // EDGES ARE A READ-VIEW AFFORDANCE. Source shows the bytes, markup and all,
    // and a boundary placed inside `**` or `](url)` leaves one side holding an
    // unclosed delimiter; the rendered view cannot offer one, since markup is
    // in no text node and an inline construct is atomic. Two views that
    // disagreed about what is legal would be worse than one that edits.
    // EVERY UNIT HAS TWO BOUNDARIES, one before it and one after. The first
    // unit's "before" is the head of the document and the last unit's "after"
    // is its tail, and those two follow or precede no unit: `shift` refuses
    // them because it needs a unit on each side, `insert` takes them because it
    // needs one. That asymmetry is the whole of `shiftable`. This list used to
    // omit both, which was right while shift was the only boundary op and left
    // a document unable to gain a lead or a closing sentence once insert
    // arrived.
    get edges() {
      if (!this.sel || this.view !== 'read') return [];
      const i = this.units.findIndex(u => u.uid === this.sel.uid);
      if (i < 0) return [];
      return [
        { edge: 'start', after: i > 0 ? this.units[i - 1].uid : null,
          at: this.units[i].start, shiftable: i > 0 },
        { edge: 'end', after: this.units[i].uid,
          at: this.units[i].end, shiftable: i < this.units.length - 1 },
      ];
    },
    get armedEdge() { return this.edges.find(e => e.edge === this.armed) || null; },
    // The insertion standing at a boundary, if any. `after: null` is the head.
    insAt(after) {
      return (this.so.insertions || []).find(x => (x.after ?? null) === (after ?? null)) || null;
    },
    // THE SHAPE IN FORCE at the armed boundary, or null where the question does
    // not arise: no insertion stands there, or it is the head, where a run has
    // nothing to run into and the check refuses it. `document` is an answer and
    // not the absence of one, which is why the button group reads it from here
    // rather than from `as` directly.
    //
    // A getter because x-for renders inside x-show whether or not the group is
    // displayed, so an expression reaching through a null armedEdge throws on
    // every repaint with nothing on screen to show for it.
    get shapeInForce() {
      const e = this.armedEdge, ins = e?.after ? this.insAt(e.after) : null;
      return ins ? (ins.as || 'document') : null;
    },
    // The shape, restated as a whole insert. The op is keyed by its anchor and
    // REPLACES what stands there, so setting the shape is the same operation as
    // setting the text and needs no op of its own. `document` writes no field
    // at all, which is why it cannot be a third value of one.
    setShape(s) {
      const e = this.armedEdge, ins = e && this.insAt(e.after);
      if (!ins) return;
      this.push({ op: 'insert', after: e.after, text: ins.text,
                  ...(s === 'document' ? {} : { as: s }) });
    },
    // A tap in the text is two different requests, and which one is a state the
    // reader set by tapping a pinhead. Armed: put this boundary here. Otherwise:
    // make that unit the active one.
    hit(u) {
      if (this.armed) {
        const e = this.armedEdge, off = this.lastTapOffset;
        this.armed = null;
        // A tap relocates a boundary that HAS two sides. The head and the tail
        // have one, so there is nothing to relocate them between: the tap falls
        // through and selects, which is what it would have done unarmed, rather
        // than pushing a shift both implementations would refuse.
        if (e && e.shiftable) {
          if (off != null) this.push({ op: 'shift', after: e.after, to: off });
          return;
        }
      }
      this.sel = { ...u, ref: this.srcRef(u) };
      this.paint();
    },
    // A boundary lands between words, never inside one. caretRangeFromPoint
    // answers in characters, which is finer than any judgement being made here:
    // a unit divides a sentence at a word, and a pin parked mid-word reads as a
    // slip every time. Snapping to the nearer end of the word under the pointer
    // keeps the drag continuous and the result legible. All three placers go
    // through here (drag, tap, pad), so they agree.
    offsetAt(x, y) {
      const i = Standoff.offsetAt(document, x, y);
      return i == null ? null : snapWord(this.a.text, i);
    },
    // The inverse, for placing a pinhead: a collapsed Range at the offset,
    // measured against the doc container so the pins scroll with the text.
    pointAt(at) {
      const host = this.$refs.doc;
      const hit = Standoff.nodeAt(host, at);
      if (!hit) return null;
      const r = document.createRange();
      r.setStart(hit.node, hit.offset);
      r.collapse(true);
      const b = r.getBoundingClientRect(), h = host.getBoundingClientRect();
      if (!b.height && !b.width) return null;
      return { x: b.left - h.left, y: b.top - h.top, h: b.height || 20 };
    },
    // The client rect of the collapsed range at a document offset, which is
    // what the pin painter measures from.
    rectAt(at, which) {
      // A BOUNDARY IS SHARED: it ends one unit and starts the next, and
      // Standoff.nodeAt answers with the FIRST span containing the offset,
      // which is the earlier one. Its rendered run is followed by the
      // separator text node and both units' padding, so the mark landed 8 to
      // 9px short of the text it opens, measured at 390 and 1280 alike. The
      // later span's offset 0 is the same boundary at the place a reader sees
      // it, so prefer it and keep nodeAt for the end of a paragraph, where
      // there is no later span to ask.
      // MARKUP HAS NO CHARACTER TO PIN, and until now that meant no pin at all.
      // Every list item opens with its marker, so every list item lost its
      // START handle and its opening boundary could not be moved from the page
      // at all. The honest place for a boundary that falls in markup is the
      // unit's nearest RENDERED character on the correct side: before its first
      // for a start, after its last for an end. That is a position, not a
      // claim about which character the offset is, and the drag reads its
      // offsets from the pointer rather than from where the pin was drawn.
      // Scoped to the selected unit, or a missing start would borrow a rect
      // from the next unit and mark a boundary somewhere else entirely. An
      // ATOMIC run counts here, unlike everywhere else: a boundary may not go
      // INSIDE a link or a bold span, but the unit's own first and last
      // characters are outside every construct it contains, and a unit that is
      // bold end to end has no other run to offer. Dragging such a pin inward
      // is refused by offsetAt, which is the correct answer; dragging it
      // outward, to swallow the sentence before it, is the move it exists for.
      //
      // Whitespace-only runs are excluded, and that is not tidiness: see the
      // wrapped-space case at the bottom of this method.
      const ownRun = () => {
        const runs = [...(this.$refs.doc
          ?.querySelectorAll(`[data-uid="${CSS.escape(this.sel?.uid ?? '')}"]`) || [])]
          .map(sp => sp.firstChild)
          .filter(n => n && n.nodeType === 3 && n.data.trim());
        const n = which === 'end' ? runs.at(-1) : runs[0];
        return n ? { node: n, offset: which === 'end' ? n.length : 0 } : null;
      };

      // A COLLAPSED RANGE AT THE END OF A RUN MEASURES ZERO, which is not the
      // same as having no position: the boundary at the end of a paragraph is
      // exactly where the last character stops. Measure that character and take
      // its trailing edge, which is the same point by another route.
      const measure = (h) => {
        const r = document.createRange();
        r.setStart(h.node, h.offset);
        r.collapse(true);
        let b = r.getBoundingClientRect();
        if (!b.height && !b.width && h.offset > 0) {
          r.setStart(h.node, h.offset - 1);
          r.setEnd(h.node, h.offset);
          const c = r.getBoundingClientRect();
          if (c.height || c.width)
            b = { left: c.right, right: c.right, top: c.top, bottom: c.bottom,
                  width: 0, height: c.height, x: c.right, y: c.top };
        }
        return (b.height || b.width) ? b : null;
      };

      let hit = Standoff.nodeAt(this.$refs.doc, at);
      if (!hit && this.sel) hit = ownRun();
      if (!hit) return null;
      // Landing at the END of a run means the boundary is a junction. Which
      // side of it the mark belongs on depends on which edge is being drawn:
      // a START edge OPENS the selected unit, so it belongs at that unit's
      // first character, while an END edge CLOSES it and belongs at its last.
      // nodeAt always answers with the earlier run, which is right for an end
      // and 8 to 9px short for a start. An exact data-src match cannot find
      // the later run either: mapText trims the slice's leading whitespace, so
      // its data-src sits past the boundary by whatever white space separated
      // them. Step to the next run instead.
      if (which === 'start' && hit.offset >= hit.node.length) {
        const runs = [...this.$refs.doc.querySelectorAll('[data-src]:not([data-atomic])')]
          .map(sp => sp.firstChild).filter(n => n && n.nodeType === 3);
        const next = runs[runs.indexOf(hit.node) + 1];
        if (next) hit = { node: next, offset: 0 };
      }
      const b = measure(hit);
      if (b) return b;
      // AND A SPACE THAT WRAPPED MEASURES NOTHING AT ALL, which is the case the
      // two measurements above both miss. A split hands the separator to one
      // side (ops.py's halves meet, and openSplit's regex takes the whitespace
      // with the first half), so a unit can end on a space; when the line breaks
      // exactly there the browser gives that space a zero-width box and a Range
      // over it no box, so the edge reported itself unpinnable while the reader
      // could plainly see where the unit ended. Measured at 390 on
      // conven-063a, which pins at 900 and did not at 390.
      //
      // The unit's own last non-blank character is that place. Same fallback as
      // the markup case above, for the same reason: a position, not a claim
      // about which character the offset is.
      const own = this.sel && ownRun();
      return own && own.node !== hit.node ? measure(own) : null;
    },
    // THE PINS ARE THE DICTATION PAGE'S PINS, painted by Dictate.pins: a ball
    // on a stem that covers the line, above on the left and below on the right,
    // red with a light centre when armed. It was settled there against a thumb
    // and it is one implementation, so this page hands over two rects and gets
    // the same marker rather than an approximation of it.
    //
    // `reach: 0`, the same as pages/dictate.html, and for its reason: the
    // clearance comes from the drag's vertical deadband, so the reader takes
    // exactly as much as they need and the pin stays where it is pointing.
    // `arrows: false`, since this page has a pad.
    // An edge with no rect gets NO PIN. Two ways that happens and both are
    // honest: the unit is the document's first or last, so the edge is not a
    // boundary at all; or the boundary sits in markup, where the render has no
    // position for it. The second is a legacy condition rather than a gap in
    // the map: the segmenter cuts at block starts, and a block starts at `## `
    // or `- **`, which the placement rule now forbids. Drawing a pin at zero
    // for either puts a marker in the corner pointing at nothing, which is what
    // the painter does when handed a null rect.
    unpinned: [],
    // The panel opens down and right of the POINTER, the way a context menu
    // does, rather than aligned to the unit. Aligning it to the span put it in
    // a fixed place no matter where the tap landed, which for a unit spanning
    // three lines is nowhere near the words that were actually touched.
    //
    // Flips back over the pointer on whichever axis would overflow, so a tap
    // in the bottom-right corner opens up and left instead of being shoved
    // sideways. Falls back to the unit's own rect when the selection did not
    // come from a pointer at all (the standoff table's rows, a re-place after
    // an edit), which is the only case with no point to work from.
    placePanel(tries = 0) {
      const el = this.$refs.panel;
      if (!el || !this.sel) return;
      const M = 8, GAP = 12;
      // THE VISUAL VIEWPORT, NOT THE LAYOUT ONE, and this is the whole of the
      // mobile fix. A fixed element is positioned against the LAYOUT viewport,
      // and every CSS measure available to the panel describes that one too:
      // `100vw` does not shrink under pinch-zoom, and inside the toss iframe it
      // is the frame's width rather than the phone's. So a panel sized in CSS
      // can be wider than what is actually on screen, and a clamp computed from
      // the same measure agrees with it and still puts the panel off the right
      // edge. Sizing and placing from `visualViewport` makes both answers come
      // from the region the reader can see.
      const vv = window.visualViewport;
      const VW = vv ? vv.width : document.documentElement.clientWidth;
      const VH = vv ? vv.height : document.documentElement.clientHeight;
      const X0 = vv ? vv.offsetLeft : 0, Y0 = vv ? vv.offsetTop : 0;
      // Only the viewport half is replaced. The design cap (20rem, 70%) stays
      // where it is written, and the class on the element keeps it as the
      // before-JS floor; what changes is that the second term now measures the
      // region the reader can see instead of the one the document was laid out
      // in. Inline wins over the class, so this tightens and never widens.
      // The 7rem gutter is not slack. Tapping outside is how the panel closes,
      // so a popover filling the width is a sheet with no way out; the floor
      // keeps that true on a viewport too narrow for the subtraction. Narrow
      // and tall also beats wide and short here, since the content is short
      // lines and a label the eye has to find, not a paragraph.
      el.style.maxWidth = `min(20rem, ${Math.max(200, Math.round(VW - 112))}px)`;
      el.style.maxHeight = Math.round(Math.min(VH * 0.7, VH - 2 * M)) + 'px';
      const w = el.offsetWidth, h = el.offsetHeight;
      // A PANEL ALPINE HAS NOT YET UN-HIDDEN MEASURES 0 BY 0, and a clamp
      // against a zero width is not a clamp: it leaves left at x + GAP, and the
      // panel then paints its real width off the right edge. Placement has to
      // wait for a box, and one frame is usually it. Bounded, so a panel that
      // never gets one stops asking instead of looping every frame.
      if (!w || !h) {
        if (tries < 5) requestAnimationFrame(() => this.placePanel(tries + 1));
        return;
      }
      let x = this.selPt?.x, y = this.selPt?.y;
      if (x == null) {
        const u = this.$refs.doc?.querySelector(`[data-uid="${CSS.escape(this.sel.uid)}"]`);
        const r = u && [...u.getClientRects()].pop();
        if (!r) return;
        x = r.left; y = r.bottom - GAP;
      }
      // THE PINS ARE OBSTACLES, NOT DECORATION. Each is 32px of tap target on
      // the selected unit's own boundary, which is exactly where a panel
      // anchored to the tap wants to sit, and a panel over a pin does not look
      // broken: the pin is drawn, it is simply unreachable, so arming reads as
      // a dead control. Found by asking elementFromPoint what is under the
      // pinhead rather than by looking, since both cases are the same picture.
      const pins = [...(this.$refs.pins?.querySelectorAll('[data-edge]') || [])]
        .map(el => el.getBoundingClientRect()).filter(r => r.width);
      const clamp = (v, lo, hi) => Math.round(Math.min(Math.max(v, lo), Math.max(lo, hi)));
      const place = (l, t) => [clamp(l, X0 + M, X0 + VW - M - w),
                               clamp(t, Y0 + M, Y0 + VH - M - h)];
      const hits = (l, t) => pins.some(p =>
        l < p.right && l + w > p.left && t < p.bottom && t + h > p.top);
      // Down-right first, the direction asked for, then the three flips. Those
      // four are not enough on a phone and the geometry says why: the panel is
      // most of the width, so any vertical band it occupies that a pin's band
      // touches collides no matter where it sits horizontally. The freedom is
      // vertical, so the last two candidates clear the pins OUTRIGHT, below
      // them or above them, which is the only move a narrow screen leaves.
      const top_ = Math.min(...pins.map(r => r.top)), bot_ = Math.max(...pins.map(r => r.bottom));
      const tries_ = [[x + GAP, y + GAP], [x - GAP - w, y + GAP],
                      [x + GAP, y - GAP - h], [x - GAP - w, y - GAP - h],
                      ...(pins.length ? [[x + GAP, bot_ + GAP], [x + GAP, top_ - GAP - h]] : []),
                     ].map(c => place(...c));
      const [left, top] = tries_.find(c => !hits(...c)) || tries_[0];
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    },
    placePins() {
      const layer = this.$refs.pins;
      if (!layer || typeof Dictate === 'undefined') return;
      const found = this.edges.map(e => ({ ...e, rect: this.rectAt(e.at, e.edge) }));
      this.unpinned = found.filter(e => !e.rect).map(e => e.edge);
      const rectOf = (which) => found.find(e => e.edge === which && e.rect)?.rect || null;
      Dictate.pins(layer, {
        first: rectOf('start'), last: rectOf('end'),
        armed: this.armed, reach: 0, arrows: false,
        clip: this.$refs.doc.getBoundingClientRect(),
      });
      for (const pin of layer.querySelectorAll('[data-edge]'))
        if (!rectOf(pin.getAttribute('data-edge'))) pin.remove();
      if (this.armed && this.unpinned.includes(this.armed)) this.armed = null;
      this.$nextTick(() => this.placePanel());
    },

    // The pin drag, from pages/dictate.html: the aim point is the BAR's centre
    // carried by the finger's delta, one to one, so what moves under the ball is
    // what the ball was already marking. `lead` is the ball's own offset from
    // its stem, measured at the grab, which is what makes the two pins hold back
    // by different amounts and arrive at the same thumb-below-the-aim distance.
    dragY(y0, py, cy, lineH, lead = 0) {
      const buffer = this.DEAD_LINES * lineH + (Math.abs(lead) - lead);
      const travel = cy - py;
      const past = travel > 0 ? Math.max(0, travel - buffer) : travel;
      return y0 + Math.round(past / lineH) * lineH;
    },
    pinDown(ev) {
      const box = ev.target?.closest?.('[data-edge]');
      if (!box) return;
      ev.preventDefault(); ev.stopPropagation();
      const which = box.getAttribute('data-edge');
      const was = this.armed === which;
      // MEASURED BEFORE ANYTHING IS REPAINTED. The bar is the pin's first child
      // and it IS the text line; the painter restyles in place but a repaint
      // still moves it, so both rects are read now.
      const bar = box.firstElementChild, dot = box.lastElementChild;
      const br = bar?.getBoundingClientRect?.(), dr = dot?.getBoundingClientRect?.();
      const from = br && br.height
        ? { x: br.left + br.width / 2, y: br.top + br.height / 2, px: ev.clientX, py: ev.clientY }
        : null;
      const lead = from && dr && dr.height ? (dr.top + dr.height / 2) - from.y : 0;
      // Armed on the way DOWN, so the ring is under the finger before it moves
      // and a drag never has to be told apart from a tap to paint it.
      this.armed = which; this.pinDrag = which;
      this.placePins();
      const e0 = this.edges.find(x => x.edge === which);
      if (!e0) return;
      // ARMING IS NOT DRAGGING, and at the head and the tail only the first is
      // available: a boundary with a unit on one side holds text and cannot be
      // relocated, since there is nothing to relocate it between. Returning
      // here leaves it armed, which is what the insert field in the panel
      // reads, and never starts a drag that ops.shift would refuse mid-gesture.
      if (!e0.shiftable) return;
      const after = e0.after;
      const lineH = parseFloat(getComputedStyle(this.$refs.doc).lineHeight) || 26;
      const EDGE = 6;
      let moved = false, landed = null;
      const d = document;
      const move = (ev2) => {
        if (!from) return;
        ev2.preventDefault();
        if (!moved && Math.abs(ev2.clientX - from.px) < 6 && Math.abs(ev2.clientY - from.py) < 6) return;
        moved = true;
        const b = this.$refs.doc.getBoundingClientRect();
        let ax = from.x + (ev2.clientX - from.px);
        let ay = this.dragY(from.y, from.py, ev2.clientY, lineH, lead);
        ax = Math.min(b.right - EDGE, Math.max(b.left + EDGE, ax));
        ay = Math.min(b.bottom - EDGE, Math.max(b.top + EDGE, ay));
        const i = this.offsetAt(ax, ay);
        if (i == null) return;
        // Moved live and recorded once, the same rule the pad follows: one drag
        // is one judgment.
        if (Standoff.ops.shift(this.so, this.a.text, { after, to: i }) === null) return;
        landed = i;
        this.paint();
      };
      const up = () => {
        setTimeout(() => { this.pinDrag = null; }, 0);
        d.removeEventListener('pointermove', move, true);
        d.removeEventListener('pointerup', up, true);
        d.removeEventListener('pointercancel', up, true);
        d.body.style.userSelect = ''; d.body.style.touchAction = '';
        if (landed != null && landed !== e0.at) {
          Standoff.ops.shift(this.so, this.a.text, { after, to: e0.at });
          this.armed = null;
          this.push({ op: 'shift', after, to: landed });
          return;
        }
        if (landed != null) Standoff.ops.shift(this.so, this.a.text, { after, to: e0.at });
        // A TAP IS A DRAG THAT WENT NOWHERE, and it toggles: tap to arm, tap
        // again to put down.
        if (was) this.armed = null;
        this.placePins();
      };
      d.body.style.userSelect = 'none'; d.body.style.touchAction = 'none';
      d.addEventListener('pointermove', move, true);
      d.addEventListener('pointerup', up, true);
      d.addEventListener('pointercancel', up, true);
    },
    // Where the last tap landed, recorded on the way down so `hit()` can use it
    // on the way up. One delegated listener, bound once: paint() rebuilds every
    // span, so a per-span listener would be re-bound on every repaint.
    lastTapOffset: null,
    bindDoc() {
      const host = this.$refs.doc;
      if (!host || host.dataset.bound) return;
      host.dataset.bound = '1';
      host.addEventListener('pointerdown', (e) => {
        this.lastTapOffset = this.offsetAt(e.clientX, e.clientY);
      });
      // One source of position beats two that must agree, so the pins are
      // re-measured rather than offset. Cheap: at most two of them.
      addEventListener('scroll', () => this.placePins(), { passive: true });
      addEventListener('resize', () => this.placePins());
    },

    // ── THE PAD ──────────────────────────────────────────────────────────────
    // A relative pointer, not a scrubber. The drag moves a VIRTUAL POINT that
    // starts at the armed pin, and each move asks the browser what offset sits
    // under it, so wrapped lines and proportional type come out right without
    // arithmetic over the buffer.
    //
    // The gain depends on how fast the finger moves: creep and the boundary
    // creeps, well under 1:1, which is the precision the pad exists for; flick
    // and it runs ahead. Overshoot on a flick, crawl back a character at a time,
    // both without lifting. The four numbers are the whole feel of the control,
    // and they are lib/kits/annotate.js's, which is where they were tuned.
    padding_: false, padPt: null, padBase: null,
    PAD: { slow: 0.45, fast: 2.4, v0: 0.12, v1: 1.5 },
    padDown(ev) {
      const e = this.edges.find(x => x.edge === this.armed);
      if (!e) return;
      const p = this.pointAt(e.at), h = this.$refs.doc.getBoundingClientRect();
      if (!p) return;
      ev.target.setPointerCapture?.(ev.pointerId);
      this.padding_ = true;
      this.padPt = { x: p.x + h.left, y: p.y + h.top + p.h / 2 };
      this.padBase = { after: e.after, from: e.at, last: ev, t: performance.now() };
      document.body.style.userSelect = 'none';
    },
    padMove(ev) {
      if (!this.padding_) return;
      ev.preventDefault();
      const b = this.padBase, now = performance.now();
      const dx = ev.clientX - b.last.clientX, dy = ev.clientY - b.last.clientY;
      const dt = Math.max(1, now - b.t);
      const v = Math.hypot(dx, dy) / dt, P = this.PAD;
      const t = Math.min(1, Math.max(0, (v - P.v0) / (P.v1 - P.v0)));
      const gain = P.slow + t * (P.fast - P.slow);
      this.padPt = { x: this.padPt.x + dx * gain, y: this.padPt.y + dy * gain };
      b.last = ev; b.t = now;
      // Nothing under the point is not a failure: the point keeps moving and
      // the boundary holds until text is under it again. Walking x back to the
      // line end was tried and is the wrong reading, since past the end of a
      // line the next character is on the NEXT line, and the point reaches it
      // by moving down the way a finger would.
      const off = this.offsetAt(this.padPt.x, this.padPt.y);
      if (off != null) {
        // Moved on the live annotation, not recorded: one drag is one judgment,
        // so the patch gets a single `shift` when the finger lifts.
        if (Standoff.ops.shift(this.so, this.a.text, { after: b.after, to: off }) !== null) {
          this.paint();
        }
      }
    },
    padUp() {
      if (!this.padding_) return;
      this.padding_ = false;
      document.body.style.userSelect = '';
      const b = this.padBase, e = this.edges.find(x => x.edge === this.armed);
      const to = e ? e.at : b.from;
      // Put it back, then let push() make the one real operation, so the page
      // and a patch replayed by ops.py end in the same place.
      Standoff.ops.shift(this.so, this.a.text, { after: b.after, to: b.from });
      if (to !== b.from) this.push({ op: 'shift', after: b.after, to });
      else this.paint();
    },
    // The deck is a CONTAINER, not a viewer: one section per slide, same units,
    // same paint(). Nothing about the audit changes to ride it.
    deck() {
      const secs = this.sections;
      swipeDeck.open({
        count: secs.length, title: this.a.title, subtitle: this.so.question, icon: 'ph-cards',
        render: (i, slide) => {
          const s = secs[i];
          const head = document.createElement('div');
          head.className = 'px-4 pt-4 pb-2 text-xs opacity-60';
          const inSec = this.units.filter(u => u.start >= s.start && u.start < s.end);
          const w = inSec.reduce((n, u) => n + u.words, 0);
          const exp = inSec.filter(u => this.side(u.label) === 'explanation')
                           .reduce((n, u) => n + u.words, 0);
          head.textContent = `${s.title} · ${inSec.length} units · ${w ? Math.round(100 * exp / w) : 0}% explanation`;
          const body = document.createElement('div');
          body.className = 'px-4 pb-6 overflow-y-auto';
          slide.append(head, body);
          this.paint(body, s);
        },
      });
    },
  });
  await gh.load('alpine-bundle.js');
</script>
</head>
<body class="bg-base-100 min-h-dvh" x-data="auditPage()" x-init="init()">
<template x-if="a">
  <div>

    <!-- Tenant chrome: this page is routinely tossed inside an iframe, so it
         sticks rather than taking the viewport, and it does not narrow itself
         to a reading column. The figure is one compact line, not stat cards:
         the reading that gives those numbers meaning is one tap away, under
         Reading. -->
    <header class="sticky top-0 z-20 bg-base-100/90 backdrop-blur border-b border-base-300">
      <div class="px-4 py-2 flex flex-wrap items-center gap-x-3 gap-y-1">
        <span class="font-semibold" x-text="a.title"></span>
        <span class="text-xs opacity-60" x-text="so.question"></span>
        <span class="text-xs font-mono opacity-70"
              x-text="`${units.length} units · ${words.toLocaleString()} words · ` + (lens === 'verdict'
                        ? `${decided} decided` : `${pctOn('explanation')}% explanation`)"></span>
        <a class="text-xs link link-primary" :href="so.target.url" x-show="so.target.url">source</a>
        <div class="join ml-auto">
          <button class="join-item btn btn-xs" :class="view==='source' && 'btn-active'"
                  @click="view='source'; paint()">Source</button>
          <button class="join-item btn btn-xs" :class="view==='read' && 'btn-active'"
                  @click="view='read'; paint()">Read</button>
          <button class="join-item btn btn-xs" :class="view==='standoff' && 'btn-active'"
                  @click="view='standoff'">Standoff</button>
        </div>
        <div class="join" x-show="view!=='standoff'" x-cloak aria-label="unit treatment">
          <button class="join-item btn btn-xs" :class="mark==='fill' && 'btn-active'"
                  @click="mark='fill'; paint()">Fill</button>
          <button class="join-item btn btn-xs" :class="mark==='underline' && 'btn-active'"
                  @click="mark='underline'; paint()">Underline</button>
          <button class="join-item btn btn-xs" :class="mark==='separator' && 'btn-active'"
                  @click="mark='separator'; paint()">Separators</button>
        </div>
        <!-- Which question the colour answers. The treatment switch above
             decides what the tint is spent on; this decides what it MEANS. -->
        <div class="join" x-show="view!=='standoff' && so.verdicts" x-cloak aria-label="colour by">
          <button class="join-item btn btn-xs" :class="lens==='label' && 'btn-active'"
                  @click="lens='label'; paint()">Label</button>
          <button class="join-item btn btn-xs" :class="lens==='verdict' && 'btn-active'"
                  @click="lens='verdict'; paint()">Verdict</button>
        </div>
        <button class="btn btn-xs btn-ghost" @click="deck()"><i class="ph ph-cards"></i> Sections</button>
        <button class="btn btn-xs btn-ghost" @click="$refs.reading.showModal()">Reading</button>
        <div class="join" x-show="patch.length" x-cloak>
          <button class="join-item btn btn-xs" :disabled="!canUndo" @click="undo()"
                  aria-label="undo"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="join-item btn btn-xs btn-primary" @click="$refs.patch.showModal()">
            patch <span class="font-mono" x-text="at + (canRedo ? '/' + patch.length : '')"></span></button>
          <button class="join-item btn btn-xs" :disabled="!canRedo" @click="redo()"
                  aria-label="redo"><i class="ph ph-arrow-clockwise"></i></button>
        </div>
      </div>

      <!-- The legend is the explanation. Each chip carries the treatment it
           names, so a label chip is tinted as its units are. Tapping one dims
           its units in place rather than hiding them, which keeps the document
           readable while one category is set aside. -->
      <div class="px-4 pb-2 flex flex-wrap items-center gap-1">
        <template x-for="k in axis" :key="k">
          <button class="btn btn-xs gap-1.5 border-0"
                  :style="`background:rgba(${HUE[k]},${off[k]?0.05:0.22});
                           box-shadow:inset 2px 0 0 0 rgba(${HUE[k]},${off[k]?0.2:0.9})`"
                  :class="off[k] && 'opacity-40'"
                  :title="gloss(k)"
                  @click="toggle(k)">
            <span x-text="k"></span>
            <span class="opacity-60 font-mono" x-text="tally(k)"></span>
          </button>
        </template>
      </div>
    </header>

    <div class="relative">
    <div x-ref="doc" class="px-4 py-4" x-show="view!=='standoff'"></div>
      <!-- The pin layer. It overlays the doc box exactly, takes no taps of its
           own, and hands each pin back its own: the painter writes the box's
           whole style attribute, so the exception is a rule here rather than
           an inline property there. While the pad is driving, the pins stop
           hit-testing entirely, since the virtual point starts on one. -->
      <div x-ref="pins" class="absolute inset-0 pointer-events-none"
           :data-audit-drag="(padding_ || pinDrag) ? '' : null"
           @pointerdown="pinDown($event)"></div>
    </div>

    <!-- The annotation as the thing it is: rows over spans, and the committed
         bytes underneath. The page never re-derives this; the builder copies
         standoff.json in verbatim, so what is on screen is what is in the file. -->
    <div class="px-4 py-4" x-show="view==='standoff'" x-cloak>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs font-mono mb-3">
        <span x-text="so.kind"></span>
        <a class="link link-primary" :href="so.target.url" x-text="so.target.path"></a>
        <span x-text="so.target.bytes + ' bytes'"></span>
        <span class="opacity-60" x-text="'sha256 ' + so.target.sha256.slice(0,16)"></span>
        <a class="link" :href="srcHref" download="standoff.json">download</a>
      </div>
      <div class="overflow-x-auto">
        <table class="table table-xs">
          <thead><tr><th class="text-right">#</th>
                     <th class="text-right">start</th><th class="text-right">end</th>
                     <th>kind</th><th class="text-right">w</th>
                     <th>label</th><th>verdict</th><th>note</th><th>text</th></tr></thead>
          <tbody>
            <template x-for="u in units" :key="u.uid">
              <tr class="cursor-pointer hover:bg-base-200"
                  @click="selPt=null; sel={...u, ref: srcRef(u)}; armed=null">
                <td class="font-mono text-right" x-text="num(u)"></td>
                <td class="font-mono opacity-60 text-right whitespace-nowrap" x-text="u.start"></td>
                <td class="font-mono opacity-60 text-right whitespace-nowrap" x-text="u.end"></td>
                <td class="opacity-60" x-text="u.kind"></td>
                <td class="font-mono opacity-60 text-right" x-text="u.words"></td>
                <td><span class="rounded px-1 whitespace-nowrap"
                          :style="`background:rgba(${HUE[u.label]},.25)`" x-text="u.label"></span></td>
                <td><span class="rounded px-1 whitespace-nowrap" x-show="u.verdict"
                          :style="`background:rgba(${HUE[u.verdict]},.25)`" x-text="u.verdict"></span></td>
                <td class="italic opacity-70 max-w-40 truncate" x-text="u.note || ''"></td>
                <td class="max-w-md truncate" x-text="slice(u)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <details class="mt-4">
        <summary class="cursor-pointer text-xs opacity-60">standoff.json, verbatim</summary>
        <pre class="mt-2 text-xs overflow-x-auto bg-base-200 p-3 rounded" x-text="raw"></pre>
      </details>
    </div>

    <!-- Above the shared FAB (z-80), which is fixed to this same corner and was
         covering the split candidates. dictate.html's sheet takes the corner the
         same way: while a page's own bottom UI is up, it owns the bottom. -->
    <div class="fixed z-[90] bg-base-100 border border-base-300 rounded-xl shadow-lg px-3 py-2 text-xs
                max-w-[min(20rem,calc(100vw-7rem))] max-h-[70vh] overflow-y-auto"
         data-panel x-ref="panel" x-show="sel" x-cloak>
      <div class="flex flex-wrap gap-x-3 gap-y-1 items-center">
        <b class="font-mono" x-text="sel?.uid"></b>

        <!-- A PILL IS SIZED BY ITS TEXT, AND A SELECT IS NOT. A native select
             takes the width of its WIDEST option plus a chevron, so `KEEP` was
             carrying `REWRITE`'s width and `NAV` was carrying `PROV`'s, which is
             the padding that read as awkward. The span sizes the pill to the
             value actually shown; the select lies over it at zero opacity and
             takes the tap, so this is still the platform's own dropdown rather
             than a menu reimplemented. Two of them, because there are two
             questions and answering one never answers the other; same shape on
             purpose, so a verdict does not read as a different kind of thing. -->
        <template x-for="ax in axes" :key="ax.op">
          <label class="relative inline-flex items-center rounded-full px-2 py-0.5 font-mono cursor-pointer"
                 x-show="ax.list.length" x-cloak
                 :style="`background:rgba(${HUE[ax.now]},.28)`">
            <span x-text="ax.now"></span>
            <select class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                    :aria-label="ax.op"
                    x-effect="$el.value = ax.now"
                    @change="push({op:ax.op, uid:sel.uid, [ax.op==='relabel'?'label':'verdict']:$event.target.value})">
              <template x-for="v in ax.list" :key="v"><option :value="v" x-text="v"></option></template>
            </select>
          </label>
        </template>

      </div>

      <!-- GROUPED BY THE QUESTION EACH LINE ANSWERS, which nothing said before:
           the block above is what this unit IS and what was decided about it,
           this one is where it sits and how big, the next is how it came to
           have these boundaries. The no-drag notice moved up here because it is
           a fact about this unit's edges, and it used to sit below the note
           with the two position lines separated by everything between. -->
      <div class="flex flex-wrap gap-x-3 gap-y-1 items-center mt-1">
        <span class="opacity-60" x-text="`${sel?.words} words · ${KINDS[sel?.kind] || sel?.kind}`"></span>
        <!-- Wrapping rather than truncating is what lets the panel be narrow:
             this line was the widest thing in it, and a truncated one still
             claims the width it was cut to. -->
        <span class="opacity-60 font-mono basis-full" x-show="sel?.ref" x-cloak
              x-text="sel?.ref"></span>
        <span class="opacity-60 basis-full" x-show="noDrag" x-cloak
              x-text="noDrag"></span>
      </div>

      <div class="flex flex-wrap gap-x-3 gap-y-1 items-center mt-1">
        <span class="opacity-60 font-mono basis-full" x-show="sel?.from" x-cloak
              x-text="provenance"></span>
        <span class="italic opacity-70" x-show="sel?.note" x-cloak x-text="sel?.note"></span>
        <span class="text-error basis-full" x-show="opErr" x-cloak x-text="opErr"></span>
      </div>

      <!-- THE ARMED BOUNDARY IS THE INSERTION'S ANCHOR, so the row that already
           belongs to a boundary takes the second boundary operation rather than
           a control of its own. Drag is offered only where the boundary has a
           unit on each side: the head and the tail have one, which is enough to
           hold text and not enough to relocate. -->
      <div class="mt-2" x-show="armed" x-cloak>
        <div class="flex items-center gap-2" x-show="armedEdge?.shiftable" x-cloak>
          <button class="btn btn-sm btn-primary touch-none select-none"
                  @pointerdown="padDown($event)" @pointermove="padMove($event)"
                  @pointerup="padUp()" @pointercancel="padUp()">
            <i class="ph ph-crosshair"></i> drag the edge
          </button>
          <span class="opacity-60 font-mono" x-text="armedEdge?.at"></span>
        </div>
        <input class="input input-xs input-bordered w-full mt-2"
               placeholder="insert: text the document does not have"
               x-effect="$el.value = armedEdge ? (insAt(armedEdge.after)?.text || '') : ''"
               @change="armedEdge && push({op:'insert', after: armedEdge.after,
                                           text:$event.target.value})">
        <!-- HOW THE TEXT MEETS WHAT IS AROUND IT. Three choices, not two,
             because `document` is a distinct state and not a synonym for one of
             the others: it leaves the field unset and hands the answer to the
             boundary, which is the honest default at every boundary but the
             tail, where a document's final newline is a terminator rather than
             a paragraph break. Absent at the head, where a run has nothing to
             run into and the check refuses it. -->
        <div class="flex items-center gap-2 mt-1" x-cloak x-show="shapeInForce">
          <span class="opacity-60">arrives as</span>
          <div class="join">
            <template x-for="s in ['document', 'run', 'block']" :key="s">
              <button class="join-item btn btn-xs" x-text="s" @click="setShape(s)"
                      :data-shape="s"
                      :class="shapeInForce === s ? 'btn-active' : ''"></button>
            </template>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1 mt-2">
        <!-- Undo BESIDE the operations, not only in the header. A drag ends
             with the finger on the panel and the header a screen away, so the
             one control a reader wants immediately after an edit was the one
             furthest from it. The header pair stays: it is the only undo
             reachable with nothing selected. -->
        <div class="join" x-show="patch.length" x-cloak>
          <button class="join-item btn btn-xs" :disabled="!canUndo" @click="undo()"
                  aria-label="undo"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="join-item btn btn-xs" :disabled="!canRedo" @click="redo()"
                  aria-label="redo"><i class="ph ph-arrow-clockwise"></i></button>
        </div>
        <button class="btn btn-xs" x-show="view!=='read'"
                @click="view='read'; paint()">Edges</button>
        <button class="btn btn-xs" @click="openSplit(sel)">Split</button>
        <button class="btn btn-xs" :disabled="!nextOf(sel?.uid)"
                @click="push({op:'merge',uid:sel.uid})">Merge next</button>
      </div>

      <input class="input input-xs input-bordered w-full mt-2"
             placeholder="note: what the label cannot say"
             x-effect="$el.value = sel?.note || ''"
             @change="push({op:'note',uid:sel.uid,text:$event.target.value})">

      <div class="mt-2 space-y-1" x-show="menu==='split'">
        <template x-if="!boundaries.length">
          <span class="opacity-60" x-text="splitNote"></span>
        </template>
        <template x-for="b in boundaries" :key="b.at">
          <button class="btn btn-xs btn-block justify-start font-normal h-auto py-1 text-left"
                  @click="push({op:'split',uid:sel.uid,at:b.at})">
            <span class="opacity-50" x-text="'…' + b.lead"></span>
            <span class="text-primary">▸</span>
            <span x-text="b.rest + '…'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- The patch is the artifact of an editing session: what you decided,
         reviewable as a list of judgments rather than as a JSON diff. -->
    <dialog class="modal" x-ref="patch">
      <div class="modal-box max-w-2xl">
        <div class="flex items-center gap-2 mb-2 text-xs">
          <span class="font-mono" x-text="at + ' of ' + patch.length + ' applied'"></span>
          <a class="link" :href="patchHref" download="patch.json">download</a>
          <button class="link" @click="navigator.clipboard?.writeText(patchJson)">copy</button>
          <button class="link text-error ml-auto" @click="location.reload()">discard</button>
        </div>
        <pre class="text-xs overflow-x-auto bg-base-200 p-3 rounded" x-text="patchJson"></pre>

        <!-- Two ways out, and the page says which one is open. Saving writes
             the edited standoff to the ref being read; where that ref is main
             there is nothing to write to, and the command below is the route. -->
        <div class="flex flex-wrap items-center gap-2 mt-3 text-xs">
          <button class="btn btn-sm btn-primary" x-show="target" :disabled="!!saving"
                  @click="save()">
            <span x-text="saving ? 'saving…' : 'save to ' + target"></span>
          </button>
          <span class="opacity-60" x-show="whyNoSave" x-text="whyNoSave"></span>
          <span class="text-success" x-show="saved" x-text="'saved ' + saved"></span>
          <span class="text-error" x-show="saveErr" x-text="saveErr"></span>
        </div>
        <p class="text-xs opacity-60 mt-2 font-mono">
          python3 skills/state-the-rule/ops.py &lt;standoff.json&gt; patch.json &lt;doc.md&gt; --write
        </p>
        <form method="dialog" class="modal-backdrop"><button class="btn btn-sm btn-block mt-3">close</button></form>
      </div>
    </dialog>

    <!-- Where the numbers went: the header carries the figure, the reading that
         makes it mean something lives here, one tap away. -->
    <dialog class="modal" x-ref="reading">
      <div class="modal-box max-w-lg">
        <table class="table table-sm">
          <thead><tr><th>side</th><th>units</th><th>words</th></tr></thead>
          <tbody>
            <template x-for="sd in sides" :key="sd">
              <tr><td x-text="sd"></td>
                  <td class="font-mono" x-text="units.filter(u => side(u.label) === sd).length"></td>
                  <td class="font-mono" x-text="pctOn(sd) + '%'"></td></tr>
            </template>
          </tbody>
        </table>
        <table class="table table-sm mt-2">
          <thead><tr><th>label</th><th>units</th><th>words</th><th>side</th><th>is</th></tr></thead>
          <tbody>
            <template x-for="v in vocab" :key="v.label">
              <tr><td class="font-mono" x-text="v.label"></td>
                  <td class="font-mono" x-text="count(v.label)"></td>
                  <td class="font-mono" x-text="shareOf[v.label] + '%'"></td>
                  <td class="opacity-60" x-text="v.side"></td>
                  <td class="opacity-60" x-text="v.gloss"></td></tr>
            </template>
          </tbody>
        </table>
        <form method="dialog" class="modal-backdrop"><button class="btn btn-sm btn-block mt-3">close</button></form>
      </div>
    </dialog>

  </div>
</template>
</body>
</html>
