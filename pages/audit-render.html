<!--
  audit-render.html — a document coloured by what each of its units IS.

  The audit pass (skills/state-the-rule, doc-audit's fourth question) puts one
  label on every unit of a document. This page is where you look at the result:
  the whole document, every unit tinted, a legend that filters, and the density
  figure that says whether the document is worth a rewrite at all.

  IT ASSUMES NO PARTICULAR MARKDOWN VIEWER, and that is the point of the design.
  Units carry (start, end) into the source; kits/md-doc.js's split() carries
  (start, end, startLine, endLine) for sections of the same source. Both speak
  SOURCE OFFSETS, so joining them is arithmetic rather than DOM matching, and
  any renderer that can say what it is a rendering OF can host the tint. That is
  md-doc's DECLARE job, and enhance() applies it over markup another renderer
  made. The deck view is the proof: kits/swipe-deck.js is a container, not a
  viewer, so the same units light up one section per slide with nothing changed.

  Two views, and the difference between them is a finding rather than a setting:
    source  the markdown itself, every unit tinted. Exact by construction.
    read    each unit rendered as markdown. A unit whose slice does not close
            its own inline markup CANNOT be rendered alone, and the page says so
            rather than rendering it broken. Those fallbacks are segmentation
            artifacts worth seeing: a code span split across two units, a list
            number that became a unit of its own.

  Payload: audit/1, from ?src=<spec>, #gz=<base64url>, or the embedded default.
  Built by tools/build/audit-payload.py (--inject refreshes the block below).
-->

 "text": "# Working conventions (portable)\n\nRemote-sandbox conventions for Claude Code web sessions; output is strictly via chat. The canonical source is `mehrlander/web-tools` at `docs/CONVENTIONS.md`, loaded by `@`-import or the `web-tools` skill. Substitute the current repo into all URL templates.\n\nThis hub holds behavior that applies whether or not anything is being surfaced. Two companions load as one set with it:\n\n- **[SURFACING.md](SURFACING.md)** — the surfacing system: the primitives that make session work visible in chat (no setup), plus the surfacing course (the guide-PR lifecycle, idle until you open a PR).\n- **[PORTABLE.md](https://github.com/mehrlander/web-tools/blob/main/docs/PORTABLE.md)** — installation, the plugin, and the full catalog of what travels from the hub to any repo.\n\n**Prose style:** zero em dashes. Use colons, commas, semicolons, parentheses, or new sentences.\n\n## Scope and precedence\n\n**Local `CLAUDE.md` wins wherever it conflicts with these defaults.** Beyond that, name the units:\n\n- A **session** can span several repositories. A repository's conventions apply to work done in that repository.\n- A **workstream** is one repository plus its branch and the PR that tracks it. A single session may run several at once (three repos on one branch name, say).\n- The **branch anchor**, **guide PR**, and **wrap-up** in [SURFACING.md](SURFACING.md) are per-workstream: \"the branch\" and \"the PR\" always mean this workstream's.\n\n## Standing decisions: write the answer down, not just the question\n\n**A consistency ask is not a fork.** When a treatment is approved in one place and the instruction is to apply it elsewhere (\"do the same on X so it's consistent\"), apply it to every surface it plausibly covers, show the pixels, and name what was assumed. Do not ask which surface was meant.\n\nA recurring fork becomes a standing decision the moment a doc states it as a default. Name it in `CLAUDE.md` or the relevant portable doc (this file, [SURFACING.md](SURFACING.md), [TRACKER.md](https://github.com/mehrlander/web-tools/blob/main/docs/TRACKER.md)), and a session that hits it takes the default and notes the assumption rather than raising it fresh.\n\n**A repo fielding the same question has a missing standing decision, not a tool to disable.** Asking is a model choice, not a gated call, so a `permissions.deny` cannot reach it.\n\n## Status: frozen, stale, wrong\n\nMaterial that is preserved on purpose, or that has aged, says so where it is read. Three flavors: **`Frozen`** (preserved on purpose; the living version has moved on), **`Stale`** (no longer accurate), **`Wrong`** (flatly incorrect, not merely aged). Operated by `/portable:markers`.\n\nTwo carriers, split by subject:\n\n| | Subject | Says | Covers |\n| --- | --- | --- | --- |\n| **Marker** | a claim, in prose | this passage is preserved, aged, or wrong | markdown only |\n| **Declaration** | a file path | this artifact is frozen: do not edit or rebuild it | any file type |\n\n`Stale` and `Wrong` have no path analogue, since a paragraph can be wrong while its file is perfectly live. Only `Frozen` overlaps.\n\n**Marker.** Inline for one claim, or a GFM alert for a whole file or section (`> [!NOTE]` for `Frozen`, `> [!WARNING]` for the other two), with the flavor in the bold lead-in:\n\n```markdown\n**Stale 2026-07-20 → ../timeline.md:** the dates here predate the reschedule.\n```\n\nShape: `**Flavor YYYY[-MM[-DD]] [(note)] [→ target]:**`. The target is optional and may be a path, a markdown link, or prose; only path-shaped targets are existence-checked. A `status: frozen 2026-07-06; note` frontmatter line is the optional metadata layer.\n\n**Annotate, do not rewrite:** a dated file stays put as a record, so when one of its claims ages, mark the claim rather than editing the record into agreement with the present. **Only a record gets a marker**; fix a living document instead. The tell: a banner describing text no longer in the file.\n\n**Declaration.** `.paths.json`, which may sit at a repo root **or any workspace root**, with entries relative to its own directory and the nearest declaration winning.\n\n```json\n{\n  \"frozen\": [\n    \"research/budget-dive/dashboard.html\",\n    { \"path\": \"app/studies/\", \"since\": \"2026-07-05\", \"why\": \"task 0016: pinned exhibits\",\n      \"except\": [\"*/tools/*\"] }\n  ]\n}\n```\n\nA bare string is shorthand for `{ \"path\": ... }`; a trailing `/` covers a directory; `except` is `fnmatch` against the path below the entry. `except` is required in practice: a frozen folder routinely contains live inputs.\n\n**A marker cannot do the declaration's job.** A GFM alert renders in markdown and nowhere else, so `.html`, `.js`, and `.csv` artifacts can never carry one.\n\n**The one cross-check, and it runs one way:** a markdown file declared frozen should carry a `Frozen` banner, because the JSON is invisible to someone opening the file. The reverse does not hold, since a `Frozen` marker inside a living document annotates one claim and implies nothing about the file.\n\n## Venues: this session is not the only place work can run\n\nBesides this sandbox, work can run in a local Claude Code CLI, in Cowork on the desktop, through **Dispatch** (a phone-to-desktop relay, attended: the machine must be awake with the app open), on GitHub's hosted runners, on a **self-hosted runner** on your own machine (unattended: it queues while the machine sleeps), and in a Claude Code Remote environment.\n\nBefore concluding that something cannot be done from here, or scoping an answer to the venues visible from inside the sandbox, read [venues.md](https://github.com/mehrlander/web-tools/blob/main/docs/venues.md): what each reaches, and the attended-versus-unattended split that decides where a job belongs.\n\n## Leave it nicer than you found it\n\nAdding to a doc is a pass over it, not just an append. New material has to match the surrounding voice and structure. Go a step further and tighten related material while you are there.\n\n## Prose that describes state is unimplemented\n\nA document that restates what an app derives, or what a check enforces, is carrying a copy, and the copy is the half that ages with nothing to report it. Before adding to a doc, and whenever one has outgrown its subject, ask three questions in order:\n\n1. **Is this a fact the app derives?** Delete it and link the view.\n2. **Is this a rule the suite enforces?** Delete the description, keep a pointer to the gate. The test is the statement.\n3. **Does another document already own it?** Delete it and link there.\n\n**There is no fourth question that saves a passage, and a reason is not exempt because it is a reason.** Nearly every sentence in a bloated document is a reason somebody chose something, which is how it got bloated. What earns its place is the **criterion** inside a reason: the condition, threshold, or named exception that changes how the rule applies at an edge. Lift that into the rule and the rest goes to the PR body or the dated record that owns the decision. Operated by [`state-the-rule`](https://github.com/mehrlander/web-tools/blob/main/skills/state-the-rule/SKILL.md), which carries the labels and the checks.\n\nTwo habits: **Render before you cut**, since a definition that exists only in a tooltip is not rendered. And **look inside the file**: a paragraph repeated verbatim within one document is invisible to a cross-file duplicate scanner by construction, and to a word cap because it fits inside the budget.\n\nThe cut is only safe when something will notice it being undone, so leave a gate behind: a pointer the doc must keep, and a ceiling it must stay under.\n\n## Keep focus\n\nWhen asked to look for improvements, be wary of ideas that address a hypothetical problem. A simple, clear fix is worth making; the trap is speculative work that goes off course. The test points only at tasks you conceive, not a specific user request.\n\nThe `tasks` skill owns the filing rules; load `/tasks` before writing a task file. A friction observation goes to the repo's snags log (web-tools: [`SNAGS.md`](https://github.com/mehrlander/web-tools/blob/main/docs/SNAGS.md)), one line with a `→` to the fixing doc; the third recurrence earns a task.\n\n## Adding your own, without clobbering\n\nThe install owns only what it ships. Plugin skills are namespaced (`/portable:caption`), so a same-named skill of yours coexists; the fallback fetch hook writes a fixed file list and touches nothing else. Your own skills and any `CLAUDE.md` text below the import are never overwritten.\n"
};
/* AUDIT:END */
</script>
<script type="module">
  // ?use=<branch|tag|sha> picks which ref the lib chain loads from; defaults to
  // main. gh-api.js auto-boots window.gh from its import URL or __ghBlobBoot.
  // This is the house block, copied rather than rewritten: a hand-rolled one
  // shipped with `{ref, base}` where gh-api wants `{repo, ref}`, and nothing
  // caught it because no test sets `use`. The toss's own #gh= route injects
  // use=<ref> through its params shim, so tapping a branch toss was the first
  // time this branch had ever run.
  const p = new URLSearchParams(location.search);
  const ref = p.get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('vanilla-bundle.js');   // window.esc; the suite gates local copies
  await gh.load('kits/md-doc.js');
  await gh.load('kits/swipe-deck.js');
  await gh.load('kits/guide-render.js');   // house markdown type, not prose-sm
  await gh.load('kits/standoff.js');       // the annotation's rules, shared with ops.py
  // md-doc's html() returns '' with no window.marked, which is a silent empty
  // render rather than an error. Found by looking at the pixels.
  window.marked = (await import('https://cdn.jsdelivr.net/npm/marked@12/+esm')).marked;

  // One hue per label. Side decides the family; the label picks the shade.
  const HUE = { WHAT: '16,185,129', HOW: '13,148,136', 'WHY-OP': '245,158,11',
                'WHY-MOT': '244,63,94', PROV: '219,39,119', EVID: '192,38,211',
                NAV: '79,70,229', META: '148,163,184' };
  const tint = (l, a) => `rgba(${HUE[l] || '148,163,184'},${a})`;

  // A unit renders alone only if its slice closes what it opens. Where it does
  // not, the split ran through inline markup, which is a finding.
  const balanced = (s) => (s.match(/`/g) || []).length % 2 === 0
                       && (s.match(/\*\*/g) || []).length % 2 === 0
                       && (s.match(/\[/g) || []).length === (s.match(/\]/g) || []).length;

  window.auditPage = () => ({
    a: null, view: 'source', off: {}, sel: null, sections: [], ref: '',
    async init() {
      this.ref = (typeof gh !== 'undefined' && gh.ref) || '';
      let payload = window.__audit;
      const spec = p.get('src') || new URLSearchParams(location.hash.slice(1)).get('src');
      if (spec) payload = JSON.parse((await gh.get(spec)).text);
      this.a = payload;
      this.sections = mdDoc.split(this.a.text);
      this.base = JSON.parse(JSON.stringify(this.a.standoff));
      this.regroup();
      this.$nextTick(() => { this.bindDoc(); this.paint(); });
    },
    // Blocks: consecutive units with no blank line between them. Derived from
    // units, so every grain edit rebuilds it; paint() reads blocks and would
    // otherwise keep rendering the units a split just replaced.
    regroup() {
      let blocks = [], cur = null;
      for (const u of this.units) {
        const gap = cur ? this.a.text.slice(cur.at(-1).end, u.start) : '';
        if (!cur || /\n\s*\n/.test(gap)) { cur = [u]; blocks.push(cur); } else cur.push(u);
      }
      this.blocks = blocks;
    },
    get vocab() { return this.so.vocabulary.filter(v => this.count(v.label)); },
    get sides() { return [...new Set(this.vocab.map(v => v.side))]; },
    count(l) { return this.units.filter(u => u.label === l).length; },
    gloss(l) { return (this.so.vocabulary.find(v => v.label === l) || {}).gloss || ''; },
    side(l) { return (this.so.vocabulary.find(v => v.label === l) || {}).side || ''; },
    // Words, not units: a one-line NAV pointer and a four-sentence provenance
    // paragraph are one unit each and are not the same amount of document.
    wordsOn(side) {
      return this.units.filter(u => this.side(u.label) === side)
                       .reduce((n, u) => n + u.words, 0);
    },
    pctOn(side) { return Math.round(100 * this.wordsOn(side) / (this.words || 1)); },
    get words() { return this.units.reduce((n, u) => n + u.words, 0); },
    get shareOf() {
      const t = this.words || 1;
      return Object.fromEntries(this.vocab.map(v => [v.label,
        Math.round(100 * this.units.filter(u => u.label === v.label)
                            .reduce((n, u) => n + u.words, 0) / t)]));
    },
    HUE,
    get so() { return this.a.standoff; },
    get units() { return this.so.units; },
    get raw() { return JSON.stringify(this.so, null, 1); },
    get srcHref() { return 'data:application/json;charset=utf-8,' + encodeURIComponent(this.raw); },
    slice(u) { return this.a.text.slice(u.start, u.end).trim(); },
    // The uid's prefix is the document, which every row on this page shares.
    // Only the ordinal distinguishes them, and the full uid wrapped to two
    // lines on a phone to carry the half that never varies.
    num(u) { return u.uid.split('-').pop(); },

    // EDITING. Every rule about a standoff (the invariants, the four
    // operations, the serialization, where a save may land) lives in
    // lib/kits/standoff.js, and skills/state-the-rule/ops.py is the same rules
    // in Python. This page is the view: it decides what to offer and where to
    // put it, and delegates what an operation MEANS.
    patch: [], at: 0, base: null, menu: null, boundaries: [], opErr: '',
    // UNDO IS FREE, and it is free because the patch is declarative. The
    // annotation on screen is `apply(base, patch.slice(0, at))`, so stepping
    // back is decrementing a number and replaying: no inverse operation to
    // write, none to get wrong, and the two implementations stay one rule.
    // `at` is the cursor into the patch, not its length: a new operation after
    // an undo truncates the redo tail the way every editor does.
    get canUndo() { return this.at > 0; },
    get canRedo() { return this.at < this.patch.length; },
    replay(n) {
      const r = Standoff.apply(this.base, this.patch.slice(0, n), this.a.text);
      if (r.complaints.length) { this.opErr = r.complaints[0]; return false; }
      this.a.standoff = r.so;
      this.at = n;
      this.opErr = '';
      this.regroup();
      const keep = this.sel && this.units.find(u => u.uid === this.sel.uid);
      this.sel = keep ? { ...keep, ref: this.srcRef(keep) } : null;
      this.armed = null;
      this.paint();
      return true;
    },
    undo() { if (this.canUndo) this.replay(this.at - 1); },
    redo() { if (this.canRedo) this.replay(this.at + 1); },
    push(op) {
      // Applied to the live annotation so the view moves under your thumb, then
      // checked and rolled back if it broke something. Same rule ops.py runs on
      // a whole patch: valid against its base, or it does not stand.
      const before = JSON.parse(JSON.stringify(this.units));
      const uid = Standoff.ops[op.op]?.(this.so, this.a.text, op) ?? null;
      const bad = uid === null ? [`${op.op} ${op.uid ?? op.after} was refused`]
                              : Standoff.check(this.so, this.a.text);
      if (bad.length) { this.so.units = before; this.opErr = bad[0]; return; }
      this.opErr = '';
      this.patch.length = this.at;      // a new move drops the redo tail
      this.patch.push(op);
      this.at = this.patch.length;
      this.regroup();
      this.menu = null;
      this.paint();
      const u = this.units.find(x => x.uid === uid);
      this.sel = u ? { ...u, broken: !!this.unitHtml(u).broken, ref: this.srcRef(u) } : null;
    },
    nextOf(uid) { return this.units[this.units.findIndex(u => u.uid === uid) + 1]; },

    // Split candidates are the connectives the measurement said matter: 40% of
    // prose units carry one, with a rule on one side and its reason on the
    // other. Offering those beats a caret, which a phone does not really have.
    //
    // The connective rides with the SECOND half, so the boundary is a
    // lookahead: splitting after "because" leaves the rule ending on a dangling
    // connective and the reason unable to say it is one.
    openSplit(u) {
      const t = this.a.text;
      const re = /[.!?][*`)\]]*\s+|;\s+|:\s+|,\s+(?=so\b|because\b|since\b|which is why\b)/g;
      const body = t.slice(u.start, u.end);
      this.boundaries = [...body.matchAll(re)]
        .map(m => ({ at: u.start + m.index + m[0].length,
                     lead: body.slice(Math.max(0, m.index - 26), m.index + m[0].length).trim(),
                     rest: body.slice(m.index + m[0].length, m.index + m[0].length + 40).trim() }))
        .filter(b => b.at > u.start && b.at < u.end);
      this.menu = 'split';
    },
    get applied() { return this.patch.slice(0, this.at); },
    get patchJson() { return JSON.stringify(this.applied, null, 1); },
    get patchHref() { return 'data:application/json;charset=utf-8,' + encodeURIComponent(this.patchJson); },

    // SAVING. The page writes to the ref it is READING: you previewed a branch,
    // you edited, the edit lands on that branch. Standoff.saveTarget owns which
    // refs qualify and says why when none does.
    saving: false, saved: '', saveErr: '',
    get where() { return Standoff.saveTarget(this.so, this.ref); },
    get target() { return this.where.ref; },
    get whyNoSave() { return this.where.why; },
    async save() {
      if (this.saving || !this.target) return;
      this.saving = true; this.saveErr = ''; this.saved = '';
      try {
        if (!gh.save) await gh.load('gh-store.js');
        // The patch rides in the commit message rather than in a file of its
        // own: the judgment belongs to the change that carries it, and each
        // unit already records its own `from`.
        const head = `standoff: ${this.at} operation${this.at === 1 ? '' : 's'} `
                   + `on ${this.so.target.path}`;
        await gh.save(this.so.self.path, Standoff.serialize(this.so),
                      `${head}\n\n${Standoff.describe(this.applied).join('\n')}\n`);
        this.saved = `${this.units.length} units to ${this.target}`;
        this.base = JSON.parse(JSON.stringify(this.so));
        this.patch = []; this.at = 0;
      } catch (e) {
        this.saveErr = e.message || String(e);
      } finally {
        this.saving = false;
      }
    },
    dim(u) { return this.off[u.label] ? .12 : 1 },
    get unrenderable() {
      return this.units.filter(u => u.kind === 'sent'
        && !balanced(this.a.text.slice(u.start, u.end).trim())).length;
    },
    toggle(l) { this.off[l] = !this.off[l]; this.paint(); },
    srcRef(u) {
      const s = [...this.sections].reverse().find(s => s.start <= u.start);
      return s ? `${this.so.target.path || this.a.title} § ${s.title} (lines ${s.startLine}-${s.endLine})` : this.a.title;
    },
    unitHtml(u) {
      const raw = this.a.text.slice(u.start, u.end).trim();
      if (this.view === 'source') return { html: esc(raw), broken: false };
      if (!balanced(raw)) return { html: esc(raw), broken: true };
      const out = mdDoc.html(raw, { proseClass: '' });
      // A unit is inline IFF markdown produced exactly one <p>; everything else
      // is a block and needs a block wrapper, or the parser hoists it out of the
      // <span> and leaves the tint behind as an empty stripe.
      //
      // Structural, not a tag whitelist, because the whitelist was wrong three
      // times running: first tables and fences, then list bullets (kind `sent`
      // but rendering to <ul>), then tables again once mdDoc.contain() started
      // wrapping them in <div data-md-scroll>. Asking the parse settles all of
      // them and the next one.
      const t = document.createElement('template');
      t.innerHTML = out;
      const kids = [...t.content.children];
      if (kids.length === 1 && kids[0].tagName === 'P')
        return { html: kids[0].innerHTML, block: false };
      return { html: out, block: true };
    },
    paint(host) {
      const host_ = host || this.$refs.doc;
      if (!host_) return;
      host_.innerHTML = '';
      // The type classes go on an inner element, never on the host: paint() does
      // not own its container's layout, and assigning className to the host wiped
      // the padding the page and the deck slide had each given it.
      const box = document.createElement('div');
      box.className = this.view === 'source'
        ? 'whitespace-pre-wrap font-mono text-base leading-7'
        : GuideRender.bodyClass();
      host_.appendChild(box);
      for (const b of this.blocks) {
        const wrap = document.createElement(this.view === 'source' ? 'div' : 'div');
        wrap.className = this.view === 'source' ? 'mb-3' : 'mb-4';
        for (const u of b) {
          const { html, broken, block: isBlock } = this.unitHtml(u);
          const block = this.view === 'read' && isBlock;
          const el = document.createElement(block ? 'div' : 'span');
          el.className = `cursor-pointer px-0.5 ${block ? 'py-1 my-2' : ''}`;
          el.style.background = tint(u.label, .18 * this.dim(u));
          el.style.boxShadow = `inset 2px 0 0 0 ${tint(u.label, .9 * this.dim(u))}`;
          el.style.opacity = this.dim(u);
          if (broken) el.style.outline = '1px dotted rgba(239,68,68,.8)';
          el.innerHTML = html + (this.view === 'source' ? '' : ' ');
          // The span's own address. In Source view its text is the raw slice
          // with the leading whitespace trimmed off, so a character position
          // inside it maps back to the document by adding this. In Read view
          // the text is RENDERED, and no such map exists: `**bold**` is four
          // characters the reader cannot see, which is why edge editing is a
          // Source-view affordance and switches the view rather than guessing.
          el.dataset.uid = u.uid;
          const raw = this.a.text.slice(u.start, u.end);
          el.dataset.off = u.start + (raw.length - raw.trimStart().length);
          if (u.uid === this.sel?.uid) {
            el.style.background = tint(u.label, .42);
            el.style.textDecoration = 'underline';
            el.style.textDecorationThickness = '2px';
            el.style.textUnderlineOffset = '3px';
            el.style.textDecorationColor = tint(u.label, .95);
          }
          el.onclick = () => this.hit(u, broken);
          wrap.appendChild(el);
          if (this.view === 'source') wrap.appendChild(document.createTextNode('\n'));
        }
        box.appendChild(wrap);
      }
      this.$nextTick(() => this.placePins());
    },

    // ── EDGES ────────────────────────────────────────────────────────────────
    // A BOUNDARY IS THE OBJECT, not an edge: the end of one unit is the start of
    // the next, so there is one draggable thing per junction and the partition
    // survives by construction. Overlap is therefore not a mode this offers, and
    // since 2026-08-30 it is also a complaint the checker makes.
    //
    // TAP TO ARM, NOT DRAG TO EXTEND, which is lib/kits/annotate.js's measured
    // answer for the same problem on the same phone: dragging a handle puts the
    // finger over the words being aimed at, which is what every platform then
    // patches with a floating magnifier. Two taps also survive a scroll, a
    // mis-hit and a change of mind, and a drag survives none of them.
    armed: null, pins: [],
    get edges() {
      if (!this.sel || this.view !== 'source') return [];
      const i = this.units.findIndex(u => u.uid === this.sel.uid);
      const out = [];
      if (i > 0) out.push({ edge: 'start', after: this.units[i - 1].uid, at: this.units[i].start });
      if (i >= 0 && i < this.units.length - 1)
        out.push({ edge: 'end', after: this.units[i].uid, at: this.units[i].end });
      return out;
    },
    // A tap in the text is two different requests, and which one is a state the
    // reader set by tapping a pinhead. Armed: put this boundary here. Otherwise:
    // make that unit the active one.
    hit(u, broken) {
      if (this.armed) {
        const e = this.edges.find(x => x.edge === this.armed);
        const off = this.lastTapOffset;
        if (e && off != null) this.push({ op: 'move', after: e.after, to: off });
        this.armed = null;
        return;
      }
      this.sel = { ...u, broken, ref: this.srcRef(u) };
      this.paint();
    },
    // Document offset under a client point, or null. The span carries its own
    // start, so this is one addition rather than a walk over the whole buffer.
    offsetAt(x, y) {
      const d = document;
      let node = null, off = 0;
      if (d.caretRangeFromPoint) { const r = d.caretRangeFromPoint(x, y); if (r) { node = r.startContainer; off = r.startOffset; } }
      else if (d.caretPositionFromPoint) { const p = d.caretPositionFromPoint(x, y); if (p) { node = p.offsetNode; off = p.offset; } }
      if (!node) return null;
      const span = (node.nodeType === 3 ? node.parentElement : node)?.closest('[data-off]');
      if (!span || node.nodeType !== 3) return null;
      return +span.dataset.off + off;
    },
    // The inverse, for placing a pinhead: a collapsed Range at the offset,
    // measured against the doc container so the pins scroll with the text.
    pointAt(at) {
      const host = this.$refs.doc;
      const span = [...host.querySelectorAll('[data-off]')].find(el => {
        const s = +el.dataset.off, n = el.firstChild;
        return n && n.nodeType === 3 && at >= s && at <= s + n.length;
      });
      if (!span) return null;
      const r = document.createRange();
      r.setStart(span.firstChild, at - +span.dataset.off);
      r.collapse(true);
      const b = r.getBoundingClientRect(), h = host.getBoundingClientRect();
      if (!b.height && !b.width) return null;
      return { x: b.left - h.left, y: b.top - h.top, h: b.height || 20 };
    },
    placePins() {
      this.pins = this.edges.map(e => ({ ...e, p: this.pointAt(e.at) })).filter(x => x.p);
    },
    // Where the last tap landed, recorded on the way down so `hit()` can use it
    // on the way up. One delegated listener, bound once: paint() rebuilds every
    // span, so a per-span listener would be re-bound on every repaint.
    lastTapOffset: null,
    bindDoc() {
      const host = this.$refs.doc;
      if (!host || host.dataset.bound) return;
      host.dataset.bound = '1';
      host.addEventListener('pointerdown', (e) => {
        this.lastTapOffset = this.offsetAt(e.clientX, e.clientY);
      });
      // One source of position beats two that must agree, so the pins are
      // re-measured rather than offset. Cheap: at most two of them.
      addEventListener('scroll', () => this.placePins(), { passive: true });
      addEventListener('resize', () => this.placePins());
    },

    // ── THE PAD ──────────────────────────────────────────────────────────────
    // A relative pointer, not a scrubber. The drag moves a VIRTUAL POINT that
    // starts at the armed pin, and each move asks the browser what offset sits
    // under it, so wrapped lines and proportional type come out right without
    // arithmetic over the buffer.
    //
    // The gain depends on how fast the finger moves: creep and the boundary
    // creeps, well under 1:1, which is the precision the pad exists for; flick
    // and it runs ahead. Overshoot on a flick, crawl back a character at a time,
    // both without lifting. The four numbers are the whole feel of the control,
    // and they are lib/kits/annotate.js's, which is where they were tuned.
    padding_: false, padPt: null, padBase: null,
    PAD: { slow: 0.45, fast: 2.4, v0: 0.12, v1: 1.5 },
    padDown(ev) {
      const e = this.edges.find(x => x.edge === this.armed);
      if (!e) return;
      const p = this.pointAt(e.at), h = this.$refs.doc.getBoundingClientRect();
      if (!p) return;
      ev.target.setPointerCapture?.(ev.pointerId);
      this.padding_ = true;
      this.padPt = { x: p.x + h.left, y: p.y + h.top + p.h / 2 };
      this.padBase = { after: e.after, from: e.at, last: ev, t: performance.now() };
      document.body.style.userSelect = 'none';
    },
    padMove(ev) {
      if (!this.padding_) return;
      ev.preventDefault();
      const b = this.padBase, now = performance.now();
      const dx = ev.clientX - b.last.clientX, dy = ev.clientY - b.last.clientY;
      const dt = Math.max(1, now - b.t);
      const v = Math.hypot(dx, dy) / dt, P = this.PAD;
      const t = Math.min(1, Math.max(0, (v - P.v0) / (P.v1 - P.v0)));
      const gain = P.slow + t * (P.fast - P.slow);
      this.padPt = { x: this.padPt.x + dx * gain, y: this.padPt.y + dy * gain };
      b.last = ev; b.t = now;
      // Nothing under the point is not a failure: the point keeps moving and
      // the boundary holds until text is under it again. Walking x back to the
      // line end was tried and is the wrong reading, since past the end of a
      // line the next character is on the NEXT line, and the point reaches it
      // by moving down the way a finger would.
      const off = this.offsetAt(this.padPt.x, this.padPt.y);
      if (off != null) {
        // Moved on the live annotation, not recorded: one drag is one judgment,
        // so the patch gets a single `move` when the finger lifts.
        if (Standoff.ops.move(this.so, this.a.text, { after: b.after, to: off }) !== null) {
          this.regroup(); this.paint();
        }
      }
    },
    padUp() {
      if (!this.padding_) return;
      this.padding_ = false;
      document.body.style.userSelect = '';
      const b = this.padBase, e = this.edges.find(x => x.edge === this.armed);
      const to = e ? e.at : b.from;
      // Put it back, then let push() make the one real operation, so the page
      // and a patch replayed by ops.py end in the same place.
      Standoff.ops.move(this.so, this.a.text, { after: b.after, to: b.from });
      this.regroup();
      if (to !== b.from) this.push({ op: 'move', after: b.after, to });
      else this.paint();
    },
    // The deck is a CONTAINER, not a viewer: one section per slide, same units,
    // same paint(). Nothing about the audit changes to ride it.
    deck() {
      const secs = this.sections;
      swipeDeck.open({
        count: secs.length, title: this.a.title, subtitle: this.so.question, icon: 'ph-cards',
        render: (i, slide) => {
          const s = secs[i];
          const head = document.createElement('div');
          head.className = 'px-4 pt-4 pb-2 text-xs opacity-60';
          const inSec = this.units.filter(u => u.start >= s.start && u.start < s.end);
          const w = inSec.reduce((n, u) => n + u.words, 0);
          const exp = inSec.filter(u => this.side(u.label) === 'explanation')
                           .reduce((n, u) => n + u.words, 0);
          head.textContent = `${s.title} · ${inSec.length} units · ${w ? Math.round(100 * exp / w) : 0}% explanation`;
          const body = document.createElement('div');
          body.className = 'px-4 pb-6 overflow-y-auto';
          slide.append(head, body);
          const save = this.blocks;
          this.blocks = save.filter(b => b[0].start >= s.start && b[0].start < s.end);
          this.paint(body);
          this.blocks = save;
        },
      });
    },
  });
  await gh.load('alpine-bundle.js');
</script>
</head>
<body class="bg-base-100 min-h-dvh" x-data="auditPage()" x-init="init()">
<template x-if="a">
  <div>

    <!-- Tenant chrome: this page is routinely tossed inside an iframe, so it
         sticks rather than taking the viewport, and it does not narrow itself
         to a reading column. The figure is one compact line, not stat cards:
         the reading that gives those numbers meaning is one tap away, under
         Reading. -->
    <header class="sticky top-0 z-20 bg-base-100/90 backdrop-blur border-b border-base-300">
      <div class="px-4 py-2 flex flex-wrap items-center gap-x-3 gap-y-1">
        <span class="font-semibold" x-text="a.title"></span>
        <span class="text-xs opacity-60" x-text="so.question"></span>
        <span class="text-xs font-mono opacity-70"
              x-text="`${units.length} units · ${words.toLocaleString()} words · ${pctOn('explanation')}% explanation`"></span>
        <a class="text-xs link link-primary" :href="so.target.url" x-show="so.target.url">source</a>
        <div class="join ml-auto">
          <button class="join-item btn btn-xs" :class="view==='source' && 'btn-active'"
                  @click="view='source'; paint()">Source</button>
          <button class="join-item btn btn-xs" :class="view==='read' && 'btn-active'"
                  @click="view='read'; paint()">Read</button>
          <button class="join-item btn btn-xs" :class="view==='standoff' && 'btn-active'"
                  @click="view='standoff'">Standoff</button>
        </div>
        <button class="btn btn-xs btn-ghost" @click="deck()"><i class="ph ph-cards"></i> Sections</button>
        <button class="btn btn-xs btn-ghost" @click="$refs.reading.showModal()">Reading</button>
        <div class="join" x-show="patch.length" x-cloak>
          <button class="join-item btn btn-xs" :disabled="!canUndo" @click="undo()"
                  aria-label="undo"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="join-item btn btn-xs btn-primary" @click="$refs.patch.showModal()">
            patch <span class="font-mono" x-text="at + (canRedo ? '/' + patch.length : '')"></span></button>
          <button class="join-item btn btn-xs" :disabled="!canRedo" @click="redo()"
                  aria-label="redo"><i class="ph ph-arrow-clockwise"></i></button>
        </div>
      </div>

      <!-- The legend is the explanation. Each chip carries the treatment it
           names, so a label chip is tinted as its units are. Tapping one dims
           its units in place rather than hiding them, which keeps the document
           readable while one category is set aside. -->
      <div class="px-4 pb-2 flex flex-wrap items-center gap-1">
        <template x-for="v in vocab" :key="v.label">
          <button class="btn btn-xs gap-1.5 border-0"
                  :style="`background:rgba(${HUE[v.label]},${off[v.label]?0.05:0.22});
                           box-shadow:inset 2px 0 0 0 rgba(${HUE[v.label]},${off[v.label]?0.2:0.9})`"
                  :class="off[v.label] && 'opacity-40'"
                  @click="toggle(v.label)">
            <span x-text="v.label"></span>
            <span class="opacity-60 font-mono" x-text="count(v.label)"></span>
          </button>
        </template>
        <span class="w-px h-4 bg-base-300 mx-1"></span>
        <span class="btn btn-xs btn-ghost no-animation cursor-default gap-1.5"
              style="outline:1px dotted rgba(239,68,68,.8)"
              x-show="view==='read' && unrenderable">
          <span>slice does not close</span>
          <span class="opacity-60 font-mono" x-text="unrenderable"></span>
        </span>
      </div>
    </header>

    <div class="relative">
      <div x-ref="doc" class="px-4 py-4" x-show="view!=='standoff'"></div>
      <!-- The pins sit in a layer over the text, measured against the same
           container, so scrolling moves both together. A pinhead is a 36px
           target around a hairline bar: the bar is the boundary, the box is
           the thumb. -->
      <template x-for="pin in pins" :key="pin.edge">
        <button class="absolute z-10 grid place-items-center"
                :class="padding_ && 'pointer-events-none'"
                style="width:36px;height:36px;margin-left:-18px"
                :style="`left:${pin.p.x}px; top:${pin.p.y + pin.p.h/2 - 18}px`"
                :aria-label="`${pin.edge} boundary`"
                @click.stop="armed = armed === pin.edge ? null : pin.edge">
          <span class="rounded-full transition-all"
                :class="armed===pin.edge ? 'w-3 h-3' : 'w-2 h-2'"
                :style="`background:${armed===pin.edge ? 'var(--color-primary)' : 'var(--color-base-content)'};
                         opacity:${armed===pin.edge ? 1 : .5}`"></span>
          <span class="absolute w-0.5"
                :style="`height:${pin.p.h + 6}px; background:var(--color-primary);
                         opacity:${armed===pin.edge ? .9 : .35}`"></span>
        </button>
      </template>
    </div>

    <!-- The annotation as the thing it is: rows over spans, and the committed
         bytes underneath. The page never re-derives this; the builder copies
         standoff.json in verbatim, so what is on screen is what is in the file. -->
    <div class="px-4 py-4" x-show="view==='standoff'" x-cloak>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs font-mono mb-3">
        <span x-text="so.kind"></span>
        <a class="link link-primary" :href="so.target.url" x-text="so.target.path"></a>
        <span x-text="so.target.bytes + ' bytes'"></span>
        <span class="opacity-60" x-text="'sha256 ' + so.target.sha256.slice(0,16)"></span>
        <a class="link" :href="srcHref" download="standoff.json">download</a>
      </div>
      <div class="overflow-x-auto">
        <table class="table table-xs">
          <thead><tr><th class="text-right">#</th>
                     <th class="text-right">start</th><th class="text-right">end</th>
                     <th>kind</th><th class="text-right">w</th>
                     <th>label</th><th>note</th><th>text</th></tr></thead>
          <tbody>
            <template x-for="u in units" :key="u.uid">
              <tr class="cursor-pointer hover:bg-base-200"
                  @click="sel={...u, ref: srcRef(u)}; armed=null">
                <td class="font-mono text-right" x-text="num(u)"></td>
                <td class="font-mono opacity-60 text-right whitespace-nowrap" x-text="u.start"></td>
                <td class="font-mono opacity-60 text-right whitespace-nowrap" x-text="u.end"></td>
                <td class="opacity-60" x-text="u.kind"></td>
                <td class="font-mono opacity-60 text-right" x-text="u.words"></td>
                <td><span class="rounded px-1 whitespace-nowrap"
                          :style="`background:rgba(${HUE[u.label]},.25)`" x-text="u.label"></span></td>
                <td class="italic opacity-70 max-w-40 truncate" x-text="u.note || ''"></td>
                <td class="max-w-md truncate" x-text="slice(u)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <details class="mt-4">
        <summary class="cursor-pointer text-xs opacity-60">standoff.json, verbatim</summary>
        <pre class="mt-2 text-xs overflow-x-auto bg-base-200 p-3 rounded" x-text="raw"></pre>
      </details>
    </div>

    <!-- Above the shared FAB (z-80), which is fixed to this same corner and was
         covering the split candidates. dictate.html's sheet takes the corner the
         same way: while a page's own bottom UI is up, it owns the bottom. -->
    <div class="sticky bottom-0 z-[90] bg-base-200 border-t border-base-300 px-4 py-2 text-xs"
         x-show="sel" x-cloak>
      <div class="flex flex-wrap gap-x-4 gap-y-1 items-baseline">
        <b class="font-mono" x-text="sel?.uid"></b>
        <span class="badge badge-sm border-0"
              :style="`background:rgba(${HUE[sel?.label]},.25)`" x-text="sel?.label"></span>
        <span class="opacity-60" x-text="gloss(sel?.label)"></span>
        <span class="badge badge-sm badge-outline" x-text="side(sel?.label)"></span>
        <span class="opacity-60 font-mono" x-text="sel?.words + 'w · ' + sel?.kind"></span>
        <span class="opacity-60 font-mono" x-text="sel?.ref"></span>
        <span class="italic opacity-70" x-show="sel?.note" x-text="sel?.note"></span>
        <span class="text-error" x-show="sel?.broken">slice does not close its own markup</span>
        <span class="text-error" x-show="opErr" x-text="opErr"></span>
        <button class="btn btn-ghost btn-xs ml-auto" @click="sel=null; menu=null">close</button>
      </div>

      <div class="flex items-center gap-2 mt-2" x-show="armed" x-cloak>
        <button class="btn btn-sm btn-primary touch-none select-none"
                @pointerdown="padDown($event)" @pointermove="padMove($event)"
                @pointerup="padUp()" @pointercancel="padUp()">
          <i class="ph ph-crosshair"></i> drag the edge
        </button>
        <span class="opacity-60 font-mono" x-text="edges.find(e=>e.edge===armed)?.at"></span>
      </div>

      <div class="flex flex-wrap items-center gap-1 mt-2">
        <button class="btn btn-xs" x-show="view!=='source'"
                @click="view='source'; paint()">Edges</button>
        <button class="btn btn-xs" @click="openSplit(sel)">Split</button>
        <button class="btn btn-xs" :disabled="!nextOf(sel?.uid)"
                @click="push({op:'merge',uid:sel.uid})">Merge next</button>
        <button class="btn btn-xs" :class="menu==='label' && 'btn-active'"
                @click="menu = menu==='label' ? null : 'label'">Relabel</button>
        <button class="btn btn-xs" :class="menu==='note' && 'btn-active'"
                @click="menu = menu==='note' ? null : 'note'">Note</button>
      </div>

      <div class="flex flex-wrap gap-1 mt-2" x-show="menu==='label'">
        <template x-for="v in so.vocabulary" :key="v.label">
          <button class="btn btn-xs border-0" :class="v.label===sel?.label && 'ring-1 ring-base-content'"
                  :style="`background:rgba(${HUE[v.label]},.22)`"
                  @click="push({op:'relabel',uid:sel.uid,label:v.label})" x-text="v.label"></button>
        </template>
      </div>

      <div class="mt-2" x-show="menu==='note'">
        <input class="input input-xs input-bordered w-full" placeholder="what the label cannot say"
               :value="sel?.note || ''" @keydown.enter="push({op:'note',uid:sel.uid,text:$event.target.value})">
      </div>

      <div class="mt-2 space-y-1" x-show="menu==='split'">
        <template x-if="!boundaries.length">
          <span class="opacity-60">no clause boundary inside this unit</span>
        </template>
        <template x-for="b in boundaries" :key="b.at">
          <button class="btn btn-xs btn-block justify-start font-normal h-auto py-1 text-left"
                  @click="push({op:'split',uid:sel.uid,at:b.at})">
            <span class="opacity-50" x-text="'…' + b.lead"></span>
            <span class="text-primary">▸</span>
            <span x-text="b.rest + '…'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- The patch is the artifact of an editing session: what you decided,
         reviewable as a list of judgments rather than as a JSON diff. -->
    <dialog class="modal" x-ref="patch">
      <div class="modal-box max-w-2xl">
        <div class="flex items-center gap-2 mb-2 text-xs">
          <span class="font-mono" x-text="at + ' of ' + patch.length + ' applied'"></span>
          <a class="link" :href="patchHref" download="patch.json">download</a>
          <button class="link" @click="navigator.clipboard?.writeText(patchJson)">copy</button>
          <button class="link text-error ml-auto" @click="location.reload()">discard</button>
        </div>
        <pre class="text-xs overflow-x-auto bg-base-200 p-3 rounded" x-text="patchJson"></pre>

        <!-- Two ways out, and the page says which one is open. Saving writes
             the edited standoff to the ref being read; where that ref is main
             there is nothing to write to, and the command below is the route. -->
        <div class="flex flex-wrap items-center gap-2 mt-3 text-xs">
          <button class="btn btn-sm btn-primary" x-show="target" :disabled="!!saving"
                  @click="save()">
            <span x-text="saving ? 'saving…' : 'save to ' + target"></span>
          </button>
          <span class="opacity-60" x-show="whyNoSave" x-text="whyNoSave"></span>
          <span class="text-success" x-show="saved" x-text="'saved ' + saved"></span>
          <span class="text-error" x-show="saveErr" x-text="saveErr"></span>
        </div>
        <p class="text-xs opacity-60 mt-2 font-mono">
          python3 skills/state-the-rule/ops.py &lt;standoff.json&gt; patch.json &lt;doc.md&gt; --write
        </p>
        <form method="dialog" class="modal-backdrop"><button class="btn btn-sm btn-block mt-3">close</button></form>
      </div>
    </dialog>

    <!-- Where the numbers went: the header carries the figure, the reading that
         makes it mean something lives here, one tap away. -->
    <dialog class="modal" x-ref="reading">
      <div class="modal-box max-w-lg">
        <table class="table table-sm">
          <thead><tr><th>side</th><th>units</th><th>words</th></tr></thead>
          <tbody>
            <template x-for="sd in sides" :key="sd">
              <tr><td x-text="sd"></td>
                  <td class="font-mono" x-text="units.filter(u => side(u.label) === sd).length"></td>
                  <td class="font-mono" x-text="pctOn(sd) + '%'"></td></tr>
            </template>
          </tbody>
        </table>
        <table class="table table-sm mt-2">
          <thead><tr><th>label</th><th>units</th><th>words</th><th>side</th></tr></thead>
          <tbody>
            <template x-for="v in vocab" :key="v.label">
              <tr><td class="font-mono" x-text="v.label"></td>
                  <td class="font-mono" x-text="count(v.label)"></td>
                  <td class="font-mono" x-text="shareOf[v.label] + '%'"></td>
                  <td class="opacity-60" x-text="v.side"></td></tr>
            </template>
          </tbody>
        </table>
        <form method="dialog" class="modal-backdrop"><button class="btn btn-sm btn-block mt-3">close</button></form>
      </div>
    </dialog>

  </div>
</template>
</body>
</html>
