<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎙️</text></svg>">

<!--
  dictate.html — the blank page you talk at.

  Every other caller of kits/dictate.js attaches the voice buffer to something:
  the annotator pins a note to a passage, the stage makes a file out of it, the
  FAB's menu stages a note about the page you are reading. All three are right
  and none of them answers "I want to say a thing." That address did not exist,
  which is why the dictation stack could be complete and still not be reached
  for. This page is the missing address and nothing else: a full viewport of
  text, a pad under your thumb, and somewhere for the words to go.

  IT IS A PHONE PAGE FIRST. Not responsive-so-it-also-works: the shell is the
  viewport (h-dvh, no document scroll, so no pull-to-refresh and no rubber
  band), the controls sit at the bottom where a thumb already is, the type runs
  large enough to read at arm's length while speaking, and the bottom row
  clears the home indicator. A desktop gets the same thing centred, which costs
  nothing and is the honest way round: the hard constraints are the phone's.

  THE GESTURE LAYER IS THE NOTES COMPOSER'S (kits/annotate.js), not the
  stage's. The first cut of this page took the stage's dictation card, which
  is a version behind: it keeps the painter's arrow cluster because it has no
  cursor pad, and it still carries a pencil into the keyboard. What came
  across on 2026-08-23 is the composer's answer to both. The PAD is held and
  dragged, the caret moves and the button does not, so placing one no longer
  means putting a thumb over the two words either side of it; `arrows: false`
  follows, since an armed pin is dragged the same way. A DOUBLE TAP opens the
  keyboard where it landed, and the pencil is gone. What did NOT come across
  is the composer's vertical mark column, for a reason measured rather than
  preferred: see "The text" below.

  WHAT IT ADDS TO THE KIT, since the kit is where the composition rules live:

    THE ENGINE IS KEPT ALIVE. Not here, in the kit, but this page is why it
    was fixed. `continuous` is a request WebKit does not honor past its own
    silence timeout, so the microphone switched itself off at every thinking
    pause. Survivable for a one-sentence note; fatal for the thing this page
    is for. See "Keeping the engine alive" in kits/dictate.js.

    THE DRAFT SURVIVES THE PAGE. Every change writes the buffer to
    localStorage, and it is restored on the next load. A phone call, a swipe
    to another app that comes back cold, a stray reload: none of them should
    cost ten minutes of talking. The draft is cleared when the words reach
    somewhere durable, so a session that ENDED properly opens blank and only
    an INTERRUPTED one comes back.

    THE SCREEN IS HELD AWAKE while listening, because a phone that dims and
    locks takes the microphone with it, and nothing about that failure tells
    the reader what happened.

    IT COMES BACK FROM THE BACKGROUND. Switching apps kills the recognition
    outright, past anything a relaunch timer can see, so returning to a
    visible page restarts it if the reader never asked to stop.

    THE WORDS GO SOMEWHERE. This is the half that makes it a tool rather than
    a textarea. Copy and Share read the buffer; Jot files it in the estate's
    pile (the registry's lists/jots.json, which the app already renders at
    ?view=jots) and Drop writes a dated markdown file into home's chron/dump/,
    the tray /drain reads. The two that file it durably clear the buffer; the
    two that only read it leave it alone.

    AUTOCORRECT, and the plain word is the right one: it is find and replace
    over a list, whole words, longest first, applied to each segment as it
    lands (kits/dictate.js `opts.fix`). It earns its place only because iOS
    Text Replacement reaches the keyboard and not a page's speech results,
    and because the Web Speech API's own SpeechGrammarList does nothing in
    WebKit. The list lives in the registry and the menu row adds to it from
    whatever is selected, so it gets better the more it is wrong. What it
    cannot do is context: homophones are out of its reach entirely, and only
    a model reading the sentence around a word would go further.

  WHERE THE CONTROLS SIT. The HEADER is a three-column grid: the session on
  the left (record, and how long it has run), the TARGET on the centre line,
  and the history plus the menu on the right (undo, redo, backspace). The
  BOTTOM holds the marks and Save. Record doubles as the state readout, since
  red and pulsing answers "is it hearing me" from across the room and the page
  then needs no word for it.

  Backspace is the one placement worth arguing with: it is tapped mid-sentence
  more than anything but the marks, and it now lives at the top of the screen
  where a thumb has to travel. Moved there 2026-08-25 on the reading that it
  undoes a word the way undo undoes an act, so the three belong together. If
  it turns out to cost more than the grouping buys, it goes back.

  THE TARGET IS TWO GESTURES ON ONE BUTTON, because they are one job: this is
  the control that aims. DRAG it and the caret moves (the pad, below). TAP it
  and the caret becomes one end of a selection whose other end is your next
  tap in the text. Two taps for an arbitrary range, where the long press gives
  only a word and the pins give one edge at a time. Armed, it wears the ring
  an armed pin wears, which is this page's one word for "live and pointed at
  the text" and is why the affordance needs no label.

  ADDRESSING
    ?to=copy|share|jot|drop   which destination the save sheet opens on
    ?dest=owner/repo[@ref]:dir   where Drop writes, overriding home/chron/dump
    ?lang=en-US               recognition language, default the browser's
    ?use=<ref>                pin the lib chain to a branch for previewing

  THE ONE TAP ON ARRIVAL is not a design choice. WebKit needs a user gesture
  before it will raise the microphone prompt, so a page cannot start listening
  on its own the first time. Once the reader has allowed it, the grant is
  remembered here and the next arrival starts listening with no tap at all;
  a refusal or a throw falls back to the tap target rather than asking again.
-->

<style>
[x-cloak]{display:none!important}

/* ── The selection lock ──────────────────────────────────────────────────
   A STYLESHEET, not an inline style, which is the composer's rule and the
   reason it has one. `-webkit-touch-callout` is absent from the CSSOM's
   property list, so inline it survives only as authored attribute text and
   ANY later `.style.foo =` on that element re-serializes the attribute from
   the parsed declarations and drops it, silently. A rule here is parsed once
   and cannot be clobbered.

   And it covers the WHOLE surface, not just the painted text. Measured
   2026-08-24 after the field report: the text host read user-select:none and
   the scroll box around it read auto, so every press in the padding and in
   the empty canvas below the last line, which is most of the screen, raised
   the platform's own selection and its callout bubble over the words.

   touch-action rides along because it does NOT inherit: the host and the
   painted spans both computed `auto` under a layer set to manipulation, and
   a phone reads a double tap on auto as a request to zoom. That is now the
   gesture that opens the keyboard, so the reader got both. Inline values win
   on specificity, which is how the pad keeps its `none`. */
[data-dictate-ui], [data-dictate-ui] * {
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
[data-dictate-ui] textarea, [data-dictate-ui] input {
  -webkit-touch-callout: default; -webkit-user-select: text; user-select: text;
}

/* A PIN IS FURNITURE WHILE THE PAD IS DRIVING IT. A pin's hit box is 32px
   wide, so caret-from-point keeps answering with the pin rather than with the
   word under it, and the edge does not move until the aim point has cleared
   it. The composer measured the cost at a 32px dead band per pin, stepping 13,
   15, 17 across a 120px sweep. Taps still arm a pin; only for the length of a
   drag is it transparent. */
[data-dictate-pad] [data-edge] { pointer-events: none; }
</style>

<script type="module">
  const q = new URLSearchParams(location.search);
  const ref = q.get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('gh-auth.js');
  await gh.load('gh-store.js');
  await gh.load('kits/dictate.js');

  const REGISTRY = 'mehrlander/web-tools-private';
  const JOTS = 'lists/jots.json';
  const AUTOCORRECT = 'lists/autocorrect.json';
  const DRAFT = 'dictate:draft';
  const GRANT = 'dictate:granted';

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // A destination address: "owner/repo[@ref]:dir". The same grammar every
  // envelope here uses, so ?dest= reads like a stage item rather than like a
  // third way of naming a place.
  const parseDest = (s) => {
    const m = /^([^/\s]+\/[^@:\s]+)(?:@([^:\s]+))?:(.*)$/.exec(String(s || '').trim());
    return m ? { repo: m[1], ref: m[2] || '', dir: m[3].replace(/^\/|\/$/g, '') } : null;
  };
  const DEST = parseDest(q.get('dest')) || { repo: 'mehrlander/home', ref: '', dir: 'chron/dump' };

  document.addEventListener('alpine:init', () => {
    Alpine.data('dictate', () => ({
      // The buffer is the kit's. Everything below is a mirror it writes
      // through onText, so there is one answer to "what has been said" and
      // this component is a view of it, never a second copy.
      d: null,
      text: '', interim: '', armed: null, beat: 0,
      listening: false, err: '',
      started: false,           // has the reader ever begun (the tap target)
      elapsed: 0, since: 0,
      edit: false, draft: '',
      breaks: false,
      menu: false, sheet: false, autoOpen: false,
      dest: q.get('to') || 'copy',
      autoFrom: '', autoTo: '',
      corrections: [], autoRe: null,
      restored: 0,              // how many characters came back from a draft
      saving: '',
      canShare: typeof navigator !== 'undefined' && !!navigator.share,
      destName: DEST.repo.split('/')[1] + '/' + DEST.dir,
      _wake: null,

      get token() { return window.TOKEN || ls.get('ghToken') || ''; },
      get words() { const t = (this.text + ' ' + this.interim).trim(); return t ? t.split(/\s+/).length : 0; },
      get clock() {
        const s = Math.floor(this.elapsed / 1000);
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      },
      get empty() { return !this.text.trim() && !this.interim.trim(); },
      get sel() { this.beat; return !!(this.d && this.d.hasSelection); },
      get stitchable() { this.beat; return !!(this.d && this.d.canStitch); },
      get breakable() { this.beat; return !this.edit && !!this.text && !!(this.d && this.d.segments.length); },
      get canUndo() { this.beat; return !!(this.d && this.d.canUndo); },
      get canRedo() { this.beat; return !!(this.d && this.d.canRedo); },

      // THE PAD, ported from the notes composer (kits/annotate.js) rather than
      // from the stage's card, which is where this page's first cut came from
      // and which is a version behind. Three keys and a shift, four faces:
      //
      //   PRIMARY   . , ?          the marks ordinary prose runs on
      //   SHIFTED   ; ! ¶          reached for deliberately, worth a second tap
      //   CASING    AB ab Ab       while a selection is live, since a selection
      //                            is made to fix a word far more often than to
      //                            punctuate one
      //   STITCHED  ⇥ , ?          with a caret in a sentence gap, the top key
      //                            becomes the key that closes the gap, because
      //                            a full stop cannot be wanted where one sits
      //
      // The page's own six-across row is retired with the arrow cluster: it was
      // reasoned from the width a page has and the composer does not, which was
      // true and beside the point once the composer had moved on.
      get pad() {
        if (this.sel) return [
          { k: 'AB', t: 'Upper case' }, { k: 'ab', t: 'Lower case' }, { k: 'Ab', t: 'Capitalise' },
        ];
        if (this.shift) return [
          { k: ';', t: 'Semicolon' }, { k: '!', t: 'Exclamation point' }, { k: '¶', t: 'New paragraph' },
        ];
        return [
          this.stitchable
            ? { k: 'stitch', t: 'Join this to the sentence before it: the full stop goes and the capital comes down' }
            : { k: '.', t: 'Full stop' },
          { k: ',', t: 'Comma' }, { k: '?', t: 'Question mark' },
        ];
      },

      init() {
        this.d = window.Dictate.create({
          lang: q.get('lang') || undefined,
          fix: (s) => this.autocorrect(s),
          onText: (t) => { this.text = t; this.heard(); this.save(); this.paint(); },
          onInterim: (t) => { this.interim = t; this.heard(); this.paint(); },
          onState: () => {
            this.listening = !!(this.d && this.d.listening);
            if (this.listening) this.wake(); else this.unwake();
          },
          onError: (m) => {
            this.err = m;
            // A refusal invalidates the remembered grant, so the next arrival
            // asks with a tap rather than starting into a denied microphone.
            if (/not-allowed/.test(m)) ls.del(GRANT);
          },
        });

        // An interrupted session comes back. A finished one does not: `save`
        // is cleared wherever the words reach somewhere durable, so a blank
        // page here means the last note was filed, not that one was lost.
        const held = ls.get(DRAFT);
        if (held && held.trim()) { this.d.text = held; this.restored = held.length; this.started = true; }

        this.loadCorrections();
        // Paint AFTER binding, not only from onText. A restored draft is
        // assigned in init(), which runs before $refs.body exists, so its
        // paint had nowhere to land and the page came back blank with the
        // words sitting in the buffer behind it. Found by the browser check.
        this.$nextTick(() => { this.bind(this.$refs.body); this.paint(); });
        setInterval(() => { if (this.listening) this.elapsed = Date.now() - this.since; }, 500);

        // Backgrounding kills the recognition outright, below anything the
        // kit's relaunch timer can see: the page is frozen, so the timer does
        // not run either. Coming back visible is the only moment that can
        // notice, and it restarts only what the reader never stopped.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          if (this.listening) { this.d.start(); this.wake(); }
        });

        // The remembered grant. WebKit will not raise the microphone prompt
        // outside a user gesture, so the first arrival must be tapped; after
        // that the permission is the site's and the page can simply begin.
        if (ls.get(GRANT) && this.d.available()) this.begin();
      },

      // ── Starting ──────────────────────────────────────────────────────
      begin() {
        this.started = true;
        this.since = Date.now() - this.elapsed;
        this.err = '';
        this.d.start();
      },
      mic() {
        if (this.listening) { this.d.stop(); return; }
        this.begin();
      },

      // WORDS ARRIVING is the proof, and the only one available. Starting an
      // engine is not: r.start() succeeds whether or not the microphone is
      // allowed, and the refusal comes back asynchronously, so a flag written
      // at start time would remember a permission that was never granted.
      heard() {
        // GATED ON THE ENGINE. onText fires for every write to the buffer, a
        // restored draft and a typed edit included, and treating those as
        // speech wrote a microphone grant nobody had given and cleared the
        // banner announcing the restore in the same breath.
        if (this._heard || !this.listening) return;
        this._heard = true;
        ls.set(GRANT, '1');
        this.restored = 0;
      },

      async wake() {
        // A phone that dims and locks takes the microphone with it, and the
        // reader is given no reason. Absent in a browser without the API,
        // which loses nothing that was working before.
        if (this._wake || !navigator.wakeLock) return;
        try { this._wake = await navigator.wakeLock.request('screen'); } catch {}
      },
      unwake() { try { this._wake && this._wake.release(); } catch {} this._wake = null; },

      save() { this.text.trim() ? ls.set(DRAFT, this.text) : ls.del(DRAFT); },

      // ── The painted surface and its gestures ──────────────────────────
      // The notes composer's set, which is a version on from the stage's and
      // differs in what the reader is given to aim WITH:
      //
      //   long press ON the words   take the word under the finger
      //   long press OFF them       open the keyboard, caret where it was
      //   double tap                open the keyboard, caret where it landed
      //   single tap                place the caret, or move an armed edge
      //   tap a pinhead             arm that edge, or put it down
      //   mouse drag                select, for a pointer that has no problem
      //
      // No triple, and no arrow cluster. The triple's select-all cannot
      // survive the double opening a keyboard: the second tap swaps the read
      // surface for a textarea and the third lands somewhere this listener
      // cannot hear. The arrows are retired by the pad below, which drags an
      // armed pin with the same gesture it drags the caret.
      bind(host) {
        this._host = host;
        const surface = host.parentElement || host;
        let timer = null, x = 0, y = 0, long = false, lastTap = 0, taps = 0, anchor = null, dragging = false;
        const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
        const at = (cx, cy) => {
          const doc = host.ownerDocument;
          const r = doc.caretRangeFromPoint ? doc.caretRangeFromPoint(cx, cy) : null;
          const pt = !r && doc.caretPositionFromPoint ? doc.caretPositionFromPoint(cx, cy) : null;
          const node = r ? r.startContainer : pt ? pt.offsetNode : null;
          const off = r ? r.startOffset : pt ? pt.offset : 0;
          return node ? window.Dictate.offsetAt(host, node, off) : null;
        };
        surface.addEventListener('pointerdown', (e) => {
          if (this.edit) return;
          // A mouse or a keyboard means the pins can go: drag and shift-click
          // do the extending, so the handles are furniture for a job the
          // platform already does. The selection stays painted.
          if (e.pointerType === 'mouse') { this.precise = true; }
          x = e.clientX; y = e.clientY; long = false;
          anchor = window.Dictate.hitsText(host, x, y) ? at(x, y) : null;
          clear();
          timer = setTimeout(() => {
            timer = null; long = true;
            // OFF the words a held finger is not an aim that missed, it is a
            // request for the keyboard. Nothing is collapsed on the way in.
            if (!window.Dictate.hitsText(host, x, y)) { this.editOpen(); return; }
            const i = at(x, y);
            if (i == null) return;
            this.d.selectWordAt(i); this.armed = null; this.paint();
          }, 450);
        });
        surface.addEventListener('pointermove', (e) => {
          const far = Math.abs(e.clientX - x) > 10 || Math.abs(e.clientY - y) > 10;
          if (timer && far) clear();
          // Past the slop with the button down, the drag is a selection. Under
          // it, a click that wobbled, and turning that into a one-character
          // selection is how a text box comes to feel twitchy.
          if (anchor == null || !e.buttons || !(far || dragging)) return;
          const i = at(e.clientX, e.clientY);
          if (i == null) return;
          dragging = true; this.armed = null;
          if (i === anchor) this.d.caretAt(i); else this.d.select(anchor, i);
          this.paint();
        });
        surface.addEventListener('pointercancel', () => { clear(); anchor = null; dragging = false; });
        (this.$refs.layer || surface).addEventListener('pointerup', (e) => {
          clear();
          // A drag claims its own release: the tap logic below would read it as
          // a click and drop a caret where the selection just finished.
          if (dragging) { dragging = false; anchor = null; taps = 0; return; }
          anchor = null;
          if (this.edit || long || this.padDrag) return;
          const pin = e.target?.closest?.('[data-edge]');
          if (!pin && !surface.contains(e.target)) { taps = 0; return; }
          // ARMING ENDS A RUN. pointerdown already armed the pin, and counting
          // the tap too made "tap a pin, then tap the text" a double and opened
          // the keyboard on the gesture meant to move the edge.
          if (pin) { taps = 0; return; }
          const t = Date.now();
          taps = (t - lastTap) < 300 ? taps + 1 : 1;
          lastTap = t;
          const onText = window.Dictate.hitsText(host, e.clientX, e.clientY);
          const i = onText ? at(e.clientX, e.clientY) : null;
          // The double opens the keyboard from the canvas too: tapping the
          // empty space under the words is the most obvious way of saying
          // "let me type here", and it used to be the one place that did
          // nothing, because the canvas won before the count.
          if (taps >= 2) { taps = 0; this.editOpen(i == null ? this.d.text.length : i); return; }
          // The armed anchor takes the tap first, canvas included: a tap past
          // the last word means the end of the buffer there as everywhere.
          if (this.anchorTo(i == null ? this.d.text.length : i)) return;
          if (i == null) { this.d.caretAt(this.d.text.length); this.armed = null; this.paint(); return; }
          if (this.armed) this.d.moveEdge(this.armed, i);
          else this.d.caretAt(i);
          this.paint();
        });
      },
      layerTap(e) {
        const edge = e.target?.closest?.('[data-edge]');
        if (!edge) return;
        e.preventDefault(); e.stopPropagation();
        const which = edge.getAttribute('data-edge');
        this.armed = this.armed === which ? null : which;
        this.paint();
      },

      // ── The cursor pad ────────────────────────────────────────────────
      // Press it and drag: the button does not move, the CARET does. On a
      // phone the only way to place a caret was to touch the text at the place
      // you were aiming at, which puts a thumb over the two words either side
      // of it, and a second tap there takes the word instead of moving
      // anything. So the one gesture for "put it between these two" hid its
      // own target and had a homonym. Here the finger is somewhere else and
      // the eye stays on the text.
      //
      // Ported from kits/annotate.js, constants and all, because the feel IS
      // the three numbers: crawl and the caret creeps at well under 1:1, flick
      // and it runs ahead of the thumb, so a short button reaches a long
      // buffer and the overshoot is walked back without lifting.
      padDrag: false, precise: false,

      // ── The target's other half: anchoring ────────────────────────────
      // The pad DRAGS the caret; a plain TAP on it arms a selection that
      // starts where the caret already is, and the next tap in the text is
      // the other end. Two taps for an arbitrary range, where the long press
      // gives a word and the pins give one edge at a time.
      //
      // It is the same button because it is the same job: this is the control
      // that aims. Dragging says where the point goes, tapping says the point
      // is one end of something. Armed, it wears the ring an armed pin wears,
      // which is the page's one word for "this is live and pointed at the
      // text" and is why the affordance needs no label.
      //
      // The anchor is read at ARM TIME, not at the tap that completes it, so
      // speaking or backspacing in between cannot silently move it: a stale
      // anchor is dropped rather than honoured (see `anchorFrom`).
      anchoring: false, anchorFrom: null,

      // The caret, with a selection counting as its far end. Extending from
      // the far end is what shift-click does everywhere, which makes the one
      // rule cover the collapsed case, the selected case and the empty case
      // without a branch for any of them.
      caretOffset() {
        const r = this.d && this.d.range;
        return r ? r.end : (this.d ? this.d.text.length : 0);
      },
      toggleAnchor() {
        if (this.anchoring) { this.anchoring = false; this.anchorFrom = null; this.paint(); return; }
        this.anchoring = true;
        this.anchorFrom = this.caretOffset();
        this.paint();
      },
      // The completing tap. Returns whether it consumed the tap, so the
      // gesture handler can fall through to its ordinary reading when the
      // anchor was never armed.
      anchorTo(i) {
        if (!this.anchoring) return false;
        const a = this.anchorFrom;
        this.anchoring = false; this.anchorFrom = null;
        // An anchor past the end of a buffer that shrank under it is not a
        // position any more, so the tap becomes an ordinary caret placement
        // rather than a selection to somewhere that is gone.
        if (a == null || a > this.d.text.length) { this.d.caretAt(i); this.armed = null; this.paint(); return true; }
        if (a === i) { this.d.caretAt(i); this.armed = null; this.paint(); return true; }
        this.d.select(a, i);
        // Arm the edge that just moved, so the pad can refine it without a
        // second decision: select roughly with two taps, then walk the edge.
        this.armed = i > a ? 'end' : 'start';
        this.paint();
        return true;
      },

      // What the pad is aiming, in client coordinates: the armed pin if one is
      // armed, the caret otherwise. One gesture, two subjects, and which is a
      // state the reader set by tapping a pinhead. That is what let the arrows
      // go: an armed edge is dragged exactly the way the caret is.
      padPoint() {
        const host = this._host;
        if (!host) return null;
        if (this.armed && this.$refs.layer) {
          const h = this.$refs.layer.querySelector('[data-edge="' + this.armed + '"]');
          const hr = h?.getBoundingClientRect?.();
          if (hr && (hr.width || hr.height)) return { x: hr.left + hr.width / 2, y: hr.top + hr.height / 2 };
        }
        const c = host.querySelector('[data-d="caret"]');
        const r = c?.getBoundingClientRect?.();
        if (r && (r.width || r.height)) return { x: r.left, y: r.top + r.height / 2 };
        const b = host.getBoundingClientRect();
        return b ? { x: b.right, y: b.bottom - 8 } : null;
      },

      bindPad(btn) {
        const SLOW = 0.45, FAST = 2.4, V0 = 0.12, V1 = 1.5, EDGE = 6;
        let from = null;
        const noSelect = (e) => e.preventDefault();
        const box = () => this.$refs.view.getBoundingClientRect();
        const move = (e) => {
          if (!from || !this.d) return;
          e.preventDefault();
          const b = box();
          // The virtual point ACCUMULATES, one move at a time, each step scaled
          // by how fast that move was. An absolute mapping cannot accelerate:
          // the gain would be a property of the whole drag rather than of the
          // moment, and "flick then creep" is two moments.
          const t = (typeof e.timeStamp === 'number' && e.timeStamp) || 0;
          const dx = e.clientX - from.lx, dy = e.clientY - from.ly;
          from.travel += Math.abs(dx) + Math.abs(dy);
          const dt = Math.max(8, t - from.lt);
          const k = Math.min(1, Math.max(0, (Math.hypot(dx, dy) / dt - V0) / (V1 - V0)));
          const gain = SLOW + (FAST - SLOW) * k;
          from.lx = e.clientX; from.ly = e.clientY; from.lt = t;
          // Clamped as it accumulates, not only where it is read: an unclamped
          // accumulator drifts outside the box on a flick, and the drag back
          // spends its first inch returning from somewhere invisible.
          from.x = Math.min(b.right - EDGE, Math.max(b.left + EDGE, from.x + dx * gain));
          from.y = Math.min(b.bottom - EDGE, Math.max(b.top + EDGE, from.y + dy * gain));
          // Vertical lands on LINES rather than between them, so a slow drag
          // steps one line at a time and a flick crosses several.
          const vy = from.y0 + Math.round((from.y - from.y0) / from.line) * from.line;
          // Held against an edge, SCROLL rather than stop: the buffer runs
          // longer than the screen, and a pad that could only reach what
          // happens to be visible would be worst on exactly the long notes.
          const v = this.$refs.view;
          if (from.y >= b.bottom - EDGE && v.scrollTop + v.clientHeight < v.scrollHeight) v.scrollTop += EDGE;
          else if (from.y <= b.top + EDGE && v.scrollTop > 0) v.scrollTop -= EDGE;
          const cy = Math.min(b.bottom - EDGE, Math.max(b.top + EDGE, vy));
          const doc = this._host.ownerDocument;
          const r = doc.caretRangeFromPoint ? doc.caretRangeFromPoint(from.x, cy) : null;
          const pt = !r && doc.caretPositionFromPoint ? doc.caretPositionFromPoint(from.x, cy) : null;
          const node = r ? r.startContainer : pt ? pt.offsetNode : null;
          if (!node) return;
          const i = window.Dictate.offsetAt(this._host, node, r ? r.startOffset : pt.offset);
          if (i == null) return;
          if (this.armed) this.d.moveEdge(this.armed, i); else this.d.caretAt(i);
          this.paint();
        };
        const up = (e) => {
          if (!from) return;
          // A TAP IS A DRAG THAT WENT NOWHERE, and it means the other half of
          // this button. Measured against the raw thumb travel rather than the
          // accumulated virtual point, since the gain would call a 6px twitch
          // a 14px move at a flick.
          const tapped = from.travel < 8;
          from = null;
          this.padDrag = false;
          if (tapped) this.toggleAnchor();
          const d = document;
          d.removeEventListener('pointermove', move, true);
          d.removeEventListener('pointerup', up, true);
          d.removeEventListener('pointercancel', up, true);
          d.removeEventListener('selectstart', noSelect, true);
          d.body.style.userSelect = ''; d.body.style.webkitUserSelect = ''; d.body.style.touchAction = '';
          try { if (e) btn.releasePointerCapture(e.pointerId); } catch {}
        };
        btn.addEventListener('pointerdown', (e) => {
          if (this.edit || !this.d) return;      // the keyboard brings its own caret
          const p = this.padPoint();
          if (!p) return;
          e.preventDefault();
          const cs = getComputedStyle(this.$refs.view);
          from = { x: p.x, y: p.y, y0: p.y, lx: e.clientX, ly: e.clientY, travel: 0,
                   lt: (typeof e.timeStamp === 'number' && e.timeStamp) || 0,
                   line: parseFloat(cs.lineHeight) || 26 };
          // The flag the text box reads to stand down. It has to: a capture can
          // be lost mid-gesture (a browser deciding the touch was a scroll) and
          // the box would then read the tail of a drag as a tap.
          this.padDrag = true;
          const d = document;
          d.body.style.userSelect = 'none';
          d.body.style.webkitUserSelect = 'none';
          // And the document holds still. A pad drag is not a scroll, but the
          // page under it will happily take one, and a page that scrolls at its
          // top edge inside a sheet-presented in-app browser is the gesture
          // that dismisses the sheet.
          d.body.style.touchAction = 'none';
          // Listeners on the DOCUMENT rather than the button: pointer capture
          // is best-effort and a lost one must not strand the drag.
          d.addEventListener('pointermove', move, true);
          d.addEventListener('pointerup', up, true);
          d.addEventListener('pointercancel', up, true);
          d.addEventListener('selectstart', noSelect, true);
          try { btn.setPointerCapture(e.pointerId); } catch {}
        });
      },

      paint() {
        this.beat++;
        if (!this._host) return;
        window.Dictate.paint(this._host, {
          text: this.text, interim: this.interim,
          range: this.d ? this.d.range : null, armed: this.armed,
          overlay: this.$refs.layer,
          // NO ARROW CLUSTER. The pad drags an armed pin the same way it drags
          // the caret, so a pair of arrows chasing the pin around is furniture
          // for a job already done. This page carried them because its first
          // cut came from the stage's card, which keeps them for the good
          // reason that it has no pad.
          arrows: false,
          // And no pins once a mouse or a keyboard is in play: drag and
          // shift-click do the extending. The selection stays painted; only
          // the thing you would have tapped goes.
          handles: !this.precise,
          // Only once there is something to be at the end OF. On an empty
          // buffer the end caret is a red bar alone in the corner, behind the
          // start prompt, and it reads as a rendering fault.
          endCaret: !!this.text,
        });
      },

      // ── The pad ───────────────────────────────────────────────────────
      shift: false,
      key(k) {
        if (k === 'stitch') { this.d.stitch(); this.paint(); return; }
        const cased = { AB: 'upper', ab: 'lower', Ab: 'title' }[k];
        if (cased) { this.d.recase(cased); this.paint(); return; }
        this.d.punct(k);
        // A shifted mark drops the shift, the way a phone keyboard does: the
        // sticky case is the one asked for by tapping again.
        this.shift = false;
      },
      back() { this.d.backWord(); },
      undo() { this.d.undo(); this.armed = null; this.paint(); },
      redo() { this.d.redo(); this.armed = null; this.paint(); },

      // ── The keyboard half ─────────────────────────────────────────────
      // THE PENCIL IS RETIRED, as it is in the composer: a double tap is the
      // only way in, and it is both shorter and better aimed than a button,
      // since the reader has already pointed at the place they mean. Opening
      // with the caret at the end would make them point again through a
      // textarea their thumb is now half covering.
      //
      // The way out is the keyboard's own: blur, or Escape. There is no
      // control of its own to find.
      editOpen(at) {
        this.d.flush();                  // the phrase on screen is part of what is being edited
        this._resume = this.listening;
        this.d.stop();
        this.draft = this.d.text;
        this.edit = true;
        this.$nextTick(() => {
          const ta = this.$refs.ta;
          if (!ta) return;
          ta.focus();
          if (typeof at === 'number') ta.setSelectionRange(at, at);
        });
      },
      editClose() {
        // Read the caret BEFORE the assignment, because setting the buffer
        // drops the range by design, and restore it after. That is the whole
        // of "the red caret is where you left the keyboard": without it,
        // leaving sent the caret to the end and the next spoken words landed
        // there rather than where the reader had been working.
        const ta = this.$refs.ta;
        const a = ta ? ta.selectionStart : null, b = ta ? ta.selectionEnd : null;
        this.d.text = this.draft;
        if (typeof a === 'number') { if (a === b) this.d.caretAt(a); else this.d.select(a, b); }
        this.edit = false;
        try { ta && ta.blur(); } catch {}
        this.paint();
        if (this._resume) this.begin();
        this._resume = false;
      },

      // ── Corrections ───────────────────────────────────────────────────
      // Read once at boot, held as one alternation so a segment costs one
      // pass rather than one per entry. Longest first, so "web tools app"
      // cannot be eaten by "web tools" before it is reached.
      async loadCorrections() {
        if (!this.token) return;
        try {
          const reg = new window.GH({ token: this.token, repo: REGISTRY, ref: 'main' });
          const raw = JSON.parse((await reg.get(AUTOCORRECT)).text);
          this.corrections = Array.isArray(raw.items) ? raw.items : [];
          this.compile();
        } catch {}
      },
      compile() {
        const rows = this.corrections.filter(f => f && f.from).sort((a, b) => b.from.length - a.from.length);
        if (!rows.length) { this.autoRe = null; return; }
        const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        this.autoRe = new RegExp('\\b(' + rows.map(f => esc(f.from)).join('|') + ')\\b', 'gi');
        this._autoMap = new Map(rows.map(f => [f.from.toLowerCase(), f.to]));
      },
      // Case is carried across: a correction fired at the head of a sentence
      // keeps its capital, since the recognizer's own capitalization is the
      // only signal available about where a sentence started.
      autocorrect(s) {
        if (!this.autoRe) return s;
        return s.replace(this.autoRe, (m) => {
          const to = this._autoMap.get(m.toLowerCase());
          if (to == null) return m;
          return /^[A-Z]/.test(m) && /^[a-z]/.test(to) ? to[0].toUpperCase() + to.slice(1) : to;
        });
      },
      openAuto() {
        const r = this.d.range;
        this.autoFrom = r ? this.d.text.slice(r.start, r.end).replace(/^[\s.,;:!?]+|[\s.,;:!?]+$/g, '') : '';
        this.autoTo = '';
        this.autoOpen = true;
        this.menu = false;
        this.$nextTick(() => this.$refs.autoTo && this.$refs.autoTo.focus());
      },
      // Add and remove share one read-modify-write, since they differ only in
      // what they do to the list in between. A list you can only add to makes
      // a mistyped entry permanent from the page's side, which is the state
      // the reader is most likely to want out of.
      async writeList(mutate, note) {
        if (!this.token) return;
        try {
          const reg = new window.GH({ token: this.token, repo: REGISTRY, ref: 'main' });
          let items = [];
          try { const raw = JSON.parse((await reg.get(AUTOCORRECT)).text); items = Array.isArray(raw.items) ? raw.items : []; }
          catch (e) { if (e?.status && e.status !== 404) throw e; }
          items = mutate(items);
          await reg.save(AUTOCORRECT, { items }, note);
          this.corrections = items; this.compile();
        } catch (e) {
          Alpine.store('toast')('warning', 'Not saved: ' + (e?.message || e), 'alert-error', 5000);
        }
      },
      async dropAuto(from) {
        await this.writeList(
          (items) => items.filter(c => (c.from || '').toLowerCase() !== from.toLowerCase()),
          `Autocorrect: drop "${from}"`);
      },
      async saveAuto() {
        const from = this.autoFrom.trim(), to = this.autoTo.trim();
        if (!from || !to || !this.token) return;
        // The buffer is corrected too, since the reader is looking at the word
        // that was wrong and a list that only helps NEXT time reads as a
        // control that did nothing.
        if (this.d.hasSelection) { this.d.insert(to); this.armed = null; this.paint(); }
        this.autoFrom = ''; this.autoTo = '';
        // The sheet STAYS OPEN. The list under the fields is the confirmation,
        // and closing on save would hide the one thing that says it worked.
        await this.writeList(
          (items) => [...items.filter(c => (c.from || '').toLowerCase() !== from.toLowerCase()),
                      { from, to, added: new Date().toISOString() }],
          `Autocorrect "${from}" → "${to}"`);
      },

      // ── Where the words go ────────────────────────────────────────────
      // Committing the hypothesis first, always: the reader has READ the grey
      // text and tapped save, so accepting it is what they asked for.
      // A METHOD, not a getter: it commits the running hypothesis, and a
      // getter with a side effect is a trap set for the first template that
      // reads it. Committing is right whichever way the words go out, since
      // the reader has READ the grey text and then tapped save.
      outgoing() {
        if (!this.d) return '';
        if (this.edit) return this.draft;
        this.d.flush();
        return this.breaks ? this.d.paragraphs() : this.d.text;
      },
      slug(t) {
        return (t.trim().split(/\s+/).slice(0, 7).join('-') || 'note')
          .toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'note';
      },
      openSheet() { if (this.empty && !this.draft.trim()) return; this.sheet = true; },
      // ?to= names the destination a link already has in mind, and the sheet
      // paints that one primary rather than opening on it: choosing is still
      // the reader's, and a URL that could file a note on arrival would be a
      // different and much less safe thing.
      lead(k) { return this.dest === k ? 'btn-primary' : ''; },

      // Copy and Share only READ the buffer, so they leave it standing and
      // leave the draft in place: nothing durable has happened yet and a
      // clipboard is not a place words live.
      async copy() {
        const t = this.outgoing();
        const n = this.words;
        try {
          await navigator.clipboard.writeText(t);
          this.sheet = false;
          Alpine.store('toast')('clipboard-text', 'Copied ' + n + ' words', 'alert-success', 2200);
        } catch (e) {
          // Rather than a silent no-op: a clipboard write can be refused, and
          // a reader who thinks they have the words and does not is worse off
          // than one who is told to use Share.
          Alpine.store('toast')('warning', 'The browser refused the clipboard: use Share', 'alert-error', 5000);
        }
      },
      async share() {
        const t = this.outgoing();
        this.sheet = false;
        try { await navigator.share({ text: t }); } catch {}
      },
      // Jot and Drop file it, so both clear: the note has a home now and the
      // page goes back to being blank, which is the state it is for.
      async jot() {
        await this.commit(async (reg) => {
          let items = [];
          try { const raw = JSON.parse((await reg.get(JOTS)).text); items = Array.isArray(raw.items) ? raw.items : []; }
          catch (e) { if (e?.status && e.status !== 404) throw e; }
          const text = this.outgoing();
          items = [...items, { id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                               text, created_at: new Date().toISOString() }];
          await reg.save(JOTS, { items }, `Jot "${text.slice(0, 40)}" via dictate`);
          return 'the jots pile';
        }, REGISTRY, 'main');
      },
      async drop() {
        await this.commit(async (gh2) => {
          const text = this.outgoing();
          const now = new Date();
          const stamp = now.toISOString().slice(0, 10);
          const hhmm = String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
          const path = `${DEST.dir}/${stamp}-${hhmm}-${this.slug(text)}.md`;
          await gh2.save(path, text.replace(/\s*$/, '') + '\n', `Dictated ${stamp} ${hhmm}`);
          return path;
        }, DEST.repo, DEST.ref);
      },
      async commit(work, repo, ref) {
        if (!this.token) {
          Alpine.store('toast')('warning', 'No token on this browser: Copy or Share instead', 'alert-error', 5000);
          return;
        }
        this.saving = repo;
        try {
          const inst = new window.GH({ token: this.token, repo, ref: ref || '' });
          const where = await work(inst);
          this.sheet = false;
          this.clear();
          Alpine.store('toast')('check', 'Filed in ' + where, 'alert-success', 3200);
        } catch (e) {
          Alpine.store('toast')('warning', 'Not saved: ' + (e?.message || e), 'alert-error', 6000);
        }
        this.saving = '';
      },
      // Back to blank, and still listening if it was. The buffer goes through
      // the kit's setter, so undo can bring it back for one step, which is
      // the whole safety net a clear needs here.
      clear() {
        this.d.text = '';
        this.draft = ''; this.interim = ''; this.armed = null;
        this.anchoring = false; this.anchorFrom = null;
        this.breaks = false; this.restored = 0;
        ls.del(DRAFT);
        this.elapsed = 0; this.since = Date.now();
        this.menu = false;
        this.paint();
      },
    }));
  });

  await gh.load('alpine-bundle.js');   // starts Alpine
</script>
</head>

<body data-no-fab class="bg-base-200 text-base-content overscroll-none">

<div x-data="dictate" x-cloak data-dictate-ui
     :data-dictate-pad="padDrag ? '' : null"
     class="h-dvh w-full flex flex-col mx-auto max-w-3xl bg-base-100 sm:border-x border-base-300">

  <!-- ── The status bar ──────────────────────────────────────────────────
       Three facts and a menu, because a capture surface has to answer "is it
       hearing me" without being asked, and answer it from across the room. -->
  <!-- ── The header ──────────────────────────────────────────────────────
       A THREE-COLUMN GRID, so the target lands on the viewport's centre line
       rather than on the midpoint of whatever space the two side groups leave
       over. With flex spacers it drifts right, because the instruments on the
       right are twice the width of the clock on the left.

       Left is the session (record, and how long it has run). Centre is the one
       control that AIMS. Right is the history and the menu. Backspace joins
       undo and redo rather than staying in the bottom row: it undoes a word
       the way undo undoes an act, and the three read as one group. -->
  <div class="shrink-0 grid grid-cols-[1fr_auto_1fr] items-center gap-1.5 px-2 min-h-11
              border-b border-base-300 pt-[env(safe-area-inset-top)]">

    <div class="flex items-center gap-1.5 justify-self-start">
      <!-- RECORD, and the state readout as well as the switch: red and pulsing
           while live, so the one question a capture surface has to answer
           without being asked is answered by the control that changes it. -->
      <button @click="mic()" :disabled="edit"
              class="btn btn-sm btn-square shrink-0"
              :class="listening ? 'btn-error' : 'btn-ghost'"
              :title="listening ? 'Recording. Tap to stop.' : 'Start listening'">
        <i class="ph text-lg" :class="(listening ? 'ph-microphone animate-pulse' : 'ph-microphone-slash')"></i>
      </button>
      <span class="font-mono text-xs opacity-40 tabular-nums" x-text="started ? clock : ''"></span>
    </div>

    <!-- THE TARGET, on the centre line. Two gestures on one button, because
         they are one job: drag it and the caret moves, tap it and the caret
         becomes one end of a selection whose other end is your next tap. Armed
         it wears the ring an armed pin wears, which is this page's one word
         for "live and pointed at the text". touch-action:none inline is what
         makes the drag work rather than scrolling the page under it. -->
    <button x-init="bindPad($el)" :disabled="edit" style="touch-action:none"
            class="btn btn-sm btn-square justify-self-center"
            :class="anchoring ? 'btn-error btn-outline' : (padDrag ? 'btn-info' : 'btn-ghost')"
            :title="anchoring ? 'Now tap where the selection should end (tap here again to cancel)'
                              : 'Drag to move the cursor. Tap to start a selection from it.'">
      <i class="ph ph-crosshair text-lg"></i>
    </button>

    <div class="flex items-center gap-1.5 justify-self-end">
      <span class="font-mono text-xs opacity-40 tabular-nums" x-text="words + 'w'"></span>
      <button @click="undo()" :disabled="!canUndo" class="btn btn-ghost btn-sm btn-square" title="Undo">
        <i class="ph ph-arrow-counter-clockwise text-base"></i>
      </button>
      <button @click="redo()" :disabled="!canRedo" class="btn btn-ghost btn-sm btn-square" title="Redo">
        <i class="ph ph-arrow-clockwise text-base"></i>
      </button>
      <button @pointerdown.prevent="back()" :disabled="edit"
              class="btn btn-ghost btn-sm btn-square text-error"
              title="Delete the last word (dictation keeps running)">
        <i class="ph ph-backspace text-base"></i>
      </button>
      <!-- The menu is a DROPDOWN, not a band. As a band it inserted itself
           between the header and the text and pushed the words down the screen
           to show controls that are not about the words at all. -->
      <div class="relative" @click.outside="menu = false">
        <button @click="menu = !menu" class="btn btn-ghost btn-sm btn-square" title="More">
          <i class="ph ph-dots-three-vertical text-lg"></i>
        </button>
        <div x-show="menu" x-cloak
             class="absolute right-0 top-full mt-1 z-50 w-56 rounded-box border border-base-300 bg-base-100 shadow-xl py-1 flex flex-col">
          <button @click="clear(); menu = false"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200">
            <i class="ph ph-file-dashed text-lg opacity-60"></i>New
          </button>
          <button @click="breaks = !breaks" :disabled="!breakable"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200 disabled:opacity-40"
                  :title="breakable ? 'Break into paragraphs where you paused longest' : 'Needs the pause record, which typing replaces'">
            <i class="ph ph-paragraph text-lg opacity-60"></i>Breaks
            <i x-show="breaks" class="ph ph-check ml-auto text-lg text-success"></i>
          </button>
          <button @click="openAuto()"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200">
            <i class="ph ph-book-open text-lg opacity-60"></i>Autocorrect
            <span class="ml-auto font-mono text-xs opacity-40" x-text="corrections.length"></span>
          </button>
          <div x-show="d && d.relaunches" class="px-3 pt-1.5 pb-0.5 font-mono text-[11px] opacity-30"
               x-text="(d ? d.relaunches : 0) + ' relaunches'"></div>
        </div>
      </div>
    </div>
  </div>

  <div x-show="err" class="shrink-0 px-4 py-1.5 text-sm bg-error/10 text-error" x-text="err"></div>
  <div x-show="restored" class="shrink-0 px-4 py-1.5 text-sm bg-warning/10 flex items-center gap-2">
    <i class="ph ph-clock-counter-clockwise"></i>
    <span>Picked up where you left off.</span>
    <button @click="clear()" class="link link-hover font-medium">Start fresh</button>
  </div>

  <!-- ── The text ────────────────────────────────────────────────────────
       The whole width and the whole remaining height. THE COMPOSER'S MARK
       COLUMN DID NOT COME ACROSS, and it is the one piece of that card's
       shape that could not: a column beside the text holds 56px of the width
       for the full height in order to carry four keys at the bottom of it,
       which on a 390px phone is 14% of the measure spent on whitespace. The
       composer can afford it because its text box is capped at 172px, so the
       column is the height of the keys; here the box is the height of a
       phone. Shot both ways before deciding.

       What DID come across is everything that is behavior rather than
       geometry: the key set and its four faces, the cursor pad, the retired
       arrows, the retired pencil, and the bottom row.

       The LAYER is the handles' home: outside the scroll box and unclipped,
       so a pin may hang above the first line rather than being cut in half. -->
  <div class="grow min-h-0 relative touch-manipulation flex" x-ref="layer"
       @pointerdown="layerTap($event)" data-no-swipe>

    <div class="relative grow min-w-0">
      <div x-show="!edit" x-ref="view" class="absolute inset-0 overflow-y-auto px-4 py-3" @scroll="paint()">
        <div class="whitespace-pre-wrap text-[21px] leading-[1.65] tracking-[-0.01em]"
             x-ref="body" @contextmenu.prevent></div>

        <!-- Nothing said yet. The whole empty surface IS the start button,
             which is the one tap WebKit's gesture requirement makes
             unavoidable and the largest target a page can offer for it. -->
        <button x-show="!text && !interim" @click="started ? mic() : begin()"
                class="absolute inset-0 w-full flex flex-col items-center justify-center gap-3 text-center px-8">
          <i class="ph text-6xl opacity-20" :class="listening ? 'ph-waveform' : 'ph-microphone'"></i>
          <span class="text-lg opacity-50" x-text="listening ? 'Go ahead.' : (started ? 'Paused. Tap to carry on.' : 'Tap anywhere to start talking.')"></span>
          <span x-show="!started" class="text-sm opacity-30">Your phone will ask for the microphone once.</span>
        </button>
      </div>

      <!-- The keyboard half, and it has no controls of its own: blur or
           Escape is the way out, which is the keyboard's own gesture and the
           one a reader already reaches for. -->
      <textarea x-show="edit" x-cloak x-ref="ta" x-model="draft"
                @blur="editClose()" @keydown.escape="editClose()"
                class="absolute inset-0 w-full h-full resize-none textarea rounded-none border-0 text-[21px] leading-[1.65] px-4 py-3 focus:outline-none"
                placeholder="Type instead"></textarea>
    </div>

  </div>

  <!-- ── The marks ───────────────────────────────────────────────────────
       The composer's three keys and its shift, laid across instead of down.
       Four keys at a phone's width is 90px each, which is a larger target
       than the column's 46 and costs the text nothing. Tapped over and over
       inside one note, so they are the tall row. -->
  <div x-show="!edit" class="shrink-0 flex items-stretch gap-1 px-1 pt-1">
    <template x-for="k in pad" :key="k.k">
      <button @pointerdown.prevent="key(k.k)" :title="k.t"
              class="btn h-14 min-h-0 grow basis-0 px-0 text-2xl font-semibold"
              :class="k.k === 'stitch' ? 'btn-warning' : 'btn-ghost bg-base-200'">
        <i x-show="k.k === 'stitch'" class="ph ph-arrows-in-line-horizontal"></i>
        <span x-show="k.k !== 'stitch'" x-text="k.k"></span>
      </button>
    </template>
    <!-- Sticky in fact, momentary in feel: a shifted mark drops the shift the
         way a phone keyboard does. It used to become a ✕ that dropped the
         selection, on the composer's reasoning that the pad and the selection
         are one state and a mode needs an exit. The exit was already there,
         since a tap anywhere outside the selection collapses it to a caret,
         so the key does one thing. -->
    <button @pointerdown.prevent="shift = !shift"
            class="btn h-14 min-h-0 grow basis-0 px-0 font-mono text-sm"
            :class="shift ? 'btn-warning' : 'btn-ghost bg-base-200'"
            title="The other three marks"
            x-text="shift ? 'abc' : '·!¶'"></button>
  </div>

  <!-- ── The bottom row ──────────────────────────────────────────────────
       One control. Everything else is in the header now, and what is left is
       the one that ends the note. -->
  <div class="shrink-0 flex items-stretch gap-1 px-1 pb-1 pt-1"
       style="padding-bottom:calc(env(safe-area-inset-bottom) + 0.25rem)">
    <button @click="openSheet()" :disabled="empty && !draft.trim()"
            class="btn btn-primary h-12 min-h-0 grow gap-1.5 px-0">
      <i class="ph ph-paper-plane-tilt text-lg"></i>Save
    </button>
  </div>

  <!-- ── The save sheet ──────────────────────────────────────────────────
       A bottom sheet rather than a centred dialog, because the choice is made
       with the same thumb that has been tapping the pad. -->
  <div x-show="sheet" x-cloak class="fixed inset-0 z-[90] flex items-end justify-center">
    <div class="absolute inset-0 bg-black/40" @click="sheet = false"></div>
    <div class="relative w-full max-w-3xl bg-base-100 rounded-t-2xl border-t border-base-300 p-4 flex flex-col gap-2"
         style="padding-bottom:calc(env(safe-area-inset-bottom) + 1.5rem)">
      <div class="flex items-baseline gap-2 pb-1">
        <span class="font-medium">Save</span>
        <span class="font-mono text-xs opacity-40" x-text="words + ' words'"></span>
        <div class="grow"></div>
        <button @click="sheet = false" class="btn btn-ghost btn-sm btn-square"><i class="ph ph-x text-lg"></i></button>
      </div>

      <button @click="copy()" class="btn btn-lg justify-start gap-3 h-16 min-h-0" :class="lead('copy')">
        <i class="ph ph-clipboard-text text-2xl"></i>
        <span class="flex flex-col items-start leading-tight">
          <span>Copy</span><span class="text-xs font-normal opacity-50">to paste into a chat</span>
        </span>
      </button>

      <button x-show="canShare" @click="share()" class="btn btn-lg justify-start gap-3 h-16 min-h-0" :class="lead('share')">
        <i class="ph ph-share-network text-2xl"></i>
        <span class="flex flex-col items-start leading-tight">
          <span>Share</span><span class="text-xs font-normal opacity-50">the system sheet: any app on the phone</span>
        </span>
      </button>

      <button @click="jot()" :disabled="!token || !!saving" class="btn btn-lg justify-start gap-3 h-16 min-h-0" :class="lead('jot')">
        <i class="ph ph-note-pencil text-2xl"></i>
        <span class="flex flex-col items-start leading-tight">
          <span>Jot</span><span class="text-xs font-normal opacity-50">the estate's pile, beside the others</span>
        </span>
      </button>

      <button @click="drop()" :disabled="!token || !!saving" class="btn btn-lg justify-start gap-3 h-16 min-h-0" :class="lead('drop')">
        <i class="ph ph-tray-arrow-down text-2xl"></i>
        <span class="flex flex-col items-start leading-tight">
          <span>Drop</span>
          <span class="text-xs font-normal opacity-70" x-text="destName + ', for the next drain'"></span>
        </span>
      </button>

      <p x-show="!token" class="text-sm opacity-50 px-1 pt-1">
        Jot and Drop write to a repository, so they need this browser's GitHub token.
        Copy and Share do not.
      </p>
    </div>
  </div>

  <!-- ── Autocorrect ─────────────────────────────────────────────────────
       The list AND the way to add to it, in one sheet, because they were one
       thing pretending to be two: a form in the page and the list itself
       behind a link out to GitHub, which is a place you cannot get back from
       with a note half spoken. Nothing explains itself: heard, meant, Add,
       and the rows underneath. -->
  <div x-show="autoOpen" x-cloak class="fixed inset-0 z-[90] flex items-end justify-center">
    <div class="absolute inset-0 bg-black/40" @click="autoOpen = false"></div>
    <div class="relative w-full max-w-3xl bg-base-100 rounded-t-2xl border-t border-base-300 p-4 flex flex-col gap-3"
         style="padding-bottom:calc(env(safe-area-inset-bottom) + 1.5rem)">
      <div class="flex items-center gap-2">
        <span class="font-medium">Autocorrect</span>
        <span class="font-mono text-xs opacity-40" x-text="corrections.length"></span>
        <div class="grow"></div>
        <button @click="autoOpen = false" class="btn btn-ghost btn-sm btn-square"><i class="ph ph-x text-lg"></i></button>
      </div>

      <input x-model="autoFrom" placeholder="heard" class="input input-bordered w-full text-lg">
      <input x-model="autoTo" x-ref="autoTo" placeholder="meant" class="input input-bordered w-full text-lg">
      <button @click="saveAuto()" :disabled="!autoFrom.trim() || !autoTo.trim() || !token"
              class="btn btn-primary w-full">Add</button>

      <!-- The rows, newest first, so a correction just added is the one you
           are looking at. Capped and scrolling: the list grows without bound
           and the sheet must not. -->
      <div x-show="corrections.length" class="max-h-56 overflow-y-auto -mx-1 px-1 divide-y divide-base-200">
        <template x-for="c in [...corrections].reverse()" :key="c.from">
          <div class="flex items-center gap-2 py-2">
            <span class="min-w-0 truncate opacity-60" x-text="c.from"></span>
            <i class="ph ph-arrow-right text-sm opacity-30 shrink-0"></i>
            <span class="min-w-0 truncate" x-text="c.to"></span>
            <div class="grow"></div>
            <button @click="dropAuto(c.from)" :disabled="!token"
                    class="btn btn-ghost btn-xs btn-square opacity-40 hover:opacity-100 hover:text-error">
              <i class="ph ph-x"></i>
            </button>
          </div>
        </template>
      </div>
      <p x-show="!token" class="text-sm opacity-50">This browser has no GitHub token, so the list is read-only.</p>
    </div>
  </div>

<div class="toast toast-top toast-center z-[95]" x-data x-show="$store.toasts && $store.toasts.length">
  <template x-for="t in ($store.toasts || [])" :key="t.id">
    <div class="alert text-base gap-2" :class="t.cls">
      <i class="ph" :class="'ph-'+t.icon"></i>
      <span x-text="t.msg"></span>
    </div>
  </template>
</div>

</body>
</html>
