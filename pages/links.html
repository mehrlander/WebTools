<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔖</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  links.html — the bookmarks and resources board, as a portal:

    rail      items flagged rail:true, projected into the masthead band in area
              order. A flag, never a second list. show-repo's shell reads the
              same flag out of the same file (a repo declares the board with
              `links` in its .web-tools.json) and renders it in its own chrome,
              so the rail reaches you from anywhere rather than only from here.
              An iframe cannot paint into its parent's chrome, but the board is
              a file and the shell can read a file, so nothing crosses the frame.
    area      a column, headed by its name over a heavy rule in its accent.
    group     consecutive runs of an item's `group` label, as small-caps
              headings inside the column. Array order drives both the order of
              the groups and their membership; an item with no group falls
              under the column's lead run.
    item      one line: glyph, title, doors. Nothing else; a note rides the
              row's title attribute, where it costs no ink.
    doors     further ways into the SAME destination (Claude, code, usage),
              inline after the title. One row, three places.
    dossier   an area's own markdown, opened full width below the columns,
              because prose set in a quarter of the page is unreadable. It is
              for what a link cannot carry: which door to use when, what a
              source omits, anything that has cost time twice.

  Item kinds are marked by weight and glyph, never by a container:
    link      an href
    action    an href that performs rather than shows; filled glyph
    repo      owner/repo, opened in show-repo; monospaced title
    snippet   javascript: or data:, which no page can follow, so it copies;
              dotted underline
  An item with no url at all is not a link: it renders in plain weight, for a
  reference that has no address.

  Data contract (all in mehrlander/home, read and written through the token):
    links/board.json     the store; area: { label, icon, accent, dossier },
                         item: { title, kind, icon, group, url, note, rail,
                         doors: [{ label, url }] }
    links/<area>.md      an area's dossier, fetched on first open

  Renderer lives here in web-tools; the content lives in home, which is private,
  so this renders only in a browser holding the viewer's ghToken (gh-auth raises
  the prompt on 401). Every edit is local until Commit; Commit writes board.json
  and any touched dossier, each a whole-file PUT. A 404 on either is not an
  error: the file does not exist on this ref yet, so it opens empty and writable.

  ── On styling ─────────────────────────────────────────────────────────────
  Utilities only. The one CSS rule below is [x-cloak], which is attribute state
  rather than styling and has no utility form; every other effect here is a
  Tailwind class, including the accent tints, which ride arbitrary values off
  one custom property (`--a`, set inline per column) so a new area needs a hex
  in board.json and nothing here.

  Not using divide-*: daisyUI ships its semantic colours as its own utilities
  and divide-* is not among them, so divide-base-200 compiles to nothing, and
  Tailwind v4 defaults border-color to currentColor. → docs/SNAGS.md

  ?use=<branch|tag|sha> pins this page's own lib chain to a ref. &data=<ref>
  pins which ref of home the content is read from (defaults to main).
-->
<style>[x-cloak]{display:none!important}</style>

<script type="module">
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('gh-auth.js');
  await gh.load('gh-store.js');

  document.addEventListener('alpine:init', () => {
    Alpine.data('links', () => ({
      REPO: 'mehrlander/home',
      PATH: 'links/board.json',
      DATA_REF: new URLSearchParams(location.search).get('data') || 'main',
      SHOW_REPO: 'https://mehrlander.github.io/web-tools/app/',

      home: null,
      board: { areas: [] },
      baseline: '',
      dossiers: {},
      open: null,                 // area id whose dossier is showing

      loading: true,
      error: '',
      committing: false,
      commitError: '',
      // ?edit=1 opens straight into edit mode, so a caller can hand over the
      // board's editor rather than its reading view. show-repo's sidebar uses
      // it: the Links block's pencil is one tap to here from anywhere in the
      // shell. Through a toss the parameter arrives via the params shim, which
      // answers URLSearchParams.get for the addressed query.
      editing: new URLSearchParams(location.search).has('edit'),
      // Promoted into show-repo as an app view, this page renders inside the
      // shell's iframe, which already supplies a header and a sidebar label.
      // Two mastheads is one too many, so the title stands down when framed.
      framed: window.self !== window.top,

      KIND: {
        link:    { icon: 'ph-arrow-up-right',  label: 'link' },
        action:  { icon: 'ph-lightning',       label: 'action' },
        repo:    { icon: 'ph-folder-simple',   label: 'repo' },
        snippet: { icon: 'ph-brackets-curly',  label: 'snippet' },
      },

      async init() {
        try {
          const home = this.home = new window.GH({ token: window.TOKEN || '', repo: this.REPO, ref: this.DATA_REF });
          const res = await home.get(this.PATH);
          (home._shas ||= {})[this.PATH] = res.sha;
          const b = JSON.parse(res.text);
          b.areas = (b.areas || []).map(a => ({ ...a, items: a.items || [] }));
          this.board = b;
        } catch (e) {
          if (e.status === 404) this.editing = true;
          else this.error = `${e.message || e} — ${this.REPO}@${this.DATA_REF} ${this.PATH}`;
        } finally {
          this.baseline = this.snapshot();
          this.loading = false;
        }
      },

      // ── reads ────────────────────────────────────────────────────────────
      snapshot() { return JSON.stringify(this.board) },
      get dirty() {
        return this.snapshot() !== this.baseline
          || Object.values(this.dossiers).some(d => d.text !== d.baseline);
      },
      // Counts are of destinations, not rows: a door is a place you can go, so
      // folding three Claude entries into one must not read as losing two.
      count(a) { return a.items.reduce((n, i) => n + 1 + (i.doors?.length || 0), 0) },
      get total() { return this.board.areas.reduce((n, a) => n + this.count(a), 0) },
      get rail() {
        return this.board.areas.flatMap(a =>
          a.items.filter(i => i.rail).map(i => ({ ...i, accent: a.accent, glyph: this.icon(i, a) })));
      },
      get openArea() { return this.board.areas.find(a => a.id === this.open) },

      groups(a) {
        const out = []; let cur = null;
        for (const it of a.items) {
          const label = it.group || '';
          if (!cur || cur.label !== label) { cur = { label, items: [] }; out.push(cur) }
          cur.items.push(it);
        }
        return out;
      },
      // An item's own icon wins. Failing that, a plain link borrows its area's
      // glyph, so the default says where a thing lives and only the exceptions
      // (action, repo, snippet) spend a glyph saying what they are.
      // The KIND lookup is guarded because the store is a hand-editable JSON
      // file: an item with a missing or misspelled `kind` used to throw inside
      // the x-for, which blanks the WHOLE BOARD rather than the one row. A bad
      // row should cost its own glyph and nothing else.
      icon(it, a) {
        return it.icon
          || (it.kind === 'link' ? (a?.icon || this.KIND.link.icon) : this.KIND[it.kind]?.icon)
          || this.KIND.link.icon;
      },
      accent(a) { return a?.accent || 'currentColor' },
      href(it) {
        if (!it.url) return null;                       // a reference with no address
        if (it.kind === 'snippet') return null;
        if (it.kind === 'repo') return `${this.SHOW_REPO}?repo=${encodeURIComponent(it.url)}`;
        return it.url;
      },
      linkable(it) { return !!this.href(it) || it.kind === 'snippet' },

      // ── board edits ──────────────────────────────────────────────────────
      uid(p) { return p + Math.random().toString(36).slice(2, 7) },
      add(a) {
        // A new entry inherits the last one's group: adding to a group is the
        // common case and retyping the label every time is friction.
        const last = a.items[a.items.length - 1];
        a.items.push({ id: this.uid('i'), title: '', kind: 'link', url: '', note: '',
                       group: last?.group || '', rail: false });
      },
      remove(a, it) { a.items = a.items.filter(x => x !== it) },
      move(a, it, d) {
        const i = a.items.indexOf(it), j = i + d;
        if (j < 0 || j >= a.items.length) return;
        a.items.splice(j, 0, ...a.items.splice(i, 1));
      },
      addDoor(it) { (it.doors ||= []).push({ label: '', url: '' }) },
      removeDoor(it, d) { it.doors = it.doors.filter(x => x !== d); if (!it.doors.length) delete it.doors },
      addArea() {
        this.board.areas.push({ id: this.uid('a'), label: '', icon: 'ph-circle', accent: '#64748b', items: [] });
        this.editing = true;
      },
      removeArea(a) { this.board.areas = this.board.areas.filter(x => x !== a) },
      copy(it) { navigator.clipboard?.writeText(it.url) },

      // ── dossiers ─────────────────────────────────────────────────────────
      async toggleDossier(a) {
        if (this.open === a.id) { this.open = null; return; }
        this.open = a.id;
        if (this.dossiers[a.dossier]) return;
        this.dossiers[a.dossier] = { text: '', baseline: '', loading: true, error: '' };
        try {
          const res = await this.home.get(a.dossier);
          (this.home._shas ||= {})[a.dossier] = res.sha;
          this.dossiers[a.dossier] = { text: res.text, baseline: res.text, loading: false, error: '' };
        } catch (e) {
          const err = e.status === 404 ? '' : `${e.message || e} — ${this.REPO}@${this.DATA_REF} ${a.dossier}`;
          this.dossiers[a.dossier] = { text: '', baseline: '', loading: false, error: err };
        }
      },

      // ── write ────────────────────────────────────────────────────────────
      discard() { location.reload() },
      async commit() {
        if (!this.dirty || this.committing) return;
        this.committing = true; this.commitError = '';
        try {
          if (this.snapshot() !== this.baseline) {
            await this.home.save(this.PATH, this.board, `links: update board (${this.total} destinations)`);
            this.baseline = this.snapshot();
          }
          for (const [path, d] of Object.entries(this.dossiers)) {
            if (d.text === d.baseline) continue;
            await this.home.save(path, d.text, `links: update ${path.split('/').pop()}`);
            d.baseline = d.text;
          }
          this.editing = false;
        } catch (e) {
          this.commitError = e.message || String(e);
        } finally {
          this.committing = false;
        }
      },

      // ── markdown-lite, enough for a dossier ──────────────────────────────
      // Classes are baked into the output rather than applied by a descendant
      // rule, since x-html injects this markup and a utility cannot reach it.
      render(md) {
        if (!md) return '';
        const inline = s => s
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener" class="text-primary underline underline-offset-2 decoration-1">$1</a>')
          .replace(/`([^`]+)`/g, '<code class="font-mono text-[.85em] opacity-70">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        return md.split('\n').map(l => {
          if (/^#\s/.test(l))     return '';
          if (/^##\s/.test(l))    return `<h3 class="text-[10.5px] font-semibold uppercase tracking-[.085em] mt-5 first:mt-0 mb-1 text-[var(--a)]">${inline(l.slice(3))}</h3>`;
          if (/^#{3,}\s/.test(l)) return `<h4 class="font-medium opacity-70 mt-3">${inline(l.replace(/^#+\s/, ''))}</h4>`;
          if (/^[-*]\s/.test(l))  return `<div class="pl-4 -indent-4">${inline(l.slice(2))}</div>`;
          return l.trim() ? `<p class="my-1.5">${inline(l)}</p>` : '';
        }).join('');
      },
    }));
  });

  await gh.load('alpine-bundle.js');   // starts Alpine
</script>
</head>

<body class="bg-base-100 min-h-screen text-base-content">

<div x-data="links" x-cloak class="max-w-[78rem] mx-auto px-5 sm:px-7"
     :class="framed ? 'py-4' : 'py-7 sm:py-9'"
     style="--a: var(--color-base-content)">

  <!-- ── masthead ─────────────────────────────────────────────────────── -->
  <div class="flex items-baseline gap-3">
    <h1 x-show="!framed" class="font-serif text-[26px] sm:text-3xl tracking-tight">Links</h1>
    <span class="font-mono text-[11px] opacity-25" x-text="total"></span>
    <div class="grow"></div>
    <button class="text-[13px] opacity-35 hover:opacity-100 transition-opacity"
            :class="editing && 'opacity-100 font-medium'"
            @click="editing = !editing" x-text="editing ? 'done' : 'edit'"></button>
  </div>
  <div x-show="!framed" class="h-px mt-2 bg-[color-mix(in_oklch,var(--a)_22%,transparent)]"></div>

  <div x-show="loading" class="py-24 text-center"><span class="loading loading-dots loading-md opacity-20"></span></div>
  <div x-show="error" class="font-mono text-sm text-error py-4" x-text="error"></div>

  <template x-if="!loading && !error">
    <div>

      <!-- ── rail: the masthead band ──────────────────────────────────── -->
      <div class="flex flex-wrap gap-x-7 gap-y-2 py-3">
        <template x-for="it in rail" :key="it.id">
          <div class="flex items-center gap-2" :style="`--a:${it.accent || 'currentColor'}`">
            <a :href="href(it)" target="_blank" rel="noopener" class="group flex items-center gap-1.5">
              <i class="ph text-[15px] text-[var(--a)] opacity-60 group-hover:opacity-100 transition-opacity" :class="it.glyph"></i>
              <span class="text-[14px] font-medium tracking-tight group-hover:underline underline-offset-2" x-text="it.title"></span>
            </a>
            <template x-for="(d, di) in (it.doors || [])" :key="d.url">
              <span class="flex items-baseline text-[12.5px]">
                <span x-show="di > 0" class="opacity-25 mr-1.5">·</span>
                <a :href="d.url" target="_blank" rel="noopener"
                   class="text-[var(--a)] opacity-55 hover:opacity-100 hover:underline underline-offset-2 transition-opacity"
                   x-text="d.label"></a>
              </span>
            </template>
          </div>
        </template>
      </div>
      <div class="h-px mb-8 bg-[color-mix(in_oklch,var(--a)_14%,transparent)]"></div>

      <!-- ── the columns ──────────────────────────────────────────────── -->
      <!-- A grid with items-start, not CSS column-count: balancing minimises
           height and collapses unbreakable areas into fewer columns. -->
      <div class="grid items-start gap-x-8 gap-y-9 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <template x-for="a in board.areas" :key="a.id">
          <section :style="`--a:${accent(a)}`">

            <div class="flex items-baseline gap-2">
              <i class="ph text-sm text-[var(--a)] translate-y-px shrink-0" :class="a.icon"></i>
              <template x-if="!editing">
                <h2 class="font-semibold text-[15px] tracking-tight" x-text="a.label"></h2>
              </template>
              <template x-if="editing">
                <div class="flex flex-wrap gap-1.5">
                  <input class="input input-xs input-bordered w-28" x-model="a.label" placeholder="area">
                  <input class="input input-xs input-bordered w-24 font-mono text-[11px]" x-model="a.icon" placeholder="ph-circle">
                  <input class="input input-xs input-bordered w-20 font-mono text-[11px]" x-model="a.accent" placeholder="#64748b">
                  <input class="input input-xs input-bordered w-36 font-mono text-[11px]" x-model="a.dossier" placeholder="links/….md">
                </div>
              </template>
              <div class="grow"></div>
              <button x-show="a.dossier"
                      class="text-[10.5px] font-semibold uppercase tracking-[.085em] text-[var(--a)] opacity-55 hover:opacity-100 transition-opacity"
                      @click="toggleDossier(a)" x-text="open===a.id ? 'hide' : 'notes'"></button>
              <span class="font-mono text-[10px] opacity-25" x-text="count(a)"></span>
              <button x-show="editing" class="text-[11px] text-error opacity-60 hover:opacity-100"
                      @click="removeArea(a)">remove</button>
            </div>
            <div class="h-0.5 mt-1.5 mb-3 bg-[color-mix(in_oklch,var(--a)_80%,transparent)]"></div>

            <!-- reading: groups of entries -->
            <div x-show="!editing">
              <template x-for="(g, gi) in groups(a)" :key="gi">
                <div class="mb-3.5 last:mb-0">
                  <div x-show="g.label"
                       class="text-[10.5px] font-semibold uppercase tracking-[.085em] mb-1 text-[color-mix(in_oklch,var(--a)_78%,transparent)]"
                       x-text="g.label"></div>

                  <template x-for="it in g.items" :key="it.id">
                    <!-- Inline flow, not a flex row: a long qualifier wraps and
                         hangs under the title instead of truncating. -->
                    <div class="group relative pl-[18px] pr-4 py-[1px] text-[13.5px] leading-[1.45]"
                         :title="it.note || ''">

                      <a x-show="href(it)" :href="href(it)" target="_blank" rel="noopener"
                         class="absolute -inset-x-1.5 inset-y-0" :aria-label="it.title"></a>
                      <button x-show="!href(it) && it.kind === 'snippet'" @click="copy(it)"
                              class="absolute -inset-x-1.5 inset-y-0" :aria-label="it.title"></button>

                      <i class="absolute left-0 top-[4px] text-[11px] w-3.5 text-[var(--a)] opacity-45 group-hover:opacity-90 transition-opacity"
                         :class="[icon(it, a), it.kind === 'action' ? 'ph-fill' : 'ph']"></i>

                      <span :class="{ 'font-mono text-[12px]': it.kind === 'repo',
                                      'text-primary group-hover:underline underline-offset-2': linkable(it),
                                      'font-medium': !linkable(it),
                                      'underline decoration-dotted underline-offset-[3px]': it.kind === 'snippet' }"
                            x-text="it.title"></span>

                      <template x-for="d in (it.doors || [])" :key="d.url">
                        <span class="text-[12px]"><span class="opacity-25 mx-1">·</span><a
                          :href="d.url" target="_blank" rel="noopener"
                          class="relative text-[var(--a)] opacity-60 hover:opacity-100 hover:underline underline-offset-2 transition-opacity"
                          x-text="d.label"></a></span>
                      </template>

                      <!-- Anchored to the first line's right edge rather than
                           flowed, so a wrapped qualifier does not push it onto
                           a line of its own. -->
                      <i x-show="it.rail" class="ph-fill ph-push-pin absolute right-0 top-[5px] text-[9px] text-[var(--a)] opacity-40"></i>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- editing: a form, because a column is for reading -->
            <div x-show="editing" class="space-y-1">
              <template x-for="it in a.items" :key="it.id">
               <div>
                <div class="flex items-center gap-1.5">
                  <i class="ph text-sm shrink-0 text-[var(--a)] opacity-50" :class="icon(it, a)"></i>
                  <div class="flex flex-col sm:flex-row gap-1.5 grow min-w-0">
                    <select class="select select-xs select-bordered w-24" x-model="it.kind">
                      <template x-for="(v, k) in KIND" :key="k">
                        <option :value="k" x-text="v.label"></option>
                      </template>
                    </select>
                    <input class="input input-xs input-bordered sm:w-28" x-model="it.group" placeholder="group">
                    <input class="input input-xs input-bordered sm:w-32" x-model="it.title" placeholder="title">
                    <input class="input input-xs input-bordered sm:w-28 font-mono text-[11px]" x-model="it.icon" placeholder="icon">
                    <input class="input input-xs input-bordered grow font-mono text-[11px]" x-model="it.url" placeholder="url">
                    <input class="input input-xs input-bordered sm:w-40" x-model="it.note" placeholder="note">
                  </div>
                  <button class="px-1" :class="it.rail ? 'text-[var(--a)]' : 'opacity-25'" @click="it.rail = !it.rail">
                    <i class="ph-push-pin text-xs" :class="it.rail ? 'ph-fill' : 'ph'"></i>
                  </button>
                  <button class="px-0.5 opacity-35 hover:opacity-100" @click="move(a, it, -1)"><i class="ph ph-caret-up text-xs"></i></button>
                  <button class="px-0.5 opacity-35 hover:opacity-100" @click="move(a, it, 1)"><i class="ph ph-caret-down text-xs"></i></button>
                  <button class="px-1 opacity-30 hover:opacity-100" @click="addDoor(it)" title="Add a door">
                    <i class="ph ph-door-open text-xs"></i>
                  </button>
                  <button class="px-1 text-error opacity-60 hover:opacity-100" @click="remove(a, it)"><i class="ph ph-x text-xs"></i></button>
                </div>

                <div x-show="it.doors?.length" class="pl-8 mt-1 space-y-1">
                  <template x-for="(d, di) in (it.doors || [])" :key="di">
                    <div class="flex items-center gap-1.5">
                      <i class="ph ph-arrow-elbow-down-right text-xs shrink-0 opacity-25"></i>
                      <input class="input input-xs input-bordered w-24" x-model="d.label" placeholder="door">
                      <input class="input input-xs input-bordered grow font-mono text-[11px]" x-model="d.url" placeholder="url">
                      <button class="px-1 text-error opacity-60 hover:opacity-100" @click="removeDoor(it, d)"><i class="ph ph-x text-xs"></i></button>
                    </div>
                  </template>
                </div>
               </div>
              </template>
              <button class="text-[12px] opacity-40 hover:opacity-100 pl-6 pt-1" @click="add(a)">+ entry</button>
            </div>
          </section>
        </template>

        <div x-show="editing">
          <button class="text-[12px] opacity-40 hover:opacity-100" @click="addArea()">+ area</button>
        </div>
      </div>

      <!-- ── the dossier, full width: prose in a column is unreadable ──── -->
      <template x-if="open && openArea">
        <div class="mt-11" :style="`--a:${accent(openArea)}`">
          <div class="flex items-baseline gap-2">
            <i class="ph text-sm text-[var(--a)] translate-y-px" :class="openArea.icon"></i>
            <h2 class="font-semibold text-[15px] tracking-tight" x-text="openArea.label"></h2>
            <span class="text-[10.5px] font-semibold uppercase tracking-[.085em] opacity-30">notes</span>
            <div class="grow"></div>
            <button class="text-[13px] opacity-35 hover:opacity-100" @click="open = null">close</button>
          </div>
          <div class="h-0.5 mt-1.5 mb-4 bg-[color-mix(in_oklch,var(--a)_80%,transparent)]"></div>

          <template x-if="dossiers[openArea.dossier]?.loading">
            <div class="py-2"><span class="loading loading-dots loading-sm opacity-20"></span></div>
          </template>
          <template x-if="dossiers[openArea.dossier]?.error">
            <div class="font-mono text-xs text-warning" x-text="dossiers[openArea.dossier].error"></div>
          </template>
          <template x-if="dossiers[openArea.dossier] && !dossiers[openArea.dossier].loading && !dossiers[openArea.dossier].error">
            <div>
              <div x-show="!editing" class="font-serif text-[15px] leading-relaxed"
                   x-html="render(dossiers[openArea.dossier].text)"></div>
              <textarea x-show="editing" x-model="dossiers[openArea.dossier].text" rows="12"
                        class="textarea textarea-bordered w-full font-mono text-xs leading-relaxed"></textarea>
            </div>
          </template>
        </div>
      </template>

      <!-- ── the write path ───────────────────────────────────────────── -->
      <div x-show="dirty" x-transition class="sticky bottom-0 -mx-5 sm:-mx-7 px-5 sm:px-7 py-3 mt-8 bg-base-100/90 backdrop-blur">
        <div class="h-px mb-3 bg-[color-mix(in_oklch,var(--a)_22%,transparent)]"></div>
        <div class="flex items-center gap-4">
          <code class="font-mono text-[11px] opacity-35 grow truncate" x-text="`${REPO} @ ${DATA_REF}`"></code>
          <span x-show="commitError" class="font-mono text-[11px] text-error truncate" x-text="commitError"></span>
          <button class="text-sm opacity-40 hover:opacity-100" @click="discard()" :disabled="committing">discard</button>
          <button class="text-sm font-medium" @click="commit()" :disabled="committing">
            <span x-show="!committing">commit</span>
            <span x-show="committing" class="loading loading-spinner loading-xs"></span>
          </button>
        </div>
      </div>

    </div>
  </template>
</div>

</body>
</html>
