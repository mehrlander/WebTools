<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔖</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  links.html — the bookmarks and resources board, in three levels:

    rail      entries flagged rail:true, projected across the masthead in area
              order. A flag, never a second list.
    board     ordered areas of ordered items, each area a section of the index.
    dossier   an area's own markdown file, set as prose in place and edited
              here. It opens by itself when you filter to that area alone.

  An item may carry `doors`: further entry points into the SAME destination,
  rendered inline after its title rather than as siblings. Claude, Claude Code,
  and Claude usage are one product with three doors, and listing them as three
  peers repeats the brand three times and the host three times while saying
  nothing about their relation. The primary `url` is the item's own door; the
  rest follow it, smaller, in the accent.

  Item kinds decide what a row does, and are marked by weight and glyph rather
  than by a container:
    link      an href
    action    an href that performs rather than shows; filled glyph
    repo      owner/repo, opened in show-repo; monospaced title
    snippet   javascript: or data:, which no page can follow, so it copies;
              dotted underline, no link cursor

  Data contract (all in mehrlander/home, read and written through the token):
    links/board.json     the store; an area may carry accent (any CSS colour),
                         an item may carry doors: [{ label, url }]
    links/<area>.md      an area's dossier, fetched on first open

  Renderer lives here in web-tools; the content lives in home, which is private,
  so this renders only in a browser holding the viewer's ghToken (gh-auth raises
  the prompt on 401). Every edit is local until Commit; Commit writes board.json
  and any touched dossier, each a whole-file PUT. A 404 on either is not an
  error: the file does not exist on this ref yet, so it opens empty and writable.

  ── The visual argument ────────────────────────────────────────────────────
  An index, not a deck. Nothing here is a card: no borders, no fills, no
  rounded containers, no shadows. Structure comes from three type voices
  (serif for headings and prose, sans for entries, mono for addresses), from
  whitespace, and from one hairline per section, which is the only rule that
  earns its keep. Colour is spent on the accent glyph and nowhere else, so a
  scan reads as areas rather than as boxes. An entry is one line: glyph, title,
  note trailing in grey and truncating. Wide screens flow those lines into
  newspaper columns, which is what an index wants and what a grid of tiles is
  a poor imitation of.

  The accent system is one custom property. A section sets --a and everything
  tinted below is a color-mix off it, so a new area needs a hex in board.json
  and nothing here.

  Not using divide-* : daisyUI ships its semantic colours as its own utilities
  and divide-* is not among them, so divide-base-200 compiles to nothing, and
  Tailwind v4 defaults border-color to currentColor (v3 defaulted to gray-200).
  The pair paints black hairlines. → docs/SNAGS.md

  ?use=<branch|tag|sha> pins this page's own lib chain to a ref. &data=<ref>
  pins which ref of home the content is read from (defaults to main).
-->
<style>
  [x-cloak] { display: none !important }

  :root {
    --serif: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .serif { font-family: var(--serif); }
  .mono  { font-family: var(--mono); }

  .sec   { --a: var(--color-base-content); }
  .rule  { height: 1px; background: color-mix(in oklch, var(--a) 28%, transparent); }
  .accent{ color: var(--a); }

  /* A row is a line of type. The only thing that moves on hover is the title. */
  .row .t { transition: color .12s; }
  .row:hover .t { color: var(--a); }
  .row:hover .g { opacity: 1; }
  .g { opacity: .72; transition: opacity .12s; }

  .snip .t { text-decoration: underline dotted; text-underline-offset: 3px; }

  /* Doors sit above the row's stretched overlay by paint order (they come
     later in the DOM and are positioned), so each is separately tappable. */
  .doors a { position: relative; }
  .doors a + a::before { content: '·'; margin-right: .45rem; opacity: .35 }

  /* Newspaper columns for the index; one column on a phone. */
  .index { column-gap: 2.5rem; }
  .index > * { break-inside: avoid; }

  .prose-d { font-family: var(--serif); }
  .prose-d h3 { font-family: var(--serif); color: var(--a); font-size: .8rem;
                letter-spacing: .09em; text-transform: uppercase; margin: 1.1rem 0 .3rem; }
  .prose-d h3:first-child { margin-top: 0 }
  .prose-d a { text-decoration: underline; text-underline-offset: 2px;
               text-decoration-thickness: 1px; text-decoration-color: color-mix(in oklch, var(--a) 45%, transparent); }
  .prose-d a:hover { color: var(--a) }
  .prose-d p { margin: .4rem 0 }

  .bare { background: transparent; border: 0; outline: 0; }
  .bare:focus { outline: 0 }
</style>

<script type="module">
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
    const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`);
    if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
    const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
  }
  await gh.load('gh-auth.js');
  await gh.load('gh-store.js');

  document.addEventListener('alpine:init', () => {
    Alpine.data('links', () => ({
      REPO: 'mehrlander/home',
      PATH: 'links/board.json',
      DATA_REF: new URLSearchParams(location.search).get('data') || 'main',
      SHOW_REPO: 'https://mehrlander.github.io/web-tools/pages/show-repo/show-repo.html',

      home: null,
      board: { areas: [] },
      baseline: '',
      dossiers: {},
      open: null,

      loading: true,
      error: '',
      committing: false,
      commitError: '',

      q: '',
      area: 'all',
      editing: false,

      KIND: {
        link:    { icon: 'ph-arrow-up-right',  label: 'link' },
        action:  { icon: 'ph-lightning',       label: 'action' },
        repo:    { icon: 'ph-folder-simple',   label: 'repo' },
        snippet: { icon: 'ph-brackets-curly',  label: 'snippet' },
      },

      async init() {
        try {
          const home = this.home = new window.GH({ token: window.TOKEN || '', repo: this.REPO, ref: this.DATA_REF });
          const res = await home.get(this.PATH);
          (home._shas ||= {})[this.PATH] = res.sha;
          const b = JSON.parse(res.text);
          b.areas = (b.areas || []).map(a => ({ ...a, items: a.items || [] }));
          this.board = b;
        } catch (e) {
          if (e.status === 404) this.editing = true;
          else this.error = `${e.message || e} — ${this.REPO}@${this.DATA_REF} ${this.PATH}`;
        } finally {
          this.baseline = this.snapshot();
          this.loading = false;
        }
      },

      // ── reads ────────────────────────────────────────────────────────────
      snapshot() { return JSON.stringify(this.board) },
      get dirty() {
        return this.snapshot() !== this.baseline
          || Object.values(this.dossiers).some(d => d.text !== d.baseline);
      },
      // Counts are of destinations, not rows: a door is a place you can go, so
      // folding three Claude entries into one item must not read as losing two.
      count(a) { return a.items.reduce((n, i) => n + 1 + (i.doors?.length || 0), 0) },
      get total() { return this.board.areas.reduce((n, a) => n + this.count(a), 0) },
      get rail() {
        return this.board.areas.flatMap(a =>
          a.items.filter(i => i.rail).map(i => ({ ...i, accent: a.accent, glyph: this.icon(i, a) })));
      },
      get visibleAreas() {
        return this.board.areas
          .filter(a => this.area === 'all' || a.id === this.area)
          .filter(a => !this.q || this.items(a).length || this.editing);
      },
      items(a) {
        const q = this.q.trim().toLowerCase();
        if (!q) return a.items;
        return a.items.filter(i => `${i.title} ${i.note || ''} ${i.url}`.toLowerCase().includes(q));
      },
      // An item's own icon wins. Failing that, a plain link borrows its area's
      // glyph, so the default says where a thing lives and only the exceptions
      // (action, repo, snippet) spend a glyph saying what they are.
      icon(it, a) { return it.icon || (it.kind === 'link' ? (a?.icon || this.KIND.link.icon) : this.KIND[it.kind].icon) },
      accent(a) { return a.accent || 'currentColor' },
      href(it) {
        if (it.kind === 'snippet') return null;
        if (it.kind === 'repo') return `${this.SHOW_REPO}?repo=${encodeURIComponent(it.url)}`;
        return it.url;
      },
      trail(it) {
        if (it.note) return it.note;
        // Doors already establish that this is one destination, so the bare
        // host beside them is redundant and only steals width from the labels.
        if (it.doors?.length) return '';
        if (it.kind === 'repo') return it.url;
        if (it.kind === 'snippet') return it.url.slice(0, it.url.indexOf(':') + 1);
        try { return new URL(it.url).hostname.replace(/^www\./, '') } catch { return '' }
      },

      // Filtering to one area is a statement that you came for that subject, so
      // its dossier opens with it; All is a launcher and stays uncluttered.
      pick(id) {
        this.area = id;
        const a = this.board.areas.find(x => x.id === id);
        if (id !== 'all' && a?.dossier) this.toggleDossier(a, true); else this.open = null;
      },

      // ── board edits ──────────────────────────────────────────────────────
      uid(p) { return p + Math.random().toString(36).slice(2, 7) },
      add(a) { a.items.push({ id: this.uid('i'), title: '', kind: 'link', url: '', note: '', rail: false }) },
      addDoor(it) { (it.doors ||= []).push({ label: '', url: '' }) },
      removeDoor(it, d) { it.doors = it.doors.filter(x => x !== d); if (!it.doors.length) delete it.doors },
      remove(a, it) { a.items = a.items.filter(x => x !== it) },
      move(a, it, d) {
        const i = a.items.indexOf(it), j = i + d;
        if (j < 0 || j >= a.items.length) return;
        a.items.splice(j, 0, ...a.items.splice(i, 1));
      },
      addArea() {
        this.board.areas.push({ id: this.uid('a'), label: '', icon: 'ph-circle', accent: '#64748b', items: [] });
        this.editing = true;
      },
      removeArea(a) { this.board.areas = this.board.areas.filter(x => x !== a) },
      copy(it) { navigator.clipboard?.writeText(it.url) },

      // ── dossiers ─────────────────────────────────────────────────────────
      async toggleDossier(a, force) {
        if (this.open === a.id && !force) { this.open = null; return; }
        this.open = a.id;
        if (this.dossiers[a.dossier]) return;
        this.dossiers[a.dossier] = { text: '', baseline: '', loading: true, error: '' };
        try {
          const res = await this.home.get(a.dossier);
          (this.home._shas ||= {})[a.dossier] = res.sha;
          this.dossiers[a.dossier] = { text: res.text, baseline: res.text, loading: false, error: '' };
        } catch (e) {
          const err = e.status === 404 ? '' : `${e.message || e} — ${this.REPO}@${this.DATA_REF} ${a.dossier}`;
          this.dossiers[a.dossier] = { text: '', baseline: '', loading: false, error: err };
        }
      },

      // ── write ────────────────────────────────────────────────────────────
      discard() { location.reload() },
      async commit() {
        if (!this.dirty || this.committing) return;
        this.committing = true; this.commitError = '';
        try {
          if (this.snapshot() !== this.baseline) {
            await this.home.save(this.PATH, this.board, `links: update board (${this.total} entries)`);
            this.baseline = this.snapshot();
          }
          for (const [path, d] of Object.entries(this.dossiers)) {
            if (d.text === d.baseline) continue;
            await this.home.save(path, d.text, `links: update ${path.split('/').pop()}`);
            d.baseline = d.text;
          }
          this.editing = false;
        } catch (e) {
          this.commitError = e.message || String(e);
        } finally {
          this.committing = false;
        }
      },

      // ── markdown-lite, enough for a dossier ──────────────────────────────
      render(md) {
        if (!md) return '';
        const inline = s => s
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/`([^`]+)`/g, '<code class="mono text-[.85em] opacity-70">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        return md.split('\n').map(l => {
          if (/^#\s/.test(l))     return '';
          if (/^##\s/.test(l))    return `<h3>${inline(l.slice(3))}</h3>`;
          if (/^#{3,}\s/.test(l)) return `<h4 class="font-medium opacity-70 mt-2">${inline(l.replace(/^#+\s/, ''))}</h4>`;
          if (/^[-*]\s/.test(l))  return `<div class="pl-4 -indent-4">${inline(l.slice(2))}</div>`;
          return l.trim() ? `<p>${inline(l)}</p>` : '';
        }).join('');
      },
    }));
  });

  await gh.load('alpine-bundle.js');   // starts Alpine
</script>
</head>

<body class="bg-base-100 min-h-screen text-base-content">

<div x-data="links" x-cloak class="max-w-4xl mx-auto px-5 sm:px-8 py-8 sm:py-12">

  <!-- ── masthead ─────────────────────────────────────────────────────── -->
  <div class="flex items-baseline gap-3 mb-1">
    <h1 class="serif text-3xl sm:text-4xl tracking-tight">Links</h1>
    <span class="mono text-[11px] opacity-30" x-text="total"></span>
    <div class="grow"></div>
    <input type="text" class="bare text-sm text-right w-24 focus:w-40 transition-all placeholder:opacity-30"
           placeholder="filter" x-model="q">
    <button class="text-sm opacity-40 hover:opacity-100 transition-opacity"
            :class="editing && 'opacity-100 font-medium'"
            @click="editing = !editing" x-text="editing ? 'done' : 'edit'"></button>
  </div>
  <div class="rule mb-6" style="--a: var(--color-base-content)"></div>

  <div x-show="loading" class="py-24 text-center"><span class="loading loading-dots loading-md opacity-20"></span></div>
  <div x-show="error" class="text-sm text-error mono py-4" x-text="error"></div>

  <template x-if="!loading && !error">
    <div>

      <!-- ── rail: level 0, across the masthead ───────────────────────── -->
      <div class="flex flex-wrap gap-x-6 gap-y-2.5 mb-9">
        <template x-for="it in rail" :key="it.id">
          <div class="row sec flex items-center gap-2" :style="`--a:${it.accent || 'currentColor'}`">
            <a :href="href(it)" target="_blank" rel="noopener" class="flex items-center gap-2">
              <i class="ph g accent text-base" :class="it.glyph"></i>
              <span class="t text-[15px] font-medium tracking-tight" x-text="it.title"></span>
            </a>
            <span x-show="it.doors?.length" class="doors flex items-center gap-1.5 text-[13px]">
              <template x-for="d in (it.doors || [])" :key="d.url">
                <a :href="d.url" target="_blank" rel="noopener"
                   class="accent opacity-55 hover:opacity-100 transition-opacity" x-text="d.label"></a>
              </template>
            </span>
          </div>
        </template>
      </div>

      <!-- ── area switcher ────────────────────────────────────────────── -->
      <div class="flex flex-wrap items-baseline gap-x-5 gap-y-1.5 mb-9 text-[13px]">
        <button class="transition-opacity" :class="area==='all' ? 'font-medium' : 'opacity-40 hover:opacity-100'"
                @click="pick('all')">All</button>
        <template x-for="a in board.areas" :key="a.id">
          <button class="transition-opacity flex items-baseline gap-1.5"
                  :class="area===a.id ? 'font-medium' : 'opacity-40 hover:opacity-100'"
                  :style="area===a.id ? `color:${accent(a)}` : ''" @click="pick(a.id)">
            <span x-text="a.label"></span>
            <span class="mono text-[10px] opacity-50" x-text="count(a)"></span>
          </button>
        </template>
        <button x-show="editing" class="opacity-40 hover:opacity-100" @click="addArea()">+ area</button>
      </div>

      <!-- ── sections ─────────────────────────────────────────────────── -->
      <template x-for="a in visibleAreas" :key="a.id">
        <section class="sec mb-11" :style="`--a:${accent(a)}`">

          <div class="flex items-baseline gap-3 mb-1">
            <i class="ph accent text-sm translate-y-px" :class="a.icon"></i>
            <template x-if="!editing">
              <h2 class="serif text-lg tracking-tight" x-text="a.label"></h2>
            </template>
            <template x-if="editing">
              <div class="flex flex-wrap gap-1.5">
                <input class="input input-xs input-bordered w-32" x-model="a.label" placeholder="area">
                <input class="input input-xs input-bordered w-28 mono text-[11px]" x-model="a.icon" placeholder="ph-circle">
                <input class="input input-xs input-bordered w-24 mono text-[11px]" x-model="a.accent" placeholder="#64748b">
                <input class="input input-xs input-bordered w-40 mono text-[11px]" x-model="a.dossier" placeholder="links/….md">
              </div>
            </template>
            <div class="rule grow"></div>
            <button x-show="a.dossier" class="text-[11px] tracking-wide uppercase accent opacity-60 hover:opacity-100"
                    @click="toggleDossier(a)" x-text="open===a.id ? 'hide' : 'notes'"></button>
            <span class="mono text-[10px] opacity-25" x-text="count(a)"></span>
            <button x-show="editing" class="text-[11px] text-error opacity-60 hover:opacity-100"
                    @click="removeArea(a)">remove</button>
          </div>

          <!-- level 2: the dossier, set as prose -->
          <div x-show="open===a.id" x-transition class="mb-5 mt-4">
            <template x-if="dossiers[a.dossier]?.loading">
              <div class="py-3"><span class="loading loading-dots loading-sm opacity-20"></span></div>
            </template>
            <template x-if="dossiers[a.dossier]?.error">
              <div class="text-xs text-warning mono" x-text="dossiers[a.dossier].error"></div>
            </template>
            <template x-if="dossiers[a.dossier] && !dossiers[a.dossier].loading && !dossiers[a.dossier].error">
              <div>
                <div x-show="!editing" class="prose-d text-[15px] leading-relaxed max-w-prose"
                     x-html="render(dossiers[a.dossier].text)"></div>
                <textarea x-show="editing" x-model="dossiers[a.dossier].text" rows="14"
                          class="textarea textarea-bordered w-full mono text-xs leading-relaxed"></textarea>
              </div>
            </template>
          </div>

          <!-- level 1: the index -->
          <div x-show="!editing" class="index mt-3 sm:columns-2 lg:columns-3">
            <template x-for="it in items(a)" :key="it.id">
              <!-- The whole line is the target, not just the title: a launcher
                   read on a phone cannot ask for a tap on 14px of text. A
                   stretched overlay carries the click and the content sits
                   under it, so the row needs no container to be tappable. -->
              <div class="row relative flex items-baseline gap-2.5 py-[6px]"
                   :class="it.kind === 'snippet' && 'snip'">

                <a x-show="it.kind !== 'snippet'" :href="href(it)" target="_blank" rel="noopener"
                   class="absolute -inset-x-2 inset-y-0" :aria-label="it.title"></a>
                <button x-show="it.kind === 'snippet'" @click="copy(it)"
                        class="absolute -inset-x-2 inset-y-0" :aria-label="it.title"></button>

                <!-- Phosphor weights are font families (ph, ph-fill), not name
                     suffixes, so the weight is bound instead of stacked. -->
                <i class="g accent text-sm shrink-0 translate-y-0.5 pointer-events-none"
                   :class="[icon(it, a), it.kind === 'action' ? 'ph-fill' : 'ph']"></i>

                <span class="t text-[14px] leading-snug shrink-0 pointer-events-none"
                      :class="it.kind === 'repo' ? 'mono text-[12.5px]' : ''" x-text="it.title"></span>

                <span x-show="it.doors?.length" class="doors flex items-baseline gap-1.5 text-[12px] shrink-0">
                  <template x-for="d in (it.doors || [])" :key="d.url">
                    <a :href="d.url" target="_blank" rel="noopener"
                       class="accent opacity-55 hover:opacity-100 transition-opacity" x-text="d.label"></a>
                  </template>
                </span>

                <span class="text-[12px] leading-snug opacity-35 truncate grow pointer-events-none"
                      :class="!it.note && 'mono text-[11px]'" x-text="trail(it)"></span>

                <i x-show="it.rail" class="ph-fill ph-push-pin accent text-[10px] opacity-55 shrink-0 pointer-events-none"></i>
              </div>
            </template>
          </div>

          <!-- editing: rows, because an index is for reading and a form is for changing -->
          <div x-show="editing" class="mt-3 space-y-1">
            <template x-for="it in items(a)" :key="it.id">
             <div>
              <div class="flex items-center gap-1.5">
                <i class="ph text-sm shrink-0 accent opacity-50" :class="icon(it, a)"></i>
                <div class="flex flex-col sm:flex-row gap-1.5 grow min-w-0">
                  <select class="select select-xs select-bordered w-24" x-model="it.kind">
                    <template x-for="(v, k) in KIND" :key="k">
                      <option :value="k" x-text="v.label"></option>
                    </template>
                  </select>
                  <input class="input input-xs input-bordered sm:w-32" x-model="it.title" placeholder="title">
                  <input class="input input-xs input-bordered sm:w-28 mono text-[11px]" x-model="it.icon" placeholder="icon">
                  <input class="input input-xs input-bordered grow mono text-[11px]" x-model="it.url" placeholder="url">
                  <input class="input input-xs input-bordered sm:w-40" x-model="it.note" placeholder="note">
                </div>
                <button class="px-1" :class="it.rail ? 'accent' : 'opacity-25'" @click="it.rail = !it.rail">
                  <i class="ph-push-pin text-xs" :class="it.rail ? 'ph-fill' : 'ph'"></i>
                </button>
                <button class="px-0.5 opacity-35 hover:opacity-100" @click="move(a, it, -1)"><i class="ph ph-caret-up text-xs"></i></button>
                <button class="px-0.5 opacity-35 hover:opacity-100" @click="move(a, it, 1)"><i class="ph ph-caret-down text-xs"></i></button>
                <button class="px-1 opacity-30 hover:opacity-100" @click="addDoor(it)" title="Add a door">
                  <i class="ph ph-door-open text-xs"></i>
                </button>
                <button class="px-1 text-error opacity-60 hover:opacity-100" @click="remove(a, it)"><i class="ph ph-x text-xs"></i></button>
              </div>

              <div x-show="it.doors?.length" class="pl-8 mt-1 space-y-1">
                <template x-for="(d, di) in (it.doors || [])" :key="di">
                  <div class="flex items-center gap-1.5">
                    <i class="ph ph-arrow-elbow-down-right text-xs shrink-0 opacity-25"></i>
                    <input class="input input-xs input-bordered w-24" x-model="d.label" placeholder="door">
                    <input class="input input-xs input-bordered grow mono text-[11px]" x-model="d.url" placeholder="url">
                    <button class="px-1 text-error opacity-60 hover:opacity-100" @click="removeDoor(it, d)"><i class="ph ph-x text-xs"></i></button>
                  </div>
                </template>
              </div>
             </div>
            </template>

            <button class="text-[12px] opacity-40 hover:opacity-100 pl-6 pt-1" @click="add(a)">+ entry</button>
          </div>
        </section>
      </template>

      <!-- ── the write path ───────────────────────────────────────────── -->
      <div x-show="dirty" x-transition class="sticky bottom-0 -mx-5 sm:-mx-8 px-5 sm:px-8 py-3 bg-base-100/95 backdrop-blur">
        <div class="rule mb-3" style="--a: var(--color-base-content)"></div>
        <div class="flex items-center gap-4">
          <code class="mono text-[11px] opacity-35 grow truncate" x-text="`${REPO} @ ${DATA_REF}`"></code>
          <span x-show="commitError" class="mono text-[11px] text-error truncate" x-text="commitError"></span>
          <button class="text-sm opacity-40 hover:opacity-100" @click="discard()" :disabled="committing">discard</button>
          <button class="text-sm font-medium" @click="commit()" :disabled="committing">
            <span x-show="!committing">commit</span>
            <span x-show="committing" class="loading loading-spinner loading-xs"></span>
          </button>
        </div>
      </div>

    </div>
  </template>
</div>

</body>
</html>
