<div x-data="themes" class="min-h-dvh grid grid-rows-[auto_1fr_auto] grid-cols-[minmax(0,1fr)] @container">

  <header class="sticky top-0 z-30 bg-base-100/95 backdrop-blur border-b border-base-300">
    <div class="px-4 pt-3 pb-2 flex items-center gap-2 flex-wrap">
      <span class="text-lg font-semibold mr-1">Themes</span>
      <div class="flex items-center gap-0.5 rounded-lg bg-base-200/60 p-0.5 flex-wrap" role="tablist">
        <template x-for="l in LENSES" :key="l.k">
          <button role="tab" @click="lens = l.k"
                  class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-base font-medium transition-colors"
                  :class="lens === l.k ? 'bg-base-100 text-primary shadow-sm' : 'text-base-content/60 hover:text-base-content'">
            <i class="ph text-lg" :class="l.i"></i><span x-text="l.n"></span>
          </button>
        </template>
      </div>
      <div class="flex items-center gap-0.5 rounded-lg bg-base-200/60 p-0.5">
        <button @click="only = ''" class="px-2.5 py-1 rounded-md text-base transition-colors"
                :class="!only ? 'bg-base-100 shadow-sm' : 'text-base-content/60'">all</button>
        <button @click="only = 'none'" class="px-2.5 py-1 rounded-md text-base transition-colors"
                :class="only ? 'bg-base-100 text-primary shadow-sm' : 'text-base-content/60'">unregistered</button>
      </div>
    </div>
    <div class="px-4 pb-3 flex items-center gap-3 min-w-0">
      <span class="text-base text-base-content/50 shrink-0 tabular-nums">
        <span class="text-base-content font-semibold" x-text="th"></span>+
      </span>
      <input type="range" class="range range-xs range-primary w-full min-w-0" min="3" :max="maxW" step="1"
             x-model.number="th" aria-label="minimum shared 10-word windows"/>
      <span class="text-base text-base-content/50 shrink-0 tabular-nums">
        <span class="text-base-content font-semibold" x-text="clusters.length"></span>c ·
        <span class="text-base-content font-semibold" x-text="edges.length"></span>p
      </span>
    </div>
  </header>

  <main class="px-4 pt-4 pb-8">

    <!-- Themes: the clusters, which are what the threshold makes -->
    <section x-show="lens === 'themes'" class="flex flex-col gap-2 max-w-4xl">
      <template x-for="(c, ci) in clusters" :key="ci">
        <div class="border border-base-300 rounded-lg p-3 bg-base-100">
          <div class="flex items-baseline gap-2 flex-wrap mb-2">
            <template x-for="(f, fi) in c.files" :key="f">
              <span class="text-base">
                <span x-show="fi" class="text-base-content/25">·</span>
                <span class="text-base-content/40" x-text="dir(f)"></span><span class="font-medium" x-text="base(f)"></span>
              </span>
            </template>
          </div>
          <template x-for="e in c.edges" :key="e.a + e.b">
            <div class="flex items-baseline gap-2 py-0.5">
              <span class="tabular-nums text-sm shrink-0 w-7 text-right"
                    :class="e.reg === 'none' ? 'text-primary font-semibold' : 'text-base-content/35'" x-text="e.w"></span>
              <span class="text-base text-base-content/70 leading-6">&ldquo;<span x-text="e.atoms[0]"></span>&rdquo;</span>
            </div>
          </template>
        </div>
      </template>
      <div x-show="!clusters.length" class="text-base text-base-content/40 py-10 text-center">nothing at this threshold</div>
    </section>

    <!-- Arcs: the graph itself, files down the page and shared prose across -->
    <section x-show="lens === 'arcs'" class="max-w-4xl">
      <div class="flex items-stretch gap-2">
        <div class="shrink-0 text-base-content" x-html="arcSvg()"></div>
        <div class="grow min-w-0">
          <template x-for="(f, i) in ordered" :key="f">
            <div class="flex items-center gap-2 truncate" :style="'height:' + ROW + 'px'">
              <span class="w-1.5 h-1.5 rounded-full shrink-0"
                    :class="hot(f) ? 'bg-primary' : 'bg-base-content/20'"></span>
              <span class="text-base truncate min-w-0">
                <span class="text-base-content/40" x-text="dir(f)"></span><span x-text="base(f)"></span>
              </span>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- Atoms: the repeated windows themselves, which are the units -->
    <section x-show="lens === 'atoms'" class="flex flex-col gap-3 max-w-4xl">
      <template x-for="e in edges" :key="e.a + e.b">
        <div class="border-l-2 pl-3" :class="e.reg === 'none' ? 'border-primary' : 'border-base-300'">
          <div class="flex items-baseline gap-2 flex-wrap">
            <span class="tabular-nums text-sm shrink-0"
                  :class="e.reg === 'none' ? 'text-primary font-semibold' : 'text-base-content/35'" x-text="e.w"></span>
            <span class="text-base"><span class="text-base-content/40" x-text="dir(e.a)"></span><span x-text="base(e.a)"></span></span>
            <i class="ph ph-arrows-left-right text-base-content/25"></i>
            <span class="text-base"><span class="text-base-content/40" x-text="dir(e.b)"></span><span x-text="base(e.b)"></span></span>
          </div>
          <template x-for="(a, ai) in e.atoms" :key="ai">
            <p class="text-base text-base-content/70 leading-7 mt-1">&ldquo;<span x-text="a"></span>&rdquo;</p>
          </template>
        </div>
      </template>
    </section>

    <!-- Matrix: the same graph with no layout choices, ordered so a cluster is a block -->
    <section x-show="lens === 'matrix'" class="max-w-4xl">
      <div class="overflow-x-auto">
        <div class="inline-grid gap-px"
             :style="'grid-template-columns: repeat(' + ordered.length + ', 14px)'">
          <template x-for="(cell, ci) in cells" :key="ci">
            <button type="button" @click="pick = cell.e"
                    class="w-[14px] h-[14px] rounded-[2px]"
                    :class="cell.e ? (cell.e.reg === 'none' ? 'bg-primary' : 'bg-base-content') : (cell.diag ? 'bg-base-300' : 'bg-base-200/50')"
                    :style="cell.e ? 'opacity:' + (0.25 + 0.75 * cell.e.w / maxW) : ''"
                    :aria-label="cell.e ? base(cell.e.a) + ' and ' + base(cell.e.b) : ''"></button>
          </template>
        </div>
      </div>
      <div class="mt-4 min-h-16">
        <template x-if="pick">
          <div class="border-l-2 border-primary pl-3">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span class="tabular-nums text-sm text-primary font-semibold" x-text="pick.w"></span>
              <span class="text-base" x-text="pick.a"></span>
              <i class="ph ph-arrows-left-right text-base-content/25"></i>
              <span class="text-base" x-text="pick.b"></span>
            </div>
            <p class="text-base text-base-content/70 leading-7 mt-1">&ldquo;<span x-text="pick.atoms[0]"></span>&rdquo;</p>
          </div>
        </template>
      </div>
    </section>

  </main>

  <footer class="sticky bottom-0 bg-base-100/95 backdrop-blur border-t border-base-300 px-4 py-2
                 flex items-center gap-3 flex-wrap text-sm text-base-content/45 tabular-nums">
    <span><span x-text="data.scanned"></span> markdown files</span>
    <span><span x-text="data.shingle"></span>-word windows</span>
    <span class="text-primary">accent: named by no registry row</span>
  </footer>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('themes', () => ({
    data: JSON.parse(document.getElementById('payload').textContent),
    LENSES: [
      { k: 'themes', n: 'Themes', i: 'ph-graph' },
      { k: 'arcs',   n: 'Arcs',   i: 'ph-flow-arrow' },
      { k: 'atoms',  n: 'Atoms',  i: 'ph-quotes' },
      { k: 'matrix', n: 'Matrix', i: 'ph-grid-nine' },
    ],
    lens: new URLSearchParams(location.search).get('lens') || 'themes',
    th: Number(new URLSearchParams(location.search).get('th')) || 12,
    only: '',
    pick: null,
    ROW: 30,
    GUT: 108,

    get maxW() { return Math.max(...this.data.edges.map(e => e.w)); },

    get edges() {
      return this.data.edges
        .filter(e => e.w >= this.th && (!this.only || e.reg === this.only))
        .sort((x, y) => y.w - x.w);
    },

    // Union-find over whatever survives the threshold. A cluster is what the
    // dial makes, which is why the dial is the first control on the page.
    get clusters() {
      const p = {};
      const find = (x) => { p[x] ??= x; while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; };
      for (const e of this.edges) { const a = find(e.a), b = find(e.b); if (a !== b) p[a] = b; }
      const by = {};
      for (const e of this.edges) (by[find(e.a)] ??= { files: new Set(), edges: [] });
      for (const e of this.edges) {
        const g = by[find(e.a)];
        g.files.add(e.a); g.files.add(e.b); g.edges.push(e);
      }
      return Object.values(by)
        .map(g => ({ files: [...g.files].sort(), edges: g.edges }))
        .sort((x, y) => y.files.length - x.files.length || y.edges[0].w - x.edges[0].w);
    },

    // Cluster order, so arcs bundle and the matrix shows blocks on the diagonal.
    get ordered() { return this.clusters.flatMap(c => c.files); },

    get cells() {
      const o = this.ordered, ix = Object.fromEntries(o.map((f, i) => [f, i]));
      const m = {};
      for (const e of this.edges) { m[ix[e.a] + ':' + ix[e.b]] = e; m[ix[e.b] + ':' + ix[e.a]] = e; }
      const out = [];
      for (let r = 0; r < o.length; r++)
        for (let c = 0; c < o.length; c++)
          out.push({ e: m[r + ':' + c] || null, diag: r === c });
      return out;
    },

    hot(f) { return this.edges.some(e => e.reg === 'none' && (e.a === f || e.b === f)); },

    // Built as a string, not an x-for: Alpine clones a <template> into the HTML
    // namespace, so <path> inside <svg> parses as an unknown HTML element and
    // never draws. Assigning through x-html lets the parser switch namespace.
    arcSvg() {
      const o = this.ordered, R = this.ROW, G = this.GUT, H = Math.max(o.length * R, 1);
      const ix = Object.fromEntries(o.map((f, i) => [f, i * R + R / 2]));
      const paths = this.edges.map(e => {
        const y1 = ix[e.a], y2 = ix[e.b];
        const bx = Math.min(G - 4, 16 + Math.abs(y2 - y1) * 0.42);
        const d = `M ${G},${y1} C ${G - bx},${y1} ${G - bx},${y2} ${G},${y2}`;
        const hot = e.reg === 'none';
        return `<path d="${d}" fill="none" stroke-linecap="round" stroke="${hot ? 'var(--color-primary)' : 'currentColor'}"`
             + ` stroke-opacity="${hot ? 0.75 : 0.18}" stroke-width="${(1 + 4 * (e.w / this.maxW)).toFixed(2)}"/>`;
      }).join('');
      return `<svg width="${G}" height="${H}" viewBox="0 0 ${G} ${H}">${paths}</svg>`;
    },

    dir(p) { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i + 1); },
    base(p) { return p.slice(p.lastIndexOf('/') + 1); },
  }));
});
</script>
</body>
</html>
