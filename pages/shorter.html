<!doctype html>
<html lang="en" data-theme="winter">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💎</text></svg>">
  <link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>

  <script type="module">
    // ?use=<branch|tag|sha> picks which ref the lib chain loads from; defaults
    // to main. gh-api.js auto-boots window.gh from its import URL or window.__ghBlobBoot.
    const ref = new URLSearchParams(location.search).get('use');
    if (ref) {
      window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref };
      const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/lib/gh-api.js`);
      if (!r.ok) throw new Error(`?use=${ref}: could not fetch gh-api.js (HTTP ${r.status})`);
      const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
      try { await import(u); } finally { URL.revokeObjectURL(u); }
    } else {
      await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
    }
    await gh.load('url-params.js');
    await gh.load('shorter-payload.js');
    await gh.load('shorter-merge.js');
    // Alpine last, so the component's init() finds the helpers defined. Same
    // boot order as the other renderer pages.
    await gh.load('alpine-bundle.js');
  </script>

  <!--
    Shorter: a proposal-adjudication tool.

    You bring a document and one or more shorter versions of it. The page puts
    every version onto one surface anchored on the original (lib/shorter-merge.js),
    so each place the versions disagree becomes a single decision carrying one
    option per distinct wording. The work is subtraction: pick a version as the
    baseline, walk the decisions where you would have cut differently, copy the
    assembled result. Getting a shortening is cheap; going through it piece by
    piece is what this page is for.

    Two ways the versions arrive. Pasted by hand, one or several, which is the
    everyday case. Or seeded from a committed bundle, which is what the
    shorter/2 envelope exists for: several independent shortenings written by a
    model under different instructions, stored as sparse block maps so the
    bundle stays small, adjudicated here.

    The local model (Llama-3.2-1B via web-llm, WebGPU) is OPTIONAL, lazy, and
    deliberately secondary: a 1B model is a poor whole-document editor, and the
    seeded-bundle path is the answer to that. It stays for one job it is
    adequate at, rewriting a single span on request. Nothing is fetched from
    huggingface.co until a ✨ action is pressed.

    Input by URL, first match wins (contract: docs/envelopes/shorter.md):
      #gz=<base64url>   gzipped text or envelope in the fragment
      ?src=<spec>       owner/repo[@ref]:path, via the contents API
      (neither)         the empty form
    Each key is read fragment first, query as fallback (lib/url-params.js).
    Prose is unbounded, so it belongs in '#'; ?src= is how the #shorter= toss
    route hands an address to this page through toss-render's params shim.

    UI note: no explanatory paragraphs. Anything a caption would have said is
    carried by a label, a count, an ordering, or a title= tooltip.
  -->

  <style>
    body { -webkit-font-smoothing:antialiased; }

    .review { white-space:pre-wrap; word-break:break-word; line-height:2.1; font-size:1.05rem; }

    /* A decision. Colour names WHICH version is currently selected, so a skim
       reads as a map of whose cut is in force where; the original reads as
       untouched prose with a dotted underline. The palette is defined once
       here and mirrored by --v<i> on the chips and popover rows. */
    .seg { border-radius:4px; padding:1px 2px; transition:background .12s, box-shadow .12s; }
    .seg-choice { cursor:pointer; }
    .seg-choice:hover { filter:brightness(.97); }
    .seg-orig { box-shadow:inset 0 -1px 0 rgba(100,116,139,.55); }
    .seg-orig:hover { background:rgba(100,116,139,.10); }
    .seg-v { box-shadow:inset 0 -1.5px 0 var(--vc); background:color-mix(in srgb, var(--vc) 16%, transparent); }
    .seg-v:hover { background:color-mix(in srgb, var(--vc) 26%, transparent); }
    .seg-empty { padding:1px 5px; color:#94a3b8; background:#f1f5f9; box-shadow:inset 0 -1px 0 #cbd5e1; }
    .seg-active { outline:2px solid #4f46e5; outline-offset:2px; }
    .seg-flash { animation:flash 1s ease-out; }
    @keyframes flash { from { background:#fde68a; } to { background:transparent; } }

    .v0 { --vc:#16a34a; } .v1 { --vc:#2563eb; } .v2 { --vc:#d97706; }
    .v3 { --vc:#9333ea; } .v4 { --vc:#0891b2; } .v5 { --vc:#db2777; }
    .vo { --vc:#64748b; }

    .pop { box-shadow:0 12px 40px -8px rgba(0,0,0,.35); }
    .clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .clamp3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .rail { scrollbar-width:thin; }
  </style>
</head>

<body class="min-h-dvh bg-base-200 text-base-content">
<!-- No x-init here: Alpine calls a component's own init() automatically, and
     this one is not idempotent (it seeds the first version card). -->
<div x-data="shorter()" class="mx-auto max-w-7xl px-3 py-4 sm:px-4 sm:py-6">

  <!-- ── header ─────────────────────────────────────────────────────── -->
  <header class="mb-4 flex items-center gap-3">
    <h1 class="flex items-center gap-2 text-2xl font-semibold tracking-tight">
      <svg viewBox="0 0 24 24" class="h-6 w-6 text-primary" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M7 4 H17 L21 9 L12 20 L3 9 Z" fill="currentColor" fill-opacity=".1"/>
        <path d="M3 9 H21"/><path d="M7 4 L9 9 L12 4 L15 9 L17 4"/><path d="M9 9 L12 20 L15 9"/>
      </svg>
      <span x-text="docTitle || 'Shorter'"></span>
    </h1>
    <!-- The model chip earns its place only once the model is doing something.
         Idle, it was a permanent label for a feature most sessions never use. -->
    <span x-show="model.status!=='idle'" class="badge badge-sm gap-1"
          :class="{'badge-warning':model.status==='loading','badge-success':model.status==='ready','badge-error':model.status==='error'}"
          :title="model.error || 'Local model, running in your browser'">
      <i class="ph" :class="{'ph-spinner-gap animate-spin':model.status==='loading','ph-check-circle':model.status==='ready','ph-warning-circle':model.status==='error'}"></i>
      <span x-text="model.status==='loading' ? model.pct+'%' : (model.status==='error' ? 'no model' : 'model')"></span>
    </span>
  </header>

  <!-- ══ EDIT ════════════════════════════════════════════════════════ -->
  <template x-if="mode==='edit'">
    <div class="mx-auto max-w-5xl">
      <div x-show="linkError" class="alert alert-warning mb-4 text-sm">
        <i class="ph ph-warning"></i><span x-text="linkError"></span>
      </div>

      <!-- original -->
      <section class="mb-4">
        <div class="mb-1.5 flex items-center gap-2">
          <span class="text-sm font-medium">Original</span>
          <span class="text-xs tabular-nums text-base-content/50" x-text="w(original)+' words'"></span>
          <span class="ml-auto flex items-center gap-0.5">
            <button class="btn btn-ghost btn-xs btn-square" title="Copy the original"
                    :disabled="!original" @click="copy(original,'orig')">
              <i class="ph" :class="copiedKey==='orig' ? 'ph-check text-success' : 'ph-copy'"></i>
            </button>
            <button class="btn btn-ghost btn-xs btn-square" title="Paste over the original" @click="pasteInto('original')">
              <i class="ph ph-clipboard-text"></i>
            </button>
            <button class="btn btn-ghost btn-xs btn-square" title="Clear everything"
                    :disabled="!original && !versions.some(v=>v.text)" @click="clearAll()">
              <i class="ph ph-eraser"></i>
            </button>
          </span>
        </div>
        <textarea x-model="original" class="textarea textarea-bordered min-h-44 w-full leading-relaxed"></textarea>
      </section>

      <!-- versions -->
      <section class="grid gap-3 sm:grid-cols-2">
        <template x-for="(v,i) in versions" :key="v.key">
          <div class="rounded-box border border-base-300 bg-base-100 p-2.5" :class="'v'+(i%6)">
            <div class="mb-1.5 flex items-center gap-1.5">
              <span class="h-2.5 w-2.5 shrink-0 rounded-full" :style="'background:var(--vc)'"></span>
              <input x-model="v.label" class="input input-xs input-ghost w-28 px-1 font-medium"
                     title="Name this version; the name is what you pick by later">
              <span class="text-xs tabular-nums text-base-content/50"
                    x-text="v.text.trim() ? w(v.text)+'w · '+pct(v.text) : ''"></span>
              <span class="ml-auto flex items-center gap-0.5">
                <button class="btn btn-ghost btn-xs btn-square" title="Copy this version"
                        :disabled="!v.text" @click="copy(v.text,'v'+i)">
                  <i class="ph" :class="copiedKey==='v'+i ? 'ph-check text-success' : 'ph-copy'"></i>
                </button>
                <button class="btn btn-ghost btn-xs btn-square" title="Paste into this version" @click="pasteInto(i)">
                  <i class="ph ph-clipboard-text"></i>
                </button>
                <button class="btn btn-ghost btn-xs btn-square" title="Remove this version"
                        :disabled="versions.length<2" @click="removeVersion(i)">
                  <i class="ph ph-x"></i>
                </button>
              </span>
            </div>
            <textarea x-model="v.text" class="textarea textarea-bordered min-h-36 w-full text-sm leading-relaxed"></textarea>
            <div class="mt-1 flex items-center gap-1">
              <input x-model="v.note" class="input input-xs input-ghost flex-1 px-1 text-xs text-base-content/60"
                     placeholder="note" title="A line about what this version does, shown when you choose between them">
              <button x-show="!v.text.trim()" class="btn btn-ghost btn-xs gap-1" :disabled="!original.trim() || v.busy"
                      title="Draft this version with a small model in your browser. Slow, and weaker than pasting one in."
                      @click="draft(i)">
                <i class="ph" :class="v.busy ? 'ph-spinner-gap animate-spin' : 'ph-sparkle'"></i>
                <span x-text="v.busy ? (model.note||'working') : 'draft locally'"></span>
              </button>
            </div>
          </div>
        </template>

        <button class="rounded-box border border-dashed border-base-300 py-6 text-sm text-base-content/50 transition hover:border-primary hover:text-primary"
                title="Adjudicate several shortenings at once" @click="addVersion()">
          <i class="ph ph-plus"></i> version
        </button>
      </section>

      <div class="mt-4 flex items-center gap-2">
        <button class="btn btn-primary gap-2" :disabled="!canReview" @click="review()">
          <i class="ph ph-git-diff"></i> Review
          <span x-show="readyCount>1" class="badge badge-sm badge-neutral" x-text="readyCount"></span>
        </button>
        <button class="btn btn-ghost btn-sm gap-2" title="Load a short worked example" @click="loadExample()">
          <i class="ph ph-book-open-text"></i> Example
        </button>
      </div>
    </div>
  </template>

  <!-- ══ REVIEW ══════════════════════════════════════════════════════ -->
  <template x-if="mode==='review'">
    <div class="flex gap-4">

      <!-- ── rail ───────────────────────────────────────────────── -->
      <aside class="rail sticky top-4 hidden max-h-[calc(100dvh-2rem)] w-72 shrink-0 flex-col gap-3 overflow-y-auto lg:flex">
        <div class="rounded-box border border-base-300 bg-base-100 p-2.5">
          <div class="mb-2 flex items-baseline gap-1.5">
            <span class="text-lg font-semibold tabular-nums" x-text="curWords"></span>
            <span class="text-xs text-base-content/50">of</span>
            <span class="text-xs tabular-nums text-base-content/50" x-text="baseWords"></span>
            <span class="badge badge-sm ml-auto" :class="reduction>=0?'badge-success badge-outline':'badge-error badge-outline'"
                  x-text="(reduction>=0?'−':'+')+Math.abs(reduction)+'%'"></span>
          </div>
          <!-- Wholesale baselines. One tap sets every decision to that version,
               so comparing whole shortenings is a tap, not 88 clicks. -->
          <div class="flex flex-col gap-1">
            <button class="vo flex items-center gap-2 rounded-btn border px-2 py-1 text-left text-xs transition"
                    :class="baseline==='original' ? 'border-base-content/40 bg-base-200' : 'border-transparent hover:bg-base-200'"
                    title="Set every decision back to the original wording" @click="applyAll('original')">
              <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:var(--vc)"></span>
              <span class="font-medium">Original</span>
              <span class="ml-auto tabular-nums text-base-content/45" x-text="baseWords+'w'"></span>
            </button>
            <template x-for="(v,i) in versions" :key="v.key">
              <button class="flex items-start gap-2 rounded-btn border px-2 py-1 text-left text-xs transition"
                      :class="[ 'v'+(i%6), baseline===v.label ? 'border-base-content/40 bg-base-200' : 'border-transparent hover:bg-base-200' ]"
                      :title="v.note || ('Apply '+v.label+' throughout')" @click="applyAll(v.label)">
                <span class="mt-1 h-2.5 w-2.5 shrink-0 rounded-full" style="background:var(--vc)"></span>
                <span class="min-w-0 flex-1">
                  <span class="flex items-baseline gap-1">
                    <span class="truncate font-medium" x-text="v.label"></span>
                    <span class="ml-auto shrink-0 tabular-nums text-base-content/45"
                          x-text="w(v.text)+'w · '+pct(v.text)"></span>
                  </span>
                  <span x-show="v.note" class="clamp2 mt-0.5 block text-[11px] leading-snug text-base-content/50" x-text="v.note"></span>
                </span>
              </button>
            </template>
          </div>
        </div>

        <!-- decisions -->
        <div class="rounded-box border border-base-300 bg-base-100 p-2.5">
          <div class="mb-1.5 flex items-center gap-1.5 text-xs">
            <span class="font-medium" x-text="decisions.length+' decisions'"></span>
            <label class="ml-auto flex cursor-pointer items-center gap-1 text-base-content/60"
                   title="Show only the decisions where you moved off the baseline">
              <input type="checkbox" class="checkbox checkbox-xs" x-model="onlyTouched"> touched
            </label>
          </div>
          <div class="flex flex-col">
            <template x-for="seg in visibleDecisions" :key="seg.id">
              <button class="flex items-start gap-1.5 rounded-btn border-l-2 px-1.5 py-1 text-left text-[11px] leading-snug transition hover:bg-base-200"
                      :class="[ vClass(sel(seg)), activeId===seg.id ? 'bg-base-200' : '' ]"
                      :style="'border-color:'+(sel(seg).isOriginal ? '#94a3b8' : 'var(--vc)')"
                      @click="jumpTo(seg)">
                <span class="min-w-0 flex-1">
                  <span class="clamp2 block text-base-content/70" x-text="preview(seg)"></span>
                  <span class="mt-0.5 flex items-center gap-1 text-[10px] text-base-content/45">
                    <span x-text="sel(seg).label"></span>
                    <span x-show="touched(seg)" class="text-primary" title="You changed this one">•</span>
                    <span class="ml-auto tabular-nums" x-text="delta(seg)"></span>
                  </span>
                </span>
              </button>
            </template>
          </div>
        </div>
      </aside>

      <!-- ── document ───────────────────────────────────────────── -->
      <div class="min-w-0 flex-1">
        <div class="sticky top-2 z-20 mb-3 flex flex-wrap items-center gap-2 rounded-box border border-base-300 bg-base-100/95 px-2.5 py-1.5 shadow-sm backdrop-blur">
          <button class="btn btn-ghost btn-sm btn-square" title="Back to the inputs" @click="mode='edit'">
            <i class="ph ph-arrow-left"></i>
          </button>
          <div class="flex items-center gap-1.5 text-sm lg:hidden">
            <span class="tabular-nums font-semibold" x-text="curWords"></span>
            <span class="badge badge-sm" :class="reduction>=0?'badge-success badge-outline':'badge-error badge-outline'"
                  x-text="(reduction>=0?'−':'+')+Math.abs(reduction)+'%'"></span>
          </div>
          <!-- On narrow screens the rail's baselines collapse to this select,
               which is the one control you cannot work without. -->
          <select class="select select-bordered select-sm max-w-40 lg:hidden" @change="applyAll($event.target.value)"
                  title="Apply a version throughout">
            <option value="original" :selected="baseline==='original'">Original</option>
            <template x-for="v in versions" :key="v.key">
              <option :value="v.label" :selected="baseline===v.label" x-text="v.label+' · '+pct(v.text)"></option>
            </template>
          </select>
          <button class="btn btn-ghost btn-sm btn-square ml-auto" title="Download the result as a file" @click="download()">
            <i class="ph ph-download-simple"></i>
          </button>
          <button class="btn btn-primary btn-sm gap-1.5" title="Copy the assembled result" @click="copy(assembled,'result')">
            <i class="ph" :class="copiedKey==='result' ? 'ph-check' : 'ph-copy'"></i>
            <span x-text="copiedKey==='result' ? 'Copied' : 'Copy'"></span>
          </button>
        </div>

        <!-- The container is white-space:pre-wrap so paragraph breaks in the
             source survive, which means every character between these spans
             renders literally. The x-for is therefore on one line with no
             incidental whitespace; the only whitespace in the flow is the
             segment text itself. -->
        <article class="review rounded-box border border-base-300 bg-base-100 p-4 sm:p-6"
          ><template x-for="seg in segments" :key="seg.id"><span :id="'seg'+seg.id" class="seg" :class="segClass(seg)" @click="seg.kind==='choice' && !seg.trivial && openPop(seg,$event)"><template x-if="seg.kind==='equal'"><span x-text="seg.text"></span></template><template x-if="seg.kind==='choice' && !isEmpty(seg)"><span x-text="sel(seg).text"></span></template><template x-if="seg.kind==='choice' && isEmpty(seg) && !seg.trivial"><span class="seg-empty"><i class="ph ph-dots-three"></i></span></template><template x-if="seg.busy"><span class="loading loading-dots loading-xs align-middle text-primary"></span></template></span></template></article>
      </div>
    </div>
  </template>

  <!-- ── popover: one decision ──────────────────────────────────────── -->
  <div x-show="activeId!==null" x-transition.opacity @click="closePop()" class="fixed inset-0 z-30" style="display:none"></div>
  <div x-show="activeId!==null && aSeg()" x-transition @click.stop style="display:none"
       class="pop fixed z-40 w-[min(26rem,calc(100vw-1.5rem))] rounded-box border border-base-300 bg-base-100 p-2.5"
       :style="popStyle()">
    <template x-if="aSeg()">
      <div>
        <div class="mb-1.5 flex items-center gap-2">
          <span class="text-[11px] font-semibold uppercase tracking-wide text-base-content/45"
                x-text="(decisions.indexOf(aSeg())+1)+' of '+decisions.length"></span>
          <span class="ml-auto flex gap-0.5">
            <button class="btn btn-ghost btn-xs btn-square" title="Previous decision" @click="step(-1)"><i class="ph ph-caret-up"></i></button>
            <button class="btn btn-ghost btn-xs btn-square" title="Next decision" @click="step(1)"><i class="ph ph-caret-down"></i></button>
            <button class="btn btn-ghost btn-xs btn-square" title="Close" @click="closePop()"><i class="ph ph-x"></i></button>
          </span>
        </div>

        <div class="rail flex max-h-[22rem] flex-col gap-1 overflow-y-auto pr-0.5">
          <template x-for="opt in aSeg().options" :key="opt.id">
            <button class="w-full rounded-btn border px-2 py-1.5 text-left transition"
                    :class="[ opt.isOriginal ? 'vo' : 'v'+(opt.vi%6),
                              aSeg().selected===opt.id ? 'bg-base-200' : 'hover:bg-base-200/60' ]"
                    :style="'border-color:'+(aSeg().selected===opt.id ? 'var(--vc)' : 'transparent')"
                    @click="pick(aSeg(),opt.id)">
              <div class="flex items-center gap-1.5">
                <span class="h-2 w-2 shrink-0 rounded-full" style="background:var(--vc)"></span>
                <span class="truncate text-xs font-medium" x-text="opt.label"></span>
                <span x-show="opt.isOriginal && opt.agreed.length" class="truncate text-[10px] text-base-content/45"
                      :title="'These versions did not cut here: '+opt.agreed.join(', ')"
                      x-text="'· kept by '+opt.agreed.join(', ')"></span>
                <span class="ml-auto shrink-0 text-[10px] tabular-nums text-base-content/45" x-text="w(opt.text)+'w'"></span>
              </div>
              <div class="clamp3 mt-1 text-xs leading-snug"
                   :class="opt.text.trim() ? 'text-base-content/80' : 'italic text-base-content/40'"
                   x-text="opt.text.trim() || '(nothing; removes this passage)'"></div>
            </button>
          </template>
        </div>

        <div x-show="aSeg().error" class="mt-1.5 rounded-btn bg-error/10 px-2 py-1 text-[11px] text-error" x-text="aSeg().error"></div>

        <div class="mt-2 flex items-center gap-1">
          <button class="btn btn-ghost btn-xs gap-1" @click="toggleWrite()" title="Write your own wording for this passage">
            <i class="ph ph-pencil-simple"></i> write
          </button>
          <button class="btn btn-ghost btn-xs gap-1" :disabled="aSeg().busy" @click="shorten(aSeg())"
                  title="Rewrite just this passage with the small in-browser model">
            <i class="ph" :class="aSeg().busy ? 'ph-spinner-gap animate-spin' : 'ph-sparkle'"></i> local
          </button>
        </div>

        <div x-show="writing" class="mt-1.5">
          <textarea x-model="draftText" rows="3" class="textarea textarea-bordered textarea-xs w-full leading-snug"></textarea>
          <div class="mt-1 flex justify-end gap-1">
            <button class="btn btn-ghost btn-xs" @click="writing=false">cancel</button>
            <button class="btn btn-primary btn-xs" :disabled="!draftText.trim()" @click="saveCustom(aSeg())">use</button>
          </div>
        </div>
      </div>
    </template>
  </div>

</div>

<script>
function shorter() {
  return {
    mode: 'edit',
    docTitle: '',
    original: '',
    versions: [],            // [{key, label, note, text, busy}]
    segments: [],
    baseline: 'original',    // which version was last applied wholesale
    onlyTouched: false,
    touchedIds: [],
    copiedKey: '',
    linkError: '',
    activeId: null,
    anchor: null,
    writing: false,
    draftText: '',
    model: { status: 'idle', pct: 0, note: '', error: '', engine: null, _loading: null },
    _key: 0,

    async init() {
      this.addVersion();
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') this.closePop();
        if (this.activeId !== null && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault(); this.step(e.key === 'ArrowDown' ? 1 : -1);
        }
      });
      await this.ingestLink();
    },

    // ── input by URL ─────────────────────────────────────────────────
    //   #gz=<base64url>   gzipped text or envelope, carried in the link
    //   ?src=<spec>       owner/repo[@ref]:path, fetched via the contents API
    //   (neither)         the empty form
    // Fragment first, query as fallback, per key (lib/url-params.js): the text
    // wants '#' because a query string is capped at roughly 8KB by the Pages
    // edge, while ?src= is how a routed toss delivers an address through
    // toss-render's params shim.
    // window.__shorterLoc is the BAKED channel: a self-contained copy of this
    // page (published as an artifact, or opened from file://) has no address
    // bar to read, so it sets {hash} here and the page reads its payload from
    // that instead. UrlParams.get already takes the location to read, so this
    // costs one argument rather than a second input path.
    async ingestLink() {
      const loc = window.__shorterLoc || undefined;
      const gz = UrlParams.get('gz', loc);
      const src = UrlParams.get('src', loc);
      if (!gz && !src) return;
      try {
        let payload;
        if (gz) {
          payload = ShorterPayload.read(await this.gunzipB64url(gz));
        } else {
          const spec = ShorterPayload.parseSpec(src);
          payload = ShorterPayload.read(await this.fetchSpec(spec, src), { name: spec ? spec.path : src });
        }
        this.original = payload.original;
        if (payload.proposals.length) {
          this.versions = payload.proposals.map(p => ({ key: this._key++, label: p.label, note: p.note, text: p.text, busy: false }));
        }
        if (payload.title) { this.docTitle = payload.title; document.title = payload.title + ' · Shorter'; }
        if (ShorterPayload.isReviewable(payload)) this.review();
      } catch (e) {
        this.linkError = 'Could not read that link: ' + (e?.message || e);
      }
    },

    async fetchSpec(spec, raw) {
      const g = spec
        ? new window.GH({ token: window.TOKEN, repo: spec.repo, ref: spec.ref })
        : new window.GH({ token: window.TOKEN, repo: 'mehrlander/web-tools', ref: 'main' });
      return (await g.get(spec ? spec.path : String(raw || ''))).text;
    },
    async gunzipB64url(s) {
      const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (s.length % 4)) % 4);
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    },

    // ── helpers ──────────────────────────────────────────────────────
    w(s) { return ShorterMerge.words(s); },
    pct(text) {
      const b = this.w(this.original);
      return b ? Math.round(this.w(text) / b * 100) + '%' : '';
    },
    get readyCount() { return this.versions.filter(v => v.text.trim()).length; },
    get canReview() { return !!this.original.trim() && this.readyCount > 0; },
    // Every choice segment, including the whitespace-only ones a reflow
    // produced. applyAll walks THESE, so a version still reassembles byte for
    // byte; only `decisions` is the reader-facing list.
    get choices() { return this.segments.filter(s => s.kind === 'choice'); },
    get decisions() { return this.choices.filter(s => !s.trivial); },
    get visibleDecisions() { return this.onlyTouched ? this.decisions.filter(s => this.touched(s)) : this.decisions; },
    sel(seg) { return seg.options.find(o => o.id === seg.selected) || seg.options[0]; },
    isEmpty(seg) { return this.sel(seg).text === ''; },
    touched(seg) { return this.touchedIds.includes(seg.id); },
    vClass(opt) { return opt.isOriginal ? 'vo' : 'v' + (opt.vi % 6); },
    segClass(seg) {
      // A trivial region is a line wrap, not a question: render it as prose.
      if (seg.kind === 'equal' || seg.trivial) return 'seg-equal';
      const o = this.sel(seg);
      const base = 'seg-choice ' + this.vClass(o) + ' ' + (o.isOriginal ? 'seg-orig' : 'seg-v');
      return base + (this.activeId === seg.id ? ' seg-active' : '');
    },
    preview(seg) {
      const t = (seg.options[0].text || '').trim().replace(/\s+/g, ' ');
      // An empty ORIGINAL means every version added something here, which is
      // the opposite of a deletion and used to be labelled as one.
      if (!t) return '(an insertion)';
      return t.length > 90 ? t.slice(0, 90) + '…' : t;
    },
    delta(seg) {
      const d = this.w(this.sel(seg).text) - this.w(seg.options[0].text);
      return d === 0 ? '0' : (d > 0 ? '+' : '−') + Math.abs(d);
    },

    get assembled() {
      return this.segments.map(s => s.kind === 'equal' ? s.text : this.sel(s).text).join('');
    },
    get baseWords() { return this.w(this.original); },
    get curWords() { return this.w(this.assembled); },
    get reduction() {
      const b = this.baseWords;
      return b ? Math.round((1 - this.curWords / b) * 100) : 0;
    },

    // ── edit-mode actions ────────────────────────────────────────────
    addVersion() {
      this.versions.push({ key: this._key++, label: 'Version ' + (this.versions.length + 1), note: '', text: '', busy: false });
    },
    removeVersion(i) { this.versions.splice(i, 1); },
    clearAll() { this.original = ''; this.versions = []; this.addVersion(); this.segments = []; this.docTitle = ''; },
    async copy(text, key) {
      try { await navigator.clipboard.writeText(text); }
      catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      this.copiedKey = key; setTimeout(() => { if (this.copiedKey === key) this.copiedKey = ''; }, 1400);
    },
    async pasteInto(target) {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return;
        if (target === 'original') this.original = text; else this.versions[target].text = text;
      } catch (e) {
        this.linkError = 'The browser would not hand over the clipboard; paste into the box directly.';
      }
    },
    download() {
      const name = (this.docTitle || 'shorter').replace(/[^\w.-]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
      const url = URL.createObjectURL(new Blob([this.assembled], { type: 'text/markdown' }));
      const a = document.createElement('a');
      a.href = url; a.download = name + '.md'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
    loadExample() {
      this.original = "In light of the fact that the committee had not yet reached a final determination on the matter, it was decided by the members that they would postpone the vote until such time as additional information could be gathered and reviewed in a comprehensive manner.\n\nIt is worth noting that several of the participants expressed a degree of concern regarding the timeline, which they felt was perhaps somewhat too aggressive given the current circumstances.";
      this.versions = [
        { key: this._key++, label: 'Tight', note: 'Same coverage, plainer sentences.', busy: false,
          text: "Because the committee had not yet decided, the members postponed the vote until they could gather and review more information.\n\nSeveral participants worried the timeline was too aggressive." },
        { key: this._key++, label: 'Minutes', note: 'Reduced to the decisions only.', busy: false,
          text: "The committee postponed the vote pending more information.\n\nSeveral participants objected to the timeline." },
      ];
    },

    // ── review ───────────────────────────────────────────────────────
    review() {
      const list = this.versions.filter(v => v.text.trim());
      if (!this.original.trim() || !list.length) return;
      this.segments = ShorterMerge.build(this.original, list, Diff.diffWordsWithSpace);
      this.touchedIds = [];
      this.applyAll(list[0].label);          // a readable result on arrival, not a wall of untouched original
      this.mode = 'review';
    },

    // Set every decision to one version's wording. A version that did not cut
    // at a given decision has no option of its own there, so it falls through
    // to the original, which is exactly what that version says.
    applyAll(which) {
      for (const seg of this.choices) {
        const hit = which === 'original' ? null : seg.options.find(o => o.agreed.includes(which));
        seg.selected = hit ? hit.id : seg.options[0].id;
      }
      this.baseline = which;
      this.touchedIds = [];
    },
    pick(seg, id) {
      seg.selected = id;
      if (!this.touchedIds.includes(seg.id)) this.touchedIds.push(seg.id);
    },

    jumpTo(seg) {
      const el = document.getElementById('seg' + seg.id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('seg-flash');
        setTimeout(() => el.classList.remove('seg-flash'), 1000);
        this.activeId = seg.id;
        this.anchor = el.getBoundingClientRect();
        this.writing = false;
      }
    },
    step(dir) {
      const list = this.decisions;
      const i = list.findIndex(s => s.id === this.activeId);
      const next = list[i + dir];
      if (next) this.jumpTo(next);
    },

    // ── popover ──────────────────────────────────────────────────────
    aSeg() { return this.activeId === null ? null : this.segments.find(s => s.id === this.activeId); },
    openPop(seg, ev) {
      this.activeId = seg.id;
      this.anchor = ev.currentTarget.getBoundingClientRect();
      this.writing = false; this.draftText = '';
    },
    closePop() { this.activeId = null; this.writing = false; },
    popStyle() {
      if (!this.anchor) return '';
      const vw = window.innerWidth, vh = window.innerHeight;
      if (vw < 640) return 'left:0.75rem; right:0.75rem; bottom:0.75rem;';
      const width = Math.min(416, vw - 24);
      const left = Math.min(Math.max(this.anchor.left, 12), vw - width - 12);
      let top = this.anchor.bottom + 8;
      if (top > vh - 240) top = Math.max(12, this.anchor.top - 8 - 380);
      return `left:${left}px; top:${top}px; width:${width}px;`;
    },
    toggleWrite() {
      this.writing = !this.writing;
      if (this.writing) this.draftText = this.sel(this.aSeg()).text;
    },
    saveCustom(seg) {
      this.addOption(seg, 'Yours', this.draftText);
      this.writing = false; this.draftText = '';
    },
    addOption(seg, label, text) {
      const n = seg.options.filter(o => o.custom).length + 1;
      const id = 'custom' + n;
      seg.options.push({ id, label: label + (n > 1 ? ' ' + n : ''), agreed: [], isOriginal: false, vi: 5, text, custom: true });
      this.pick(seg, id);
    },

    // ── the local model, kept to the one job it is adequate at ───────
    async ensureModel() {
      if (this.model.engine) return this.model.engine;
      if (this.model._loading) return this.model._loading;
      this.model.status = 'loading'; this.model.pct = 0; this.model.error = '';
      this.model._loading = (async () => {
        if (!('gpu' in navigator)) throw new Error('This browser has no WebGPU. Try current Chrome or Edge on desktop, or Safari 26+.');
        if (!('caches' in window)) throw new Error('The Cache API is unavailable here (opaque origin); open the page from its https URL.');
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error('WebGPU is present but no GPU adapter was found.');
        const name = adapter.features.has('shader-f16')
          ? 'Llama-3.2-1B-Instruct-q4f16_1-MLC' : 'Llama-3.2-1B-Instruct-q4f32_1-MLC';
        const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.84');
        const engine = await CreateMLCEngine(name, {
          initProgressCallback: p => { this.model.pct = Math.round((p.progress || 0) * 100); },
        });
        this.model.engine = engine; this.model.status = 'ready';
        return engine;
      })().catch(e => { this.model.status = 'error'; this.model.error = e.message; throw e; })
        .finally(() => { this.model._loading = null; });
      return this.model._loading;
    },

    async generate(engine, text) {
      const limit = Math.max(1, this.w(text) - 1);
      const res = await engine.chat.completions.create({
        messages: [
          { role: 'system', content: 'You are a severe but faithful editor. Preserve meaning, stance, factual qualifications, and voice. Add nothing. Return only the rewritten text, with no explanation, label, or quotation marks.' },
          { role: 'user', content: `Rewrite in no more than ${limit} words:\n\n${text}` },
        ],
        temperature: 0.8, max_tokens: 400,
      });
      return (res.choices[0]?.message?.content || '').trim();
    },

    async draft(i) {
      const v = this.versions[i];
      if (v.busy) return;
      v.busy = true; this.model.note = 'loading';
      try {
        const engine = await this.ensureModel();
        this.model.note = 'drafting';
        v.text = await this.generate(engine, this.original);
        if (!v.note) v.note = 'Drafted in-browser by Llama-3.2-1B.';
      } catch (e) {
        this.linkError = 'Local model unavailable: ' + e.message + ' Paste a version in instead.';
      } finally { v.busy = false; this.model.note = ''; }
    },

    async shorten(seg) {
      if (seg.busy) return;
      const base = seg.options[0].text;
      const lead = (base.match(/^\s*/) || [''])[0];
      const trail = (base.match(/\s*$/) || [''])[0];
      seg.busy = true; seg.error = '';
      try {
        const engine = await this.ensureModel();
        const out = await this.generate(engine, base.trim());
        if (!out) throw new Error('Model returned nothing.');
        this.addOption(seg, 'Local', lead + out + trail);
      } catch (e) {
        seg.error = e.message;
      } finally { seg.busy = false; }
    },
  };
}
</script>
</body>
</html>
