<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Tools moved to /app/</title>
<!--
  The app moved to app/index.html on 2026-08-16, off the pages/ catalog it was
  never one of. This stub is the only thing standing between that move and 151
  files in other repos (web-tools-private 112, home 38, shortcut-tools 1) that
  name this address and cannot be edited from here, plus every link ever handed
  to a reader or saved on a phone.

  It redirects in script rather than by meta refresh because the FRAGMENT is
  the payload: every #gh=, #stage=, #data= address this app answers lives in
  the hash, which a meta refresh drops. The meta below is the fallback for a
  reader with script off, and it deliberately loses the hash rather than
  pretending otherwise.

  Do not delete this file. It has no expiry: the addresses it serves are in
  other people's saved links, not in this repo's control.
-->
<meta http-equiv="refresh" content="3; url=../../app/">
<link rel="icon" type="image/svg+xml" href="../../lib/favicon.svg">
<script>
  // Preserve the query and the hash verbatim. replace() rather than assign()
  // so the stub does not sit in history between a reader and the back button.
  location.replace('../../app/' + location.search + location.hash);
</script>
<style>
  body { font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0;
         min-height: 100vh; display: grid; place-items: center; padding: 2rem;
         background: #fff; color: #1f2937; }
  @media (prefers-color-scheme: dark) { body { background: #1d232a; color: #a6adbb; } }
  main { max-width: 32rem; text-align: center; }
  code { font-family: ui-monospace, monospace; font-size: .9em; }
  a { color: #570df8; }
  @media (prefers-color-scheme: dark) { a { color: #7c9cf5; } }
</style>
</head>
<body>
<main>
  <h1>Web Tools moved</h1>
  <p>This address now lives at <code>/web-tools/app/</code>. Redirecting.</p>
  <p><a href="../../app/">Open the Web Tools app</a></p>
</main>
</body>
</html>
